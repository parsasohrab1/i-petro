name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Python syntax
        run: python -m compileall -q agent

      - name: Unit tests
        run: python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # platform/index.html is the whole dashboard (one inline script); a syntax error breaks every tab.
      - name: Dashboard script syntax
        run: |
          node -e '
            const s=require("fs").readFileSync("platform/index.html","utf8");
            const blocks=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(b=>b.trim());
            if(!blocks.length) throw new Error("no inline script found");
            blocks.forEach((b,i)=>{ try{ new Function(b); }catch(e){ console.error("script #"+i+": "+e.message); process.exit(1); } });
            console.log(blocks.length+" script block(s) OK");'

      - name: JSON files are valid
        run: |
          for f in config.json *_seed.json platform/*.json data/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

  # CD: on main, keep a downloadable build of the dashboard and guide. Nothing is published publicly:
  # the repository holds private business data, so GitHub Pages is intentionally not used (see README).
  package:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ipetro-platform-${{ github.sha }}
          path: |
            platform/index.html
            docs/index.html
            docs/ipetro/iPetro-User-Guide.pdf
          retention-days: 30

<title>Petro Pala Toos Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: control-room console in the PTQ brand: charcoal and white with one flame-red signal for actions and alerts;
   persistent top rail with six modules, a sub-rail per module, dense tables that stack to cards on phones. */
:root{
  --bg:#f5f4f3; --surface:#ffffff; --sunken:#ecebea; --ink:#171515; --muted:#615b59; --line:#dcd8d6;
  --brand:#1d1b1b; --brand-ink:#ffffff; --signal:#d12a1f; --signal-soft:#fbe9e7;
  --ok:#1e8a4a; --warn:#b98a00; --risk:#d1600f; --bad:#b3261e; --info:#2d64c8;
  --f-ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121111; --surface:#1b1919; --sunken:#242121; --ink:#efeceb; --muted:#a9a19e; --line:#332f2e;
  --brand:#f1eeed; --brand-ink:#151313; --signal:#ff5b4c; --signal-soft:#3a1714;
  --ok:#4cc27c; --warn:#e2bb3c; --risk:#f08a43; --bad:#ef6b62; --info:#6f9cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121111; --surface:#1b1919; --sunken:#242121; --ink:#efeceb; --muted:#a9a19e; --line:#332f2e;
  --brand:#f1eeed; --brand-ink:#151313; --signal:#ff5b4c; --signal-soft:#3a1714;
  --ok:#4cc27c; --warn:#e2bb3c; --risk:#f08a43; --bad:#ef6b62; --info:#6f9cf0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.75 var(--f-ui);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:50%;object-fit:contain;background:#141212;display:grid;place-items:center;font:800 13px var(--f-ui);color:#fff;border:2px solid #d12a1f}
.brand b{font-size:16px;font-weight:800;white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;display:block;line-height:1.3}
.grow{flex:1}
.mods{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.mods::-webkit-scrollbar{display:none}
.mods button{font:600 14px var(--f-ui);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;white-space:nowrap}
.mods button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.who{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;background:var(--surface);color:var(--ink)}
.bell{position:relative;cursor:pointer}
.bell i{position:absolute;top:-6px;left:-6px;background:var(--signal);color:var(--brand-ink);border-radius:99px;font:700 11px var(--f-mono);min-width:18px;height:18px;display:grid;place-items:center;font-style:normal}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px}
.subs button{font:500 13.5px var(--f-ui);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:6px;cursor:pointer}
.subs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
h2{font-size:19px;margin:6px 0 4px;text-wrap:balance}
h3{font-size:15.5px;margin:14px 0 6px}
.note{color:var(--muted);font-size:12.5px;margin:2px 0 10px;max-width:90ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.kpi.alert{border-color:var(--signal);background:var(--signal-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.btn{font:600 13.5px var(--f-ui);border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:6px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:var(--brand-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:var(--sunken);font-weight:600;white-space:nowrap}
td.t{font-weight:600;min-width:200px}
.mono,code{font-family:var(--f-mono);font-size:12px;direction:ltr;unicode-bidi:isolate}
code{background:var(--sunken);padding:1px 5px;border-radius:4px}
.meta{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.p-ok{color:var(--ok)}.p-warn{color:var(--warn)}.p-risk{color:var(--risk)}.p-bad{color:var(--bad)}.p-info{color:var(--info)}.p-mute{color:var(--muted)}
.light{display:inline-flex;gap:4px;vertical-align:middle}
.light i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.light.g i:nth-child(1){background:var(--ok)} .light.y i:nth-child(2){background:var(--warn)} .light.o i:nth-child(3){background:var(--risk)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid2>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);padding:22px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.banner{border:1px solid var(--signal);background:var(--signal-soft);border-radius:var(--r);padding:8px 12px;margin:8px 0}
.banner.bad{border-color:var(--bad)}
.steps{display:flex;gap:3px}
.steps span{width:14px;height:6px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--brand)}
details summary{cursor:pointer;color:var(--brand)}
a{color:var(--brand)}
/* drawer form */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:50;display:flex;justify-content:flex-start}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;padding-inline:20px max(20px,env(safe-area-inset-left,0px));border-left:1px solid var(--line)}
.drawer h3{margin-top:0}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select{width:100%}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:inline-flex;gap:3px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:60;font-size:13px}
/* letter sheet */
.sheet{background:#fff;color:#151515;border:1px solid var(--line);border-radius:4px;padding:28px 34px;max-width:780px;margin:0 auto;font-size:14px;line-height:2}
.sheet .lh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #d12a1f;padding-bottom:10px;margin-bottom:16px}
.sheet .lh img{max-height:64px}
.sheet .meta3{font-size:12.5px;line-height:1.9}
.sheet .sig{margin-top:40px;text-align:left}
.sheet .sig img{max-height:70px;display:block;margin-right:auto}
.sheet .foot{margin-top:24px;border-top:1px solid #ccc;padding-top:6px;font-size:11px;color:#555}
.compose{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
.compose>*{min-width:0}
@media (max-width:980px){.compose{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .rows table{min-width:0}.rows thead{display:none}
  .rows tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  .rows td{display:block;border:0;padding:2px 12px}.rows td.t{min-width:0}
  .rows td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-weight:600}
  .sheet{padding:18px}
}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--sunken);border-radius:var(--r);padding:8px;min-width:0}
.kcol h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;line-height:1.6}
.cal-day{margin-top:14px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:2px}
.cal-item{display:flex;gap:8px;align-items:baseline;padding:4px 0;flex-wrap:wrap}
.sheet.ltr{direction:ltr;text-align:left}.sheet.ltr .sig{text-align:left}.sheet.ltr .sig img{margin-right:0}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:.6}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <div class="logo" id="logo">pTq</div>
        <div><b id="coName">پترو پالا توس</b><span id="coSub">بازار · ERP · BPMS · نامه‌ها · پتنت</span></div>
      </div>
      <div class="grow"></div>
      <div class="who">
        <span class="chip bell" id="bell" data-act="inbox" title="اعلان‌ها">اعلان‌ها<i id="bellN" hidden>0</i></span>
        <span class="chip" id="meChip">در حال اتصال…</span>
      </div>
    </div>
    <nav class="mods" id="mods" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>
  <div class="subs" id="subs" role="tablist"></div>
  <div id="view"><p class="empty">در حال بارگذاری داده‌ها از پایگاه مشترک…</p></div>
</main>
<div id="layer"></div>

<script>
(() => {
// ------------------------------------------------------------------ constants
const MODULES = [
  ["market","Market"],["events","Events"],["erp","ERP"],["bpms","BPMS"],["letters","Letters"],["patent","Patent"]];
const SUBS = {
  market:[["iran","Iran AI Projects"],["overseas","Overseas AI Projects"],["web","Web Design & SEO"],["investors","AI Investors & Accelerators"],["tracking","Project Tracking"],["pipeline","Pipeline"],["memory","Team Memory"]],
  events:[["iran","ایران"],["world","جهان"],["all","همه"],["taken","در دست پیگیری"]],
  erp:[["overview","نمای کلی"],["domains","حوزه‌های فعالیت"],["products","توسعه‌ی محصول هوشمند"],["people","نیروی انسانی"],["finance","مالی"],["clients","مشتریان و قراردادها"],["backup","پشتیبان‌گیری"]],
  bpms:[["myday","روز من"],["tasks","تسک‌ها"],["reports","گزارش عملکرد"],["rarchive","بایگانی گزارش‌ها"],["teams","تیم‌ها"],["process","فرایندها"],["calendar","تقویم"],["members","اعضا و ثبت‌نام"]],
  letters:[["new","نامه‌ی جدید (ساخت فایل Word)"],["archive","بایگانی نامه‌های پیشین و پیگیری"]],
  patent:[["home","پتنت‌ها"],["ops","فرصت‌های ثبت اختراع"],["products","محصولات ریپو"]]
};
const TEAMS = {finance:"مالی",admin:"اداری",web:"طراحی سایت",ai:"هوش مصنوعی",content:"تولید محتوا"};
const STAFF = {product:"سبد محصولات هوشمند",trainee_ai:"کارآموز هوش مصنوعی",trainee_web:"کارآموز طراحی سایت",admin:"اداری و دفتری",finance:"مالی (بیمه، مالیات، حقوق)"};
const ROLES = {member:"عضو",office_manager:"مسئول دفتر",manager:"مدیر تیم",ceo:"مدیرعامل"};
const WEEKDAYS = [["sat","شنبه"],["sun","یکشنبه"],["mon","دوشنبه"],["tue","سه‌شنبه"],["wed","چهارشنبه"],["thu","پنجشنبه"],["fri","جمعه"]];
const STAGES = {identified:"شناسایی",documents:"دریافت مدارک",partner_email:"ارسال ایمیل به شریک تجاری",partner_meeting:"پاسخ / جلسه با شریک",mou:"امضای تفاهم‌نامه",proposal:"تهیه‌ی پروپوزال",submitted:"ارسال پیشنهاد",result:"اعلام نتیجه"};
const T_STATUS = {new:"جدید",analysed:"تحلیل شده",partner_search:"در جست‌وجوی شریک",bid_prep:"آماده‌سازی پیشنهاد",mou_negotiation:"مذاکره تفاهم‌نامه",proposal_drafting:"نگارش پروپوزال",submitted:"ارسال شده",won:"برنده",lost:"بازنده",skipped:"کنار گذاشته شد",expired:"منقضی"};
const ACTIVE = new Set(["new","analysed","partner_search","bid_prep","mou_negotiation","proposal_drafting","submitted"]);
const TASK_ST = {todo:"انجام نشده",doing:"در حال انجام",done:"انجام شد",approved:"تأیید مدیر"};
const PRIORITY = {high:"فوری",normal:"عادی",low:"کم"};
const CLIENT_STAGES = {intro:"معرفی",demo:"دموی نرم‌افزار با داده‌ی مصنوعی",initial:"قرارداد اولیه",data:"دریافت داده‌ی واقعی",trl:"ارتقای TRL",main:"قرارداد اصلی"};
const OUTCOME = {"":"— (در جریان)",won:"برنده شدیم",lost:"نبردیم",dropped:"انصراف دادیم"};
const OUTCOME_PILL = {won:"p-ok",lost:"p-bad",dropped:"p-mute"};
const STAGE_PROB = {identified:5,documents:10,partner_email:15,partner_meeting:25,mou:40,proposal:55,submitted:70,result:90};
const PAT_ST = {granted:"ثبت‌شده",review:"در دست داوری",filed:"اظهارنامه ارسال شد",draft:"پیش‌نویس"};
const LABELS = {energy:"انرژی",medical:"پزشکی",aviation:"هوانوردی",nuclear:"هسته‌ای",urban:"شهری",ai_cross_cutting:"هوش مصنوعی",web:"طراحی سایت"};
const FIN_TYPES = {insurance:"بیمه",tax:"مالیات",payroll:"حقوق و دستمزد",rent:"اجاره",other:"سایر"};

// ------------------------------------------------------------------ state
const S = {mod:"market", sub:"iran", q:"", db:null, user:null, assets:null, sample:null, downloads:null,
  me:{id:null,isOwner:false,canEdit:false}, canWrite:null,
  m:{tenders:[],events:[],investors:[],leads:[],partners:[]}, opsList:[],
  settings:{}, members:[], tasks:[], letters:[], lettersArchive:[], draft:null, archF:"all", ra:{member:null,from:"",to:""}, repLoaded:false, allLoaded:false, forceFull:false, products:[], patents:[], finance:[], clients:[], tracking:{},
  myAtt:[], myReports:[], allReports:[], allAtt:[], loaded:false, got:new Set(), welcomed:false, calMine:false, calTypes:null, seenTasks:new Set()};
try{const v=JSON.parse(localStorage.getItem("ppt-view")||"{}");if(v.mod&&SUBS[v.mod]){S.mod=v.mod;S.sub=SUBS[v.mod].some(x=>x[0]===v.sub)?v.sub:SUBS[v.mod][0][0]}}catch(e){}
try{S.seenTasks=new Set(JSON.parse(localStorage.getItem("ppt-seen")||"[]"))}catch(e){}

// ------------------------------------------------------------------ helpers
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link = (u,t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t||u)}</a>` : "";
const today = () => new Date().toISOString().slice(0,10);
const faDate = d => { if(!d) return ""; try{return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{year:"numeric",month:"long",day:"numeric"}).format(new Date(d+(d.length===10?"T12:00:00":"")))}catch(e){return d} };
const faNum = n => { try{return new Intl.NumberFormat("fa-IR").format(n)}catch(e){return n} };
const blobUrl = id => id ? "/_blob/" + id : "";
const memberName = id => (S.members.find(m=>m.id===id)||{}).full_name || "—";
const isAdmin = () => S.me.isOwner || S.me.canEdit;
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function kpis(items){return `<div class="kpis">${items.map(([l,v,a])=>`<div class="kpi${a?" alert":""}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>`}
function table(head, rows, empty="موردی ثبت نشده است."){
  if(!rows.length) return `<p class="empty">${esc(empty)}</p>`;
  return `<div class="tablewrap rows"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
const td = (l, html, cls="") => `<td data-l="${esc(l)}"${cls?` class="${cls}"`:""}>${html}</td>`;
function light(score){ if(score==null) return `<span class="meta">در انتظار نمره</span>`;
  const c = score>=70?"g":score>=40?"y":"o"; return `<span class="light ${c}" title="${score>=70?"سبز":score>=40?"زرد":"نارنجی"}"><i></i><i></i><i></i></span> <b class="mono">${score}</b>`; }
function match(...xs){ if(!S.q) return true; return xs.join(" ").toLowerCase().includes(S.q); }

// ------------------------------------------------------------------ db plumbing
const COLS = {
  "market/data/tenders":"m.tenders","market/data/events":"m.events","market/data/investors":"m.investors",
  "market/data/leads":"m.leads","market/data/partners":"m.partners","patentops/data/items":"opsList",
  members:"members", tasks:"tasks", letters:"letters", letters_archive:"lettersArchive", products:"products", patents:"patents",
  finance:"finance", clients:"clients"
};
function setPath(key, val){ const [a,b]=key.split("."); if(b) S[a][b]=val; else S[a]=val; }
function subscribe(){
  for(const [path,key] of Object.entries(COLS)){
    S.db.collection(path).onSnapshot(snap => {
      setPath(key, snap.docs.map(d => ({id:d.id, ...d.data()})));
      S.loaded = true; S.got.add(key); render(); if(key==="members") maybeWelcome();
    }, () => {});
  }
  S.db.collection("tracking").onSnapshot(snap => { const t={}; snap.docs.forEach(d=>t[d.id]=d.data()); S.tracking=t; render(); }, ()=>{});
  S.db.doc("settings/company").onSnapshot(d => { S.settings = d.exists ? d.data() : {}; paintBrand(); render(); }, ()=>{});
  if(S.me.id){
    S.db.collection(`attendance/${S.me.id}/days`).onSnapshot(s=>{S.myAtt=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
    S.db.collection(`reports/${S.me.id}/items`).onSnapshot(s=>{S.myReports=s.docs.map(d=>({id:d.id,...d.data()}));S.repLoaded=true;render()},()=>{});
  }
}
async function loadAllReports(){ // admins read every member's reports and attendance (rules open it to admin)
  if(!isAdmin()) return;
  const all=[], att=[];
  for(const m of S.members){
    try{ const r=await S.db.collection(`reports/${m.id}/items`).get(); r.docs.forEach(d=>all.push({member:m.id,id:d.id,...d.data()})); }catch(e){}
    try{ const a=await S.db.collection(`attendance/${m.id}/days`).get(); a.docs.forEach(d=>att.push({member:m.id,id:d.id,...d.data()})); }catch(e){}
  }
  S.allReports=all; S.allAtt=att; S.allLoaded=true; render();
}
async function save(path, data, okMsg="ذخیره شد"){
  if(!S.db){ toast("اتصال به پایگاه داده برقرار نیست."); return false; }
  try{ await S.db.doc(path).set(data); toast(okMsg); return true; }

function openForm({title, fields, values={}, onSave, extra="", required=false}){
  const f = fields.map(fd => {
    const v = values[fd.k] ?? fd.value ?? "";
    const id = "f_"+fd.k;
    let ctl;
    if(fd.type==="textarea") ctl = `<textarea id="${id}">${esc(v)}</textarea>`;
    else if(fd.type==="select") ctl = `<select id="${id}">${Object.entries(fd.options).map(([k,l])=>`<option value="${esc(k)}"${k===v?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
    else if(fd.type==="days") ctl = `<div class="days" id="${id}">${WEEKDAYS.map(([k,l])=>`<label><input type="checkbox" value="${k}"${(v||[]).includes(k)?" checked":""}>${l}</label>`).join("")}</div>`;
    else if(fd.type==="file") ctl = `<input id="${id}" type="file" accept="${fd.accept||"image/*"}">${v?`<span class="meta">فایل فعلی ثبت شده است.</span>`:""}`;
    else ctl = `<input id="${id}" type="${fd.type||"text"}" value="${esc(v)}" ${fd.dir?`dir="${fd.dir}"`:""}>`;
    return `<div class="field"><label for="${id}">${esc(fd.label)}</label>${ctl}${fd.hint?`<span class="meta">${esc(fd.hint)}</span>`:""}</div>`;
  }).join("");
  $("#layer").innerHTML = `<div class="scrim"${required?"":' data-act="close-scrim"'}><form class="drawer" id="drawer"><h3>${esc(title)}</h3>${extra}${f}
    <div class="row"><button class="btn" type="submit">${required?"ثبت‌نام و ورود به سامانه":"ذخیره"}</button>${required?"":'<button class="btn ghost" type="button" data-act="close">انصراف</button>'}</div></form></div>`;
  $("#drawer").addEventListener("submit", async ev => {
    ev.preventDefault();
    const out = {};
    for(const fd of fields){
      const el = document.getElementById("f_"+fd.k);
      if(fd.type==="days") out[fd.k] = [...el.querySelectorAll("input:checked")].map(i=>i.value);
      else if(fd.type==="file") out[fd.k] = el.files[0] || null;
      else if(fd.type==="number") out[fd.k] = el.value===""?null:Number(el.value);
      else out[fd.k] = el.value.trim();
    }
    const btn = ev.submitter; if(btn) btn.disabled = true;
    const ok = await onSave(out);
    if(ok!==false) closeForm(); else if(btn) btn.disabled=false;
  });
}

  return items;

function tenderCond(t){const f=t.facts||{},c=(t.analysis||{}).conditions||{};return{price:c.price_fa||f.price||"—",guarantee:c.guarantee_fa||f.guarantee||"—",experience:c.experience_fa||f.experience||"—",intl:c.international_fa||f.international||"—"}}
function dl(t){ const d=t.days_left; const s = d==null?"نامشخص":(d<=7?`<span class="p-bad">${faNum(d)} روز</span>`:`${faNum(d)} روز`); return `${esc(t.deadline_fa||t.deadline||"؟")} (${s})`; }
// Go / No-Go: one transparent score per analysed tender (relevance 40, eligibility 25, time 15, foreign access 10, compliance 10)
const GNG = {go:["Go","p-ok"],maybe:["بررسی","p-warn"],nogo:["No-Go","p-bad"],wait:["در انتظار تحلیل","p-mute"]};
function pastIn(country){ if(!country) return 0; return S.m.tenders.filter(x=>x.country===country&&["lost","dropped"].includes((S.tracking[x.id]||{}).outcome||({lost:"lost",skipped:"dropped"})[x.status])).length; }
function goNoGo(t){
  const a=t.analysis; if(!a) return {v:"wait",score:null,why:["این مورد هنوز توسط ایجنت تحلیل نشده است."]};
  const why=[], rel=Number(a.relevance_score)||0, d=t.days_left;
  const elig={direct:100,partner_required:60,not_feasible:0}[a.eligibility]??50;
  const time=d==null?50:d<0?0:d>=21?100:d>=14?75:d>=7?45:15;
  const intl=(a.conditions||{}).international_fa||"", intlMarket=(t.market||"international")==="international";
  const closed=intlMarket&&/مجاز نیست|نمی‌?پذیر|ممنوع|فقط شرکت‌?های (داخلی|محلی|ایرانی)/.test(intl);
  const flags=(a.compliance_flags_fa||[]).length, comp=Math.max(0,100-flags*25);
  const score=Math.round(.40*rel+.25*elig+.15*time+.10*(closed?0:80)+.10*comp);
  why.push(`تطابق با محصولات: ${faNum(rel)} از ۱۰۰`);
  why.push({direct:"می‌توانیم مستقیم پیشنهاد دهیم",partner_required:"به شریک محلی نیاز داریم",not_feasible:"با شرایط فعلی شرکت شدنی نیست"}[a.eligibility]||"وضعیت صلاحیت نامشخص");
  if(d!=null) why.push(d<0?"مهلت گذشته است":`${faNum(d)} روز تا مهلت`);
  if(closed) why.push("پذیرش شرکت‌های خارجی محدود به نظر می‌رسد");
  if(flags) why.push(`${faNum(flags)} نکته‌ی انطباق و تحریم باید بررسی شود`);
  const past=pastIn(t.country); if(past) why.push(`سابقه: ${faNum(past)} مورد باخت یا انصراف در همین کشور (حافظه‌ی تیم)`);
  let v=score>=65?"go":score>=45?"maybe":"nogo";
  if(a.eligibility==="not_feasible"||(d!=null&&d<0)||closed) v="nogo";
  return {v,score,why};
}

const REPORT_START = "2026-10-21"; // reports are expected from this date for members who registered before it
const addDays = (d,n) => new Date(new Date(d+"T12:00:00").getTime()+n*864e5).toISOString().slice(0,10);
const wdOf = d => WEEKDAYS[(new Date(d+"T12:00:00").getDay()+1)%7][0];
const isOfficeDay = (m,d) => !!m && (m.office_days||[]).includes(wdOf(d));
// office days (last 14) on which this member has not sent a report; today only counts after 16:00
function missingReportDays(me){
  const out=[]; if(!me||!S.repLoaded) return out;
  const cutoff=me.joined||REPORT_START, hr=new Date().getHours();
  for(let i=0;i<14;i++){
    const d=addDays(today(),-i);
    if(d<cutoff) break;
    if(!isOfficeDay(me,d)) continue;
    if(i===0&&hr<16) continue;
    if(S.myReports.some(r=>(r.date||r.id)===d)) continue;
    out.push(d);
  }
  return out;
}

async function gradeReport(rec, me, tasks){
  if(!S.sample){ toast("نمره‌دهی خودکار در این نما در دسترس نیست؛ مدیر بعداً نمره می‌دهد."); return; }
  const prompt = `You are a strict performance reviewer at an early-stage Iranian AI company (Petro Pala Toos). Grade one daily work report from 0 to 100. Be demanding: low scores are expected and acceptable.
Rules: the person must work 8 net hours on each office day (9 hours presence including a 1-hour break). Score mostly on concrete, verifiable output that matches their assigned tasks; vague text, missing hours, or work unrelated to assigned tasks score low. Above 70 only for a full day with clear deliverables.
Team: ${TEAMS[me.team]||me.team}. Staff type: ${STAFF[me.staff_type]||me.staff_type}.
Net hours recorded today: ${rec.hours==null?"not recorded":rec.hours}.
Assigned tasks: ${JSON.stringify(tasks.map(t=>({title:t.title,status:t.status,due:t.due})))}.
Report: ${rec.text}
Blockers: ${rec.blockers||"-"}
Return JSON only: {"score": <integer 0-100>, "feedback_fa": "<2-3 short Persian sentences: what lowered the score and what to do tomorrow>"}`;
  try{
    const r = await S.sample.json(prompt, {modelTier:"default"});
    const score=Math.max(0,Math.min(100,Math.round(Number(r.score)||0)));
    let fb=String(r.feedback_fa||"");
    if(score<40) fb += " تذکر: با این بهره‌وری احتمال قطع همکاری وجود دارد؛ روی بهره‌وری خود وقت بگذارید.";
    await S.db.doc(`reports/${S.me.id}/items/${rec.date}`).update({score,feedback:fb,graded:new Date().toISOString()});
    toast(`نمره‌ی گزارش: ${score} از ۱۰۰`);
  }catch(e){ toast(e.code==="not_granted"?"نمره‌دهی خودکار اجازه داده نشد.":"نمره‌دهی انجام نشد؛ بعداً دوباره ثبت کنید."); }
}
// ---------- REPORT ARCHIVE: one row per day for each person; missed office days are visible and flagged
function raDays(){
  const admin=isAdmin(), ids=admin?S.members.map(m=>m.id):[S.me.id], ra=S.ra;
  if(!ra.member||!ids.includes(ra.member)) ra.member=ids.includes(S.me.id)?S.me.id:ids[0];
  if(!ra.to) ra.to=today(); if(!ra.from) ra.from=addDays(today(),-29);
  const m=S.members.find(x=>x.id===ra.member);
  const reps=admin?S.allReports.filter(r=>r.member===ra.member):S.myReports.map(r=>({...r,member:S.me.id}));
  const byDate={}; reps.forEach(r=>byDate[r.date||r.id]=r);
  const hr=new Date().getHours(), rows=[];
  for(let d=ra.to, n=0; d>=ra.from && n<400; d=addDays(d,-1), n++){
    const r=byDate[d], office=isOfficeDay(m,d), cutoff=(m&&m.joined)||REPORT_START;
    if(!r && (!office || d>today() || d<cutoff)) continue;
    const state = r ? "ok" : (d===today()&&hr<16 ? "wait" : "missing");
    rows.push({date:d,state,r,office});
  }
  return {ids,m,rows};
}

// ---------- LETTERS
// Two separate sections: "new" composes a letter on the company letterhead and produces a ready-to-send Word file;
// "archive" tracks letters that were sent before the agent existed and where each one stands now.
/*DOCX-START*/
// Minimal dependency-free .docx writer: stored ZIP + WordprocessingML (RTL, letterhead in header/footer).
const CRC_T = (()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data, crc=crc32(data), sz=data.length;
    const lh=Uint8Array.from([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0)]);
    const ch=Uint8Array.from([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]);
    parts.push(lh,name,data); central.push(ch,name); off+=lh.length+name.length+sz;
  }
  const cdSize=central.reduce((s,c)=>s+c.length,0);
  const end=Uint8Array.from([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=[...parts,...central,end], out=new Uint8Array(all.reduce((s,c)=>s+c.length,0)); let p=0;
  for(const c of all){out.set(c,p);p+=c.length} return out;
}
const WX = s => String(s ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WLTR = s => s ? "‪"+s+"‬" : "";   // keep Latin ids like PPT-1405-0001 in reading order inside RTL text
const WD = {ltr:false};   // direction of the letter being built: false = Persian RTL letterhead, true = English (international identity)
const wRun = (text,{b=false,sz=24,color=""}={}) => `<w:r><w:rPr><w:rFonts w:ascii="Tahoma" w:hAnsi="Tahoma" w:cs="B Nazanin"/>${b?"<w:b/><w:bCs/>":""}${color?`<w:color w:val="${color}"/>`:""}<w:sz w:val="${sz}"/><w:szCs w:val="${sz+2}"/>${WD.ltr?"":"<w:rtl/>"}</w:rPr><w:t xml:space="preserve">${WX(text)}</w:t></w:r>`;
// jc: omitted = start (visual right in RTL), "both" = justified, "right" = end (visual left in RTL), "center"
const wPara = (inner,{jc="",before=0,after=0,line=0,border=null}={}) => `<w:p><w:pPr>${border?`<w:pBdr><w:${border.side} w:val="single" w:sz="${border.sz}" w:space="4" w:color="${border.color}"/></w:pBdr>`:""}${WD.ltr?"":"<w:bidi/>"}<w:spacing w:before="${before}" w:after="${after}"${line?` w:line="${line}" w:lineRule="auto"`:""}/>${jc?`<w:jc w:val="${jc}"/>`:""}</w:pPr>${inner}</w:p>`;
const wImg = (rid,n,cx,cy) => `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n}" name="img${n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="img${n}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
const W_NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"';
const RELNS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const imgSize = (im,hCm) => { const cy=Math.round(hCm*360000); return [Math.round(cy*im.w/im.h), cy]; };

// L: {number,dateFa,recipient,subject,body,attachments,cc}; C: {nameFa,nameEn,footer,ceoName,ceoTitle}; logo/sig: {bytes,w,h}|null
function buildLetterDocx(L, C, logo, sig, ltr=false){
  WD.ltr=ltr; const END=ltr?"":"right";
  const T=ltr?{no:"Ref: ",date:"Date: ",att:"Enclosures: ",none:"None",subj:"Subject: ",hello:"Dear Sir or Madam,",thanks:"Thank you for your time and consideration.",cc:"cc: ",bye:"Yours sincerely,"}:{no:"شماره: ",date:"تاریخ: ",att:"پیوست: ",none:"ندارد",subj:"موضوع: ",hello:"با سلام و احترام،",thanks:"پیشاپیش از حسن توجه جنابعالی سپاسگزاریم.",cc:"رونوشت: ",bye:""};
  const lines = s => String(s||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  // header = letterhead
  const names = wPara(wRun(C.nameFa||"",{b:true,sz:32}),{after:20}) + (C.nameEn?wPara(wRun(WLTR(C.nameEn),{sz:20,color:"555555"})):"");
  let hdrTbl;
  if(logo){ const [cx,cy]=imgSize(logo,1.8);
    hdrTbl = `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>${ltr?"":"<w:bidiVisual/>"}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="2400"/><w:gridCol w:w="7238"/></w:tblGrid><w:tr>`+
      `<w:tc><w:tcPr><w:tcW w:w="2400" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${wPara(wImg("rIdLogo",1,cx,cy))}</w:tc>`+
      `<w:tc><w:tcPr><w:tcW w:w="7238" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${names}</w:tc></w:tr></w:tbl>`;
  } else hdrTbl = `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>${ltr?"":"<w:bidiVisual/>"}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="9638"/></w:tblGrid><w:tr><w:tc><w:tcPr><w:tcW w:w="9638" w:type="dxa"/></w:tcPr>${names}</w:tc></w:tr></w:tbl>`;
  const header = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr ${W_NS}>${hdrTbl}${wPara("",{after:0,border:{side:"bottom",sz:12,color:"D12A1F"}})}</w:hdr>`;
  const footer = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${W_NS}>${wPara(wRun(C.footer||"",{sz:17,color:"555555"}),{jc:"center",border:{side:"top",sz:4,color:"BBBBBB"}})}</w:ftr>`;
  // body
  const b=[];
  b.push(wPara(wRun(T.no+WLTR(L.number),{sz:22}),{jc:END}));
  b.push(wPara(wRun(T.date+L.dateFa,{sz:22}),{jc:END}));
  b.push(wPara(wRun(T.att+(L.attachments||T.none),{sz:22}),{jc:END,after:240}));
  lines(L.recipient).forEach(t=>b.push(wPara(wRun(t,{b:true}),{line:300})));
  b.push(wPara(wRun(T.subj,{b:true})+wRun(L.subject||""),{before:160,after:160,line:300}));
  b.push(wPara(wRun(T.hello),{after:120,line:360}));
  lines(L.body).forEach(t=>b.push(wPara(wRun(t),{jc:"both",after:120,line:360})));
  b.push(wPara(wRun(T.thanks),{before:120,after:120,line:360}));
  if(ltr) b.push(wPara(wRun(T.bye),{after:0,line:360}));
  const sigRun = sig ? (([cx,cy])=>wImg("rIdSig",2,cx,cy))(imgSize(sig,2.2)) : "";
  b.push(wPara(sigRun,{jc:END,before:sig?240:720}));
  if(C.ceoName) b.push(wPara(wRun(C.ceoName,{b:true}),{jc:END}));
  b.push(wPara(wRun(C.ceoTitle||"مدیرعامل"),{jc:END,after:240}));
  if(L.cc) b.push(wPara(wRun(T.cc+L.cc,{sz:20,color:"444444"}),{line:300}));
  const sect = `<w:sectPr><w:headerReference w:type="default" r:id="rIdHdr"/><w:footerReference w:type="default" r:id="rIdFtr"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2268" w:right="1134" w:bottom="1418" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/>${ltr?"":"<w:bidi/>"}</w:sectPr>`;
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${W_NS}><w:body>${b.join("")}${sect}</w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Tahoma" w:hAnsi="Tahoma" w:cs="B Nazanin"/><w:sz w:val="24"/><w:szCs w:val="26"/><w:lang w:val="en-US" w:bidi="fa-IR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr>${ltr?"":"<w:bidi/>"}</w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const rels = (items) => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${items.map(([id,t,tg])=>`<Relationship Id="${id}" Type="${RELNS}/${t}" Target="${tg}"/>`).join("")}</Relationships>`;
  const files = [
    {name:"[Content_Types].xml",data:ct},
    {name:"_rels/.rels",data:rels([["rId1","officeDocument","word/document.xml"]])},
    {name:"word/document.xml",data:doc},
    {name:"word/styles.xml",data:styles},
    {name:"word/header1.xml",data:header},
    {name:"word/footer1.xml",data:footer},
    {name:"word/_rels/document.xml.rels",data:rels([["rIdHdr","header","header1.xml"],["rIdFtr","footer","footer1.xml"],["rIdSty","styles","styles.xml"],...(sig?[["rIdSig","image","media/sig.png"]]:[])])},
  ];
  if(logo){ files.push({name:"word/_rels/header1.xml.rels",data:rels([["rIdLogo","image","media/logo.png"]])},{name:"word/media/logo.png",data:logo.bytes}); }
  if(sig) files.push({name:"word/media/sig.png",data:sig.bytes});
  return zipStore(files);
}
/*DOCX-END*/

async function prepImage(assetId, maxPx){ // asset -> PNG bytes + size, so the Word file never depends on the original format
  try{
    const blob = await (await fetch(blobUrl(assetId))).blob();
    const url = URL.createObjectURL(blob);
    const im = await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const k = Math.min(1, maxPx/Math.max(im.naturalWidth||1, im.naturalHeight||1));
    const w=Math.max(1,Math.round(im.naturalWidth*k)), h=Math.max(1,Math.round(im.naturalHeight*k));
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(im,0,0,w,h);
    URL.revokeObjectURL(url);
    const png = await new Promise(ok=>cv.toBlob(ok,"image/png"));
    return {bytes:new Uint8Array(await png.arrayBuffer()), w, h};
  }catch(e){ console.error("image prep failed", e); return null; }
}
async function makeLetterDocx(l){
  const st=S.settings, ceo=S.members.find(m=>m.id===st.ceo_member);
  const sigId = l.ceo_sig ? (l.ceo_sig.asset||st.ceo_sig_asset) : null;
  const [logo,sig] = await Promise.all([st.logo_asset?prepImage(st.logo_asset,700):null, sigId?prepImage(sigId,600):null]);
  if(l.identity==="intl"){ const I=intlId();
    return buildLetterDocx({number:l.number,dateFa:enDate(l.date),recipient:l.recipient,subject:l.subject,body:l.body,attachments:l.attachments,cc:l.cc},
      {nameFa:I.name,nameEn:"",footer:[I.address,I.website,I.email].filter(Boolean).join(" · "),ceoName:I.signatory,ceoTitle:I.title}, logo, sig, true); }
  const footer=[st.address, st.phone&&`تلفن: ${st.phone}`, st.reg_no&&`شماره‌ی ثبت: ${st.reg_no}`, st.national_id&&`شناسه‌ی ملی: ${st.national_id}`].filter(Boolean).join(" · ");
  return buildLetterDocx({number:l.number,dateFa:faDate(l.date),recipient:l.recipient,subject:l.subject,body:l.body,attachments:l.attachments,cc:l.cc},
    {nameFa:st.name_fa||"پترو پالا توس",nameEn:st.name_en||"",footer,ceoName:ceo?ceo.full_name:"",ceoTitle:`مدیرعامل ${st.name_fa||""}`.trim()}, logo, sig);
}
async function downloadLetter(l){
  if(!S.downloads){ toast("دریافت فایل فقط داخل claude.ai فعال است."); return; }
  try{
    toast("در حال ساخت فایل Word…");
    const bytes = await makeLetterDocx(l);
    await S.downloads.save({filename:`${String(l.number||"letter").replace(/[^\w.-]+/g,"_")}.docx`, data:new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})});
  }catch(err){ if(!err||err.code!=="declined"){ toast("ساخت یا دریافت فایل Word انجام نشد."); console.error(err); } }
}

// International proposals go out under the company's foreign identity (Istanbul), in English; Iranian letters keep the Persian letterhead.

const enDate = d => { try{ return new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"long",year:"numeric"}).format(new Date((d||today())+"T12:00:00")); }catch(e){ return d||""; } };
function nextLetterNo(identity){ if(identity==="intl"){ const y=new Date().getFullYear(); const n=S.letters.filter(l=>(l.number||"").startsWith(`PIG-${y}-`)).length+1; return `PIG-${y}-${String(n).padStart(4,"0")}`; }
  const y=new Intl.DateTimeFormat("en-u-ca-persian",{year:"numeric"}).format(new Date()).replace(/\D/g,""); const n=S.letters.filter(l=>(l.number||"").includes(`PPT-${y}-`)).length+1; return `PPT-${y}-${String(n).padStart(4,"0")}`; }

VIEWS["letters.new"] = () => {

async function composeSubmit(){
  const d=getDraft(); const v=k=>String(d[k]||"").trim();
  if(!v("subject")||!v("recipient")||!v("body")){ toast("گیرنده، موضوع و متن نامه را وارد کنید."); return; }
  if(d.numAuto) d.number=nextLetterNo(d.identity);
  if(!v("number")){ toast("شماره‌ی نامه را وارد کنید."); return; }
  if(S.letters.some(l=>l.number===d.number&&l.id!==d.id)){ toast("این شماره قبلاً برای نامه‌ی دیگری ثبت شده است."); return; }
  const old=d.id?S.letters.find(x=>x.id===d.id):null;
  const id=d.id||newId();
  const rec={...(old||{}),identity:d.identity==="intl"?"intl":"ir",number:v("number"),date:d.date||today(),recipient:v("recipient"),subject:v("subject"),body:v("body"),attachments:v("attachments"),cc:v("cc"),updated:new Date().toISOString(),created_by:(old&&old.created_by)||S.me.id};
  if(old&&(old.body!==rec.body||old.subject!==rec.subject||old.recipient!==rec.recipient)){ rec.office_sig=null; rec.ceo_sig=null; } // edited content needs fresh signatures
  delete rec.id;
  if(!await save(`letters/${id}`,rec,"نامه ثبت شد")) return;
  S.draft=null; S.forceFull=true; render();
  await downloadLetter({...rec,id});
}

// ---------- PIPELINE (unified sales funnel for every tracked opportunity)
const trackTitle = key => { const t=S.m.tenders.find(x=>x.id===key); if(t) return t.title;
  if(key.startsWith("ev_")){ const e=S.m.events.find(x=>"ev_"+x.id===key); return e?`رویداد: ${e.name_fa||e.name}`:key; }
  if(key.startsWith("ld_")){ const l=S.m.leads.find(x=>"ld_"+x.id===key); return l?`تماس: ${l.name||l.activity}`:key; }
  return key; };
const prob = tr => tr.prob!=null&&tr.prob!==""?Number(tr.prob):(STAGE_PROB[tr.stage||"identified"]||5);
const usd = n => "$"+faNum(Math.round(n||0));
VIEWS["market.pipeline"] = () => {
  const st=Object.keys(STAGES);
  const list=S.m.tenders.filter(t=>ACTIVE.has(t.status)&&!(S.tracking[t.id]||{}).outcome).filter(t=>match(t.title,t.country,t.buyer,(S.tracking[t.id]||{}).owner));
  const val=t=>Number((S.tracking[t.id]||{}).value_usd)||0, wt=t=>val(t)*prob(S.tracking[t.id]||{})/100;
  const total=list.reduce((a,t)=>a+val(t),0), weighted=list.reduce((a,t)=>a+wt(t),0);
  const go=list.filter(t=>goNoGo(t).v==="go").length;
  const cols=st.map(k=>{ const items=list.filter(t=>((S.tracking[t.id]||{}).stage||"identified")===k).sort((a,b)=>(a.days_left??999)-(b.days_left??999));
    const i=st.indexOf(k);
    return `<div class="kcol"><h4><span>${esc(STAGES[k])}</span><span class="meta">${faNum(items.length)} · ${usd(items.reduce((a,t)=>a+val(t),0))}</span></h4>${items.map(t=>{const tr=S.tracking[t.id]||{},g=goNoGo(t),[gl,gc]=GNG[g.v];
      return `<div class="kcard"><b>${link(t.url,t.title)}</b><br><span class="meta">${esc(t.country||"")} · ${esc(memberName(tr.owner)!=="—"?memberName(tr.owner):"بدون مسئول")} · ${dl(t)}</span><br>
       <span class="pill ${gc}">${gl}${g.score!=null?" "+faNum(g.score):""}</span> <span class="mono">${usd(val(t))}</span> <span class="meta">× ${faNum(prob(tr))}٪</span>
       <div class="row" style="margin-top:4px">${i>0?`<button class="btn sm ghost" data-act="pipe-move" data-id="${esc(t.id)}" data-d="-1" title="مرحله‌ی قبل">›</button>`:""}${i<st.length-1?`<button class="btn sm ghost" data-act="pipe-move" data-id="${esc(t.id)}" data-d="1" title="مرحله‌ی بعد">‹</button>`:""}<button class="btn sm ghost" data-act="track" data-id="${esc(t.id)}">ویرایش</button></div></div>`}).join("")||'<p class="meta">—</p>'}</div>`}).join("");
  const cl=S.clients, cst=Object.keys(CLIENT_STAGES);
  return `<p class="note">همه‌ی فرصت‌های در دست پیگیری در یک قیف. ارزش و احتمال برد را از «ویرایش» وارد کنید؛ اگر احتمال خالی باشد، درصد پیش‌فرض هر مرحله به‌کار می‌رود. با ثبت نتیجه‌ی نهایی، مورد از قیف خارج و وارد «Team Memory» می‌شود.</p>`+
  kpis([["فرصت در قیف",faNum(list.length)],["پیشنهاد Go",faNum(go)],["ارزش کل (دلار)",usd(total)],["پیش‌بینی وزنی (دلار)",usd(weighted)],["بدون مسئول",faNum(list.filter(t=>!(S.tracking[t.id]||{}).owner).length),true]])+
  `<div class="kanban">${cols}</div><h3>قراردادهای مشتری (ERP)</h3>`+kpis(cst.map(k=>[CLIENT_STAGES[k],faNum(cl.filter(c=>c.stage===k).length)]))+
  `<p class="meta">ارزش قراردادهای مشتری به ریال در «ERP ← مشتریان و قراردادها» ثبت می‌شود: ${faNum(cl.reduce((a,c)=>a+(Number(c.value)||0),0))} ریال.</p>`;
};

  kpis([["برنده",faNum(c("won"))],["نبردیم",faNum(c("lost"))],["انصراف",faNum(c("dropped"))],["نرخ برد",decided?faNum(Math.round(100*c("won")/decided))+"٪":"—"]])+
  table(["فرصت","کشور","نتیجه","دلیل","Go/No-Go هنگام ثبت","ثبت‌کننده"], rows.map(({t,tr,o})=>`<tr>${td("فرصت",link(t.url,t.title),"t")}${td("کشور",esc(t.country||"—"))}${td("نتیجه",`<span class="pill ${OUTCOME_PILL[o]}">${esc(OUTCOME[o])}</span>`)}${td("دلیل",esc(tr.outcome_reason||"ثبت نشده"))}${td("Go/No-Go",gngCell(t))}${td("ثبت‌کننده",esc(memberName(tr.updated_by)))}</tr>`),"هنوز نتیجه‌ای ثبت نشده است. از «Project Tracking ← ویرایش» نتیجه و دلیل را وارد کنید.");

// ---------- CALENDAR (deadlines, events, follow-ups, tasks, finance, letters)
const CAL_T = {tender:"مهلت مناقصه",event:"رویداد",followup:"اقدام بعدی پروژه",task:"تسک",finance:"سررسید مالی",letter:"پیگیری نامه",meeting:"جلسه"};
const isoOk = d => /^\d{4}-\d{2}-\d{2}/.test(d||"");
const dayDiff = iso => Math.round((Date.parse(iso.slice(0,10)+"T00:00:00Z")-Date.parse(today()+"T00:00:00Z"))/864e5);
function calEntries(){
  const me=S.me.id, out=[];
  S.m.tenders.filter(t=>ACTIVE.has(t.status)).forEach(t=>{ const tr=S.tracking[t.id]||{}; if(tr.outcome) return;
    const d=isoOk(t.deadline)?t.deadline.slice(0,10):(t.days_left!=null?addDays(today(),t.days_left):null);
    if(d) out.push({date:d,type:"tender",title:t.title,url:t.url,owner:tr.owner||"",stop:true});
    if(tr.next_date) out.push({date:tr.next_date,type:"followup",title:`${tr.next_action||"اقدام بعدی"} – ${t.title}`,owner:tr.owner||""}); });
  Object.entries(S.tracking).forEach(([k,tr])=>{ if(!tr.next_date||S.m.tenders.some(t=>t.id===k)||tr.outcome) return; out.push({date:tr.next_date,type:"followup",title:`${tr.next_action||"اقدام بعدی"} – ${trackTitle(k)}`,owner:tr.owner||""}); });
  S.m.events.forEach(e=>{ const tr=S.tracking["ev_"+e.id]||{}; if(isoOk(e.start)&&e.start>=addDays(today(),-1)) out.push({date:e.start.slice(0,10),type:"event",title:e.name_fa||e.name,url:e.url,owner:tr.owner||"",stop:true}); });
  S.tasks.filter(t=>t.due&&!["done","approved"].includes(t.status)).forEach(t=>out.push({date:t.due,type:"task",title:t.title,owner:t.assignee||""}));
  if(isAdmin()) S.finance.filter(f=>f.due&&f.status!=="paid").forEach(f=>out.push({date:f.due,type:"finance",title:`${f.title} – ${faNum(f.amount||0)} ریال`,owner:""}));
  S.lettersArchive.filter(a=>a.next_date&&a.status!=="closed").forEach(a=>out.push({date:a.next_date,type:"letter",title:`${a.next_action||"پیگیری"} – ${a.subject}`,owner:a.owner||""}));
  S.letters.filter(l=>l.meeting_mode&&l.meeting_mode!=="none"&&isoOk(l.meeting_date)).forEach(l=>out.push({date:l.meeting_date,type:"meeting",title:`جلسه‌ی پیرو نامه‌ی ${l.number}${l.meeting_time?` – ساعت ${l.meeting_time}`:""}`,owner:l.created_by||"",stop:true}));
  return out.filter(x=>isoOk(x.date)).sort((a,b)=>a.date.localeCompare(b.date));
}
const relDay = d => { const n=dayDiff(d); return n===0?"امروز":n===1?"فردا":n===-1?"دیروز":n<0?`${faNum(-n)} روز پیش`:`${faNum(n)} روز دیگر`; };
VIEWS["bpms.calendar"] = () => {
  const all=calEntries().filter(x=>!S.calMine||x.owner===S.me.id).filter(x=>!S.calTypes||S.calTypes.has(x.type)).filter(x=>match(x.title,CAL_T[x.type]));
  const late=all.filter(x=>!x.stop&&x.date<today()), upcoming=all.filter(x=>x.date>=today()&&x.date<=addDays(today(),60));
  const days=[...new Set(upcoming.map(x=>x.date))];
  const row=x=>`<div class="cal-item"><span class="pill p-info">${esc(CAL_T[x.type])}</span> ${x.url?link(x.url,x.title):esc(x.title)}${x.owner?` <span class="meta">· ${esc(memberName(x.owner))}</span>`:""}</div>`;
  return `<div class="toolbar"><label class="chip"><input type="checkbox" data-cal="mine"${S.calMine?" checked":""}> فقط موارد من</label>
    <select data-cal="type"><option value="">همه‌ی انواع</option>${Object.entries(CAL_T).map(([k,l])=>`<option value="${k}"${S.calTypes&&S.calTypes.has(k)?" selected":""}>${esc(l)}</option>`).join("")}</select>
    ${S.downloads?'<button class="btn ghost" data-act="cal-ics">دریافت فایل تقویم (ICS)</button>':""}<span class="meta">۶۰ روز آینده؛ یادآوری موارد من در زنگ اعلان می‌آید.</span></div>`+
  kpis([["عقب‌افتاده",faNum(late.length),late.length>0],["امروز",faNum(upcoming.filter(x=>x.date===today()).length)],["۷ روز آینده",faNum(upcoming.filter(x=>x.date<=addDays(today(),7)).length)],["۶۰ روز آینده",faNum(upcoming.length)]])+
  (late.length?`<div class="cal-day p-bad">عقب‌افتاده</div>${late.map(x=>`<div class="cal-item"><span class="meta">${faDate(x.date)}</span> ${row(x)}</div>`).join("")}`:"")+
  (days.length?days.map(d=>`<div class="cal-day">${faDate(d)} <span class="meta">· ${relDay(d)}</span></div>${upcoming.filter(x=>x.date===d).map(row).join("")}`).join(""):'<p class="empty">موردی در ۶۰ روز آینده ثبت نشده است.</p>');
};
async function calIcs(){
  if(!S.downloads){ toast("دریافت فایل فقط داخل claude.ai فعال است."); return; }
  const ics=x=>String(x).replace(/[\;,]/g,m=>"\\"+m).replace(/\r?\n/g," ");
  const ev=calEntries().filter(x=>!S.calMine||x.owner===S.me.id).filter(x=>x.date>=addDays(today(),-7));
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Petro Pala Toos//Hub//FA","CALSCALE:GREGORIAN",...ev.flatMap((x,i)=>["BEGIN:VEVENT",`UID:ppt-${i}-${x.date}@hub`,`DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g,"")}`,`DTSTART;VALUE=DATE:${x.date.replace(/-/g,"")}`,`DTEND;VALUE=DATE:${addDays(x.date,1).replace(/-/g,"")}`,`SUMMARY:${ics(CAL_T[x.type]+": "+x.title)}`,"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Reminder","END:VALARM","END:VEVENT"]),"END:VCALENDAR"].join("\r\n");
  try{ await S.downloads.save({filename:"ppt-calendar.ics",data:new Blob([body],{type:"text/calendar"})}); }catch(err){ if(!err||err.code!=="declined") toast("ساخت فایل تقویم انجام نشد."); }
}

async function backupSave(name,blob){ try{ await S.downloads.save({filename:name,data:blob}); return true; }catch(err){ if(!err||err.code!=="declined") toast("دریافت فایل انجام نشد."); return false; } }
async function backupJson(){
  if(!S.downloads) return; await loadAllReports();
  const data={exported:new Date().toISOString(),by:S.me.id,app:"petro-pala-toos-hub",collections:BACKUP_SETS()};

async function backupCsv(k){
  const rows=BACKUP_SETS()[k]||[]; if(!rows.length) return;
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  await backupSave(`ppt-${k}-${today()}.csv`,new Blob(["﻿"+[cols.join(","),...rows.map(r=>cols.map(c=>csvCell(r[c])).join(","))].join("\n")],{type:"text/csv"}));
}

// ================================================================== actions
document.addEventListener("click", async e => {
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==="close-scrim" && e.target!==b) return;
  switch(a){
    case "mod": S.mod=b.dataset.k; S.sub=SUBS[S.mod][0][0]; S.q=""; render(); break;
    case "sub": S.sub=b.dataset.k; S.forceFull=true; render(); if(S.mod==="bpms"&&S.sub==="rarchive"&&isAdmin()) loadAllReports(); break;
    case "close": case "close-scrim": closeForm(); break;
    case "track": { const t=S.tracking[id]||{};
      const locked = t.owner && t.owner!==S.me.id && !isAdmin(); // only the owner or an admin may hand a taken project to someone else
      const ownerField = locked ? [] : [{k:"owner",label:"مسئول پیگیری",type:"select",options:Object.fromEntries([["","—"],...S.members.map(m=>[m.id,m.full_name])])}];
      openForm({title:"پیگیری پروژه",extra:locked?`<p class="note">مسئول این پروژه ${esc(memberName(t.owner))} است و فقط خود او یا مدیر می‌تواند مسئول را تغییر دهد.</p>`:"",values:{stage:"identified",...t},fields:[...ownerField,{k:"stage",label:"مرحله‌ی پیگیری",type:"select",options:STAGES},{k:"next_action",label:"اقدام بعدی"},{k:"next_date",label:"تاریخ اقدام بعدی",type:"date"},
        {k:"value_usd",label:"ارزش تخمینی قرارداد (دلار)",type:"number"},{k:"prob",label:"احتمال برد (۰ تا ۱۰۰؛ خالی = بر اساس مرحله)",type:"number"},
        {k:"outcome",label:"نتیجه‌ی نهایی",type:"select",options:OUTCOME,hint:"با ثبت نتیجه، مورد از قیف خارج و به حافظه‌ی یادگیری ایجنت اضافه می‌شود."},{k:"outcome_reason",label:"دلیل نتیجه (برای یادگیری ایجنت)",type:"textarea"},{k:"note",label:"یادداشت",type:"textarea"}],
      onSave:v=>{ if(v.outcome&&!v.outcome_reason){toast("دلیل نتیجه را بنویسید؛ ایجنت از آن یاد می‌گیرد.");return false}
        return save(`tracking/${id}`,{...t,...v,...(locked?{owner:t.owner}:{}),log:[...(t.log||[]),{at:new Date().toISOString(),by:S.me.id,stage:v.stage,note:v.note}].slice(-40),updated:new Date().toISOString(),updated_by:S.me.id}); }}); break; }
    case "claim": { if(!myMember()){toast("ابتدا از BPMS ← اعضا و ثبت‌نام ثبت‌نام کنید.");break}
      // first come, first served: hold a short lease on the doc, re-read it from the store, claim only if still unowned
      b.disabled=true;
      try{
        const ref=S.db.doc(`tracking/${id}`);
        const lease=await ref.acquire({holder:S.me.id,ttlMs:5000});
        if(!lease.acquired){toast("هم‌زمان عضو دیگری در حال گرفتن این مورد است؛ چند ثانیه بعد دوباره نگاه کنید.");b.disabled=false;break}
        const snap=await ref.get(); const t=snap.exists?snap.data():{};
        if(t.owner&&t.owner!==S.me.id){toast(`این مورد را ${memberName(t.owner)} برعهده گرفته است.`);break}
        const {lease:_l,...rest}=t;
        await save(`tracking/${id}`,{stage:"identified",...rest,owner:S.me.id,log:[...(t.log||[]),{at:new Date().toISOString(),by:S.me.id,note:"مسئولیت پذیرفته شد"}].slice(-40),updated:new Date().toISOString(),updated_by:S.me.id},"مسئولیت ثبت شد؛ مورد از فهرست باز برداشته شد");
      }catch(err){ toast("ثبت مسئولیت انجام نشد؛ دوباره تلاش کنید."); b.disabled=false; }
      break; }
    case "unclaim": { const t=S.tracking[id]||{}; if(t.owner&&t.owner!==S.me.id&&!isAdmin()){toast("فقط مسئول همین مورد یا مدیر می‌تواند آن را بازگرداند.");break}
      await save(`tracking/${id}`,{...t,owner:"",log:[...(t.log||[]),{at:new Date().toISOString(),by:S.me.id,note:"به فهرست بازگردانده شد"}].slice(-40),updated:new Date().toISOString(),updated_by:S.me.id},"به فهرست بازگردانده شد"); break; }
    case "pipe-move": { const t=S.tracking[id]||{}, st=Object.keys(STAGES), i=Math.max(0,st.indexOf(t.stage||"identified"))+Number(b.dataset.d), ns=st[Math.min(st.length-1,Math.max(0,i))];
      await save(`tracking/${id}`,{stage:"identified",...t,stage:ns,log:[...(t.log||[]),{at:new Date().toISOString(),by:S.me.id,stage:ns,note:"جابه‌جایی در قیف"}].slice(-40),updated:new Date().toISOString(),updated_by:S.me.id},"مرحله به‌روز شد"); break; }
    case "cal-ics": calIcs(); break;
    case "backup-json": backupJson(); break;
    case "backup-csv": backupCsv(b.dataset.k); break;
    case "product-new": productForm(); break;
    case "product-edit": productForm(S.products.find(p=>p.id===id)); break;
    case "fin-new": finForm(); break;
    case "fin-edit": finForm(S.finance.find(f=>f.id===id)); break;
    case "client-new": clientForm(); break;
    case "client-edit": clientForm(S.clients.find(c=>c.id===id)); break;
    case "task-new": taskForm(); break;
    case "task-st": { const t=S.tasks.find(x=>x.id===id); if(t) await save(`tasks/${id}`,{...t,status:b.dataset.st,updated:new Date().toISOString()},"وضعیت تسک به‌روز شد"); break; }
    case "checkin": await save(`attendance/${S.me.id}/days/${today()}`,{in:nowHM(),break_min:60},"ورود ثبت شد"); break;
    case "checkout": { const att=S.myAtt.find(x=>x.id===today())||{}; await save(`attendance/${S.me.id}/days/${today()}`,{...att,out:nowHM()},"خروج ثبت شد"); break; }
    case "report-new": reportForm(b.dataset.date); break;
    case "report-view": reportDetail(b.dataset.m,b.dataset.d); break;
    case "ra-csv": reportsCsv(); break;
    case "reload-reports": loadAllReports(); break;
    case "register": registerForm(); break;
    case "company": companyForm(); break;
    case "letter-view": letterView(id); break;
    case "letter-edit": { const l=S.letters.find(x=>x.id===id); if(!l) break; S.draft={...l,numAuto:false}; S.mod="letters"; S.sub="new"; S.forceFull=true; closeForm(); render(); window.scrollTo(0,0); break; }
    case "compose-go": composeSubmit(); break;
    case "compose-reset": S.draft=null; S.forceFull=true; render(); break;
    case "arch-new": archForm(); break;
    case "arch-edit": archForm(S.lettersArchive.find(x=>x.id===id)); break;
    case "arch-progress": archProgress(S.lettersArchive.find(x=>x.id===id)); break;
    case "arch-f": S.archF=b.dataset.k; renderView(); break;
    case "sign-office": { const l=S.letters.find(x=>x.id===id); if(l&&await save(`letters/${id}`,{...l,office_sig:{by:S.me.id,at:new Date().toISOString()}},"امضای مسئول دفتر ثبت شد")) letterView(id); break; }
    case "sign-ceo": { const l=S.letters.find(x=>x.id===id); if(l&&await save(`letters/${id}`,{...l,ceo_sig:{by:S.me.id,at:new Date().toISOString(),asset:S.settings.ceo_sig_asset||(myMember()||{}).signature_asset||null}},"امضای مدیرعامل ثبت شد")) letterView(id); break; }
    case "letter-dl": { const l=S.letters.find(x=>x.id===id); if(l) await downloadLetter(l); break; }
    case "patent-new": patentForm(); break;
    case "patent-edit": patentForm(S.patents.find(p=>p.id===id)); break;
    case "inbox": { const items=myInbox(); items.forEach(i=>S.seenTasks.add(i.id)); try{localStorage.setItem("ppt-seen",JSON.stringify([...S.seenTasks].slice(-500)))}catch(err){}
      $("#layer").innerHTML=`<div class="scrim" data-act="close-scrim"><div class="drawer"><div class="row"><h3 style="flex:1;margin:0">اعلان‌ها</h3><button class="btn ghost sm" data-act="close">بستن</button></div>${items.length?`<div class="stack" style="margin-top:12px">${items.map(i=>`<div class="card">${esc(i.text)}${i.task.due?`<br><span class="meta">مهلت: ${faDate(i.task.due)}</span>`:""}</div>`).join("")}</div>`:'<p class="empty">اعلان تازه‌ای ندارید.</p>'}<p class="note">اعلان موبایل و ایمیل با همگام‌سازی روزانه‌ی ایجنت ارسال می‌شود.</p></div></div>`; paintBell(); break; }
  }
});

document.addEventListener("input", e => { const el=e.target.closest("[data-c]"); if(!el) return;
  const d=getDraft(); d[el.dataset.c]=el.value; if(el.dataset.c==="number") d.numAuto=false;
  if(el.dataset.c==="identity"){ if(d.numAuto) d.number=nextLetterNo(d.identity); S.forceFull=true; renderView(); return; }
  const p=$("#cprev"); if(p) p.innerHTML=letterSheet(draftLetter()); });
document.addEventListener("change", e => { const cal=e.target.closest("[data-cal]"); if(cal){ if(cal.dataset.cal==="mine") S.calMine=cal.checked; else S.calTypes=cal.value?new Set([cal.value]):null; renderView(); return; }
  const el=e.target.closest("[data-ra]"); if(!el) return; S.ra[el.dataset.ra]=el.value; renderView(); });

// ================================================================== boot
async function boot(){
  render();
  const c = window.claude;
  if(!c || !c.use){ $("#meChip").textContent="نمای فقط‌خواندنی"; $("#view").innerHTML=`<p class="empty">این صفحه باید داخل claude.ai باز شود تا به پایگاه داده‌ی مشترک وصل شود.</p>`; return; }
  const [db,user,assets,sample,downloads] = await Promise.all(["db","user","assets","sample","downloads"].map(n=>c.use(n).catch(()=>null)));
  S.db=db; S.user=user; S.assets=assets; S.sample=sample; S.downloads=downloads;
  if(user){ const me=await user.me(); S.me={id:me.id,isOwner:me.isOwner,canEdit:me.canEdit}; S.canWrite=await user.can("data.write");
    S.userName=me.name||""; $("#meChip").textContent = me.name || (me.isOwner?"مالک سامانه":"کاربر"); }
  else $("#meChip").textContent="مهمان";
  if(!db){ $("#view").innerHTML=`<p class="empty">پایگاه داده برای این نما در دسترس نیست. با حساب claude.ai وارد شوید.</p>`; return; }
  subscribe();
  setTimeout(maybeWelcome, 4000); // fallback if the members snapshot is slow
  setTimeout(()=>{ if(isAdmin()) loadAllReports(); }, 2500);
}
boot();
})();
</script>

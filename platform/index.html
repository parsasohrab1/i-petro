<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: control-room console in the PTQ brand: charcoal and white with one flame-red signal for actions and alerts;
   persistent top rail with six modules, a sub-rail per module, dense tables that stack to cards on phones. */
:root{
  --bg:#f5f4f3; --surface:#ffffff; --sunken:#ecebea; --ink:#171515; --muted:#615b59; --line:#dcd8d6;
  --brand:#1d1b1b; --brand-ink:#ffffff; --signal:#d12a1f; --signal-soft:#fbe9e7;
  --ok:#1e8a4a; --warn:#b98a00; --risk:#d1600f; --bad:#b3261e; --info:#2d64c8;
  --f-ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121111; --surface:#1b1919; --sunken:#242121; --ink:#efeceb; --muted:#a9a19e; --line:#332f2e;
  --brand:#f1eeed; --brand-ink:#151313; --signal:#ff5b4c; --signal-soft:#3a1714;
  --ok:#4cc27c; --warn:#e2bb3c; --risk:#f08a43; --bad:#ef6b62; --info:#6f9cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121111; --surface:#1b1919; --sunken:#242121; --ink:#efeceb; --muted:#a9a19e; --line:#332f2e;
  --brand:#f1eeed; --brand-ink:#151313; --signal:#ff5b4c; --signal-soft:#3a1714;
  --ok:#4cc27c; --warn:#e2bb3c; --risk:#f08a43; --bad:#ef6b62; --info:#6f9cf0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.75 var(--f-ui);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
img.logo{border:0;background:none}
.logo{width:42px;height:42px;border-radius:50%;object-fit:contain;background:#141212;display:grid;place-items:center;font:800 13px var(--f-ui);color:#fff;border:2px solid #d12a1f}
.brand b{font-size:16px;font-weight:800;white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;display:block;line-height:1.3}
.grow{flex:1}
.mods{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.mods::-webkit-scrollbar{display:none}
.mods button{font:600 14px var(--f-ui);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;white-space:nowrap}
.mods button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.who{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;background:var(--surface);color:var(--ink)}
.bell{position:relative;cursor:pointer}
.bell i{position:absolute;top:-6px;left:-6px;background:var(--signal);color:var(--brand-ink);border-radius:99px;font:700 11px var(--f-mono);min-width:18px;height:18px;display:grid;place-items:center;font-style:normal}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px}
.subs button{font:500 13.5px var(--f-ui);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:6px;cursor:pointer}
.subs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
h2{font-size:19px;margin:6px 0 4px;text-wrap:balance}
h3{font-size:15.5px;margin:14px 0 6px}
.note{color:var(--muted);font-size:12.5px;margin:2px 0 10px;max-width:90ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.kpi.alert{border-color:var(--signal);background:var(--signal-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.btn{font:600 13.5px var(--f-ui);border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:6px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:var(--brand-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:var(--sunken);font-weight:600;white-space:nowrap}
td.t{font-weight:600;min-width:200px}
.mono,code{font-family:var(--f-mono);font-size:12px;direction:ltr;unicode-bidi:isolate}
code{background:var(--sunken);padding:1px 5px;border-radius:4px}
.meta{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.p-ok{color:var(--ok)}.p-warn{color:var(--warn)}.p-risk{color:var(--risk)}.p-bad{color:var(--bad)}.p-info{color:var(--info)}.p-mute{color:var(--muted)}
.light{display:inline-flex;gap:4px;vertical-align:middle}
.light i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.light.g i:nth-child(1){background:var(--ok)} .light.y i:nth-child(2){background:var(--warn)} .light.o i:nth-child(3){background:var(--risk)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid2>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);padding:22px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.banner{border:1px solid var(--signal);background:var(--signal-soft);border-radius:var(--r);padding:8px 12px;margin:8px 0}
.banner.bad{border-color:var(--bad)}
.steps{display:flex;gap:3px}
.steps span{width:14px;height:6px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--brand)}
details summary{cursor:pointer;color:var(--brand)}
a{color:var(--brand)}
/* drawer form */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:50;display:flex;justify-content:flex-start}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;padding-inline:20px max(20px,env(safe-area-inset-left,0px));border-left:1px solid var(--line)}
.drawer h3{margin-top:0}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select{width:100%}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:inline-flex;gap:3px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:60;font-size:13px}
/* letter sheet */
.sheet{background:#fff;color:#151515;border:1px solid var(--line);border-radius:4px;padding:28px 34px;max-width:780px;margin:0 auto;font-size:14px;line-height:2}
.sheet .lh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #d12a1f;padding-bottom:10px;margin-bottom:16px}
.sheet .lh img{max-height:64px}
.sheet .meta3{font-size:12.5px;line-height:1.9}
.sheet .sig{margin-top:40px;text-align:left}
.sheet .sig img{max-height:70px;display:block;margin-right:auto}
.sheet .foot{margin-top:24px;border-top:1px solid #ccc;padding-top:6px;font-size:11px;color:#555}
.compose{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
.compose>*{min-width:0}
@media (max-width:980px){.compose{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .rows table{min-width:0}.rows thead{display:none}
  .rows tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  .rows td{display:block;border:0;padding:2px 12px}.rows td.t{min-width:0}
  .rows td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-weight:600}
  .sheet{padding:18px}
}
@media print{body.print-sheet>*:not(#printCopy){display:none!important}body.print-sheet #printCopy .sheet{border:0;max-width:none}}
th.rownum,td.rownum{width:44px;min-width:44px;text-align:center;color:var(--muted);font-family:var(--f-mono)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--sunken);border-radius:var(--r);padding:8px;min-width:0}
.kcol h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.kcol.drop{outline:2px dashed var(--signal);outline-offset:-2px}
.kcard[draggable=true]{cursor:grab}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;line-height:1.6}
.cal-day{margin-top:14px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:2px}
.cal-item{display:flex;gap:8px;align-items:baseline;padding:4px 0;flex-wrap:wrap}
.sheet.ltr{direction:ltr;text-align:left}.sheet.ltr .sig{text-align:left}.sheet.ltr .sig img{margin-right:0}
.tour{position:fixed;inset-inline:0;bottom:0;z-index:70;display:flex;justify-content:center;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.tour .card{max-width:680px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.28);border-color:var(--signal)}
.tour h3{margin:0 0 4px}.tour p{margin:4px 0}
.tour .bar2{height:4px;background:var(--line);border-radius:2px;margin-bottom:8px}.tour .bar2 i{display:block;height:4px;background:var(--signal);border-radius:2px}
.tour-hl{outline:3px solid var(--signal)!important;outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:.6}}}
</style>

function openForm({title, fields, values={}, onSave, extra="", required=false}){
  const f = fields.map(fd => {
    const v = values[fd.k] ?? fd.value ?? "";
    const id = "f_"+fd.k;
    let ctl;
    if(fd.type==="textarea") ctl = `<textarea id="${id}">${esc(v)}</textarea>`;
    else if(fd.type==="select") ctl = `<select id="${id}">${Object.entries(fd.options).map(([k,l])=>`<option value="${esc(k)}"${k===v?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
    else if(fd.type==="days") ctl = `<div class="days" id="${id}">${WEEKDAYS.map(([k,l])=>`<label><input type="checkbox" value="${k}"${(v||[]).includes(k)?" checked":""}>${l}</label>`).join("")}</div>`;
    else if(fd.type==="file") ctl = `<input id="${id}" type="file" accept="${fd.accept||"image/*"}">${v?`<span class="meta">فایل فعلی ثبت شده است.</span>`:""}`;
    else ctl = `<input id="${id}" type="${fd.type||"text"}" value="${esc(v)}" ${fd.dir?`dir="${fd.dir}"`:""}>`;
    return `<div class="field"><label for="${id}">${esc(fd.label)}</label>${ctl}${fd.hint?`<span class="meta">${esc(fd.hint)}</span>`:""}</div>`;
  }).join("");
  $("#layer").innerHTML = `<div class="scrim"${required?"":' data-act="close-scrim"'}><form class="drawer" id="drawer"><h3>${esc(title)}</h3>${extra}${f}
    <div class="row"><button class="btn" type="submit">${required?"ثبت‌نام و ورود به سامانه":"ذخیره"}</button>${required?"":'<button class="btn ghost" type="button" data-act="close">انصراف</button>'}</div></form></div>`;
  $("#drawer").addEventListener("submit", async ev => {
    ev.preventDefault();
    const out = {};
    for(const fd of fields){
      const el = document.getElementById("f_"+fd.k);
      if(fd.type==="days") out[fd.k] = [...el.querySelectorAll("input:checked")].map(i=>i.value);
      else if(fd.type==="file") out[fd.k] = el.files[0] || null;
      else if(fd.type==="number") out[fd.k] = el.value===""?null:Number(el.value);
      else out[fd.k] = el.value.trim();
    }
    const btn = ev.submitter; if(btn) btn.disabled = true;
    const ok = await onSave(out);
    if(ok!==false) closeForm(); else if(btn) btn.disabled=false;
  });
}

// ------------------------------------------------------------------ deadline risk: office days vs. deadlines
// A person who is assigned work but is in the office on too few days before its deadline is warned and can hand it back;
// the owner sees who is at risk, who could take over, and what has been handed back. Covers tasks, scholarship items and tracked projects.
const RISK_DAYS = 21;   // only deadlines this close are checked
const officeLeft = (m,to) => { let n=0; const t=today(); for(let d=t; d<=to; d=addDays(d,1)){ if(isOfficeDay(m,d)&&!(d===t&&new Date().getHours()>=17)) n++; } return n; };
function riskLevel(m,to){
  if(!m||!to||!(m.office_days||[]).length) return null;
  const days=dayDiff(to); if(days<0||days>RISK_DAYS) return null;
  const left=officeLeft(m,to);
  if(left===0) return {lvl:"bad",left,days};
  if(left===1&&days<=3) return {lvl:"warn",left,days};
  return null;
}
function deadlineRisks(id){
  const m=(S.members||[]).find(x=>x.id===id), out=[]; if(!m) return out;
  const add=(o,to)=>{ const r=riskLevel(m,to); if(r) out.push({...o,to,...r}); };
  for(const t of S.tasks) if(t.assignee===id&&t.due&&!["done","approved"].includes(t.status)) add({k:"t"+t.id,type:"task",id:t.id,title:t.title},t.due);
  for(const p of SCH){ if(!p.deadline||schStatus(p)==="applied") continue;
    const st=schState(p.id), mine=Object.values(st.items||{}).some(it=>it&&it.owner===id&&!it.done), a=asgOf("sch_"+p.id);
    if(a&&a.doer===id) add({k:"s"+p.id,type:"sch",id:p.id,title:p.uni},p.deadline); }   // only the scholarship a person has actually taken counts (one at a time)
  for(const t of ((S.m||{}).tenders||[])){ const tr=S.tracking[t.id]||{};
    if(tr.owner===id&&!tr.outcome&&ACTIVE.has(t.status)&&t.days_left!=null&&t.days_left>=0) add({k:"k"+t.id,type:"trk",id:t.id,title:t.title},addDays(today(),t.days_left)); }
  return out;
}
const riskWhen = r => `ددلاین ${faDate(r.to)} (${r.days===0?"امروز":faNum(r.days)+" روز دیگر"})`;
function riskBanner(rs){
  return `<div class="banner ${rs.some(r=>r.lvl==="bad")?"bad":""}"><b>هشدار ددلاین:</b> با توجه به روزهای حضور شما در شرکت، برای موارد زیر احتمال نرسیدن به ددلاین هست. اگر نمی‌رسید، آن را بازگردانید تا شخص دیگری انجام دهد.<ul style="margin:4px 0">${rs.map(r=>`<li>«${esc(r.title)}» – ${riskWhen(r)}؛ ${r.left===0?"تا آن روز روز حضوری ندارید":"فقط "+faNum(r.left)+" روز حضور مانده"} <button class="btn sm sig" data-act="risk-return" data-t="${r.type}" data-id="${esc(r.id)}">بازگرداندن</button> <button class="btn sm ghost" data-act="risk-open" data-t="${r.type}" data-id="${esc(r.id)}">نمایش در سامانه</button></li>`).join("")}</ul></div>`;
}
function teamRiskBanner(){
  const me=S.me.id, rows=[], since=addDays(today(),-7);
  const cand=(to,ex)=>(S.members||[]).filter(x=>x.id!==ex&&(x.office_days||[]).length&&officeLeft(x,to)>=2).slice(0,3).map(x=>x.full_name).join("، ");
  for(const m of (S.members||[])){ if(m.id===me) continue;
    for(const r of deadlineRisks(m.id)){ const c=cand(r.to,m.id); rows.push(`<li>${esc(m.full_name)}: «${esc(r.title)}» – ${riskWhen(r)}؛ ${r.left===0?"تا آن روز حضور ندارد":"فقط "+faNum(r.left)+" روز حضور"}${c?` · جایگزین پیشنهادی: ${esc(c)}`:""}</li>`); } }
  for(const t of S.tasks) if(t.returned_at&&String(t.returned_at).slice(0,10)>=since&&!t.assignee&&t.status!=="approved") rows.push(`<li>${esc(memberName(t.returned_by))} تسک «${esc(t.title)}» را بازگرداند؛ به شخص دیگری واگذار کنید.</li>`);
  for(const s of (S.schol||[])){ const p=SCH.find(x=>x.id===s.id); if(p&&s.returned_at&&String(s.returned_at).slice(0,10)>=since&&!(asgOf("sch_"+s.id)||{}).doer) rows.push(`<li>${esc(memberName(s.returned_by))} کار بورسیه‌ی «${esc(p.uni)}» را بازگرداند؛ مسئول جدید لازم است.</li>`); }

async function riskReturn(type,id){
  const me=S.me.id, now=new Date().toISOString();
  if(type==="task"){ const t=S.tasks.find(x=>x.id===id); if(!t) return; const {id:_,...rest}=t;
    await save(`tasks/${id}`,{...rest,assignee:"",status:"todo",returned_by:me,returned_at:now,returned_note:"بازگردانده‌شده به‌دلیل ددلاین و حضور ناکافی",updated:now},"تسک بازگردانده شد؛ مالک اطلاع دارد"); }
  else if(type==="sch"){ const cur=schState(id), it={...(cur.items||{})};
    for(const k of Object.keys(it)) if(it[k]&&it[k].owner===me&&!it[k].done) it[k]={...it[k],owner:null};
    await schSave(id,{items:it,returned_by:me,returned_at:now}); const a=asgOf("sch_"+id); if(a&&a.doer===me) await remove(`assign/sch_${id}`); }
  else if(type==="trk"){ const t=S.tracking[id]||{};
    await save(`tracking/${id}`,{...t,owner:"",log:[...(t.log||[]),{at:now,by:me,note:"به‌دلیل ددلاین و حضور ناکافی بازگردانده شد"}].slice(-40),updated:now,updated_by:me},"بازگردانده شد؛ مالک اطلاع دارد"); }
}

const cdocList = k => { const extra=(S.cdocs[k]||[]); const gone=new Set((S.cdocs[k+"_removed"]||[])); return [...CDOC_SEED[k].filter(d=>!gone.has(d.id)),...extra]; };
function cdocTable(k){
  const list=cdocList(k);
  return table(["مدرک","نوع","باز کردن","دانلود",""],list.map(d=>`<tr>${td("مدرک",esc(d.name),"t")}${td("نوع",`<span class="pill p-mute">${esc(d.kind||"مدرک")}</span>`)}${td("باز کردن",`<button class="btn sm ghost" data-act="cdoc-view" data-id="${esc(d.id)}">مشاهده</button>`)}${td("دانلود",`<button class="btn sm sig" data-act="cdoc-dl" data-id="${esc(d.id)}">دانلود</button>`)}${td("",isAdmin()?`<button class="btn sm ghost" data-act="cdoc-del" data-c="${k}" data-id="${esc(d.id)}">حذف از فهرست</button>`:"")}</tr>`),"مدرکی ثبت نشده است.");
}
function companyDocsView(k){
  const c=CDOC_COMPANIES[k];
  if(!isAdmin()) return `<p class="empty">مدارک شرکت فقط برای owner و مدیران سامانه نمایش داده می‌شود.</p>`;
  return `<p class="note">مدارک شرکت <b>${esc(c.title)}</b> برای ${esc(c.scope)}. این مدارک حساس‌اند (روزنامه‌ی رسمی، امضاها و رزومه)؛ فقط owner و مدیران آن‌ها را می‌بینند. برای ارسال به کارفرما، «دانلود» را بزنید.</p>`+
    `<div class="toolbar">${isAdmin()?`<button class="btn sig" data-act="cdoc-add" data-c="${k}">افزودن مدرک (بارگذاری)</button>`:""}<button class="btn ghost" data-act="sub" data-k="${c.rfp}" data-mod="market">رفتن به RFPهای ${k==="ppt"?"داخلی":"بین‌المللی"}</button></div>`+cdocTable(k);
}
function companyDocsStrip(k){
  if(!isAdmin()) return "";
  const c=CDOC_COMPANIES[k], list=cdocList(k);
  return `<div class="card" style="margin-bottom:10px"><b>مدارک ${esc(c.title)} برای این RFPها:</b> ${list.map(d=>`<button class="pill p-info" data-act="cdoc-dl" data-id="${esc(d.id)}" title="دانلود: ${esc(d.name)}" style="cursor:pointer;border:0">${esc(d.name.length>34?d.name.slice(0,34)+"…":d.name)} ⬇</button>`).join(" ")} <button class="btn sm ghost" data-act="sub" data-k="${c.view}">همه‌ی مدارک ▸</button></div>`;
}

async function cdocFetch(id){ const d=[...cdocList("ppt"),...cdocList("parsa")].find(x=>x.id===id)||{name:"document"}; const r=await fetch(blobUrl(id)); if(!r.ok) throw new Error("fetch "+r.status); return {blob:await r.blob(),name:d.name}; }
async function cdocDownload(id){ try{ const {blob,name}=await cdocFetch(id); const fn=name.replace(/[\/:*?"<>|]+/g,"_")+".pdf"; if(S.downloads) await S.downloads.save({filename:fn,data:blob}); else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn; a.click(); } }catch(e){ if(!e||e.code!=="declined") toast("دریافت فایل انجام نشد؛ صفحه را داخل claude.ai باز کنید."); } }
async function cdocView(id){ try{ const {blob}=await cdocFetch(id); const u=URL.createObjectURL(new Blob([blob],{type:"application/pdf"})); const w=window.open(u,"_blank"); if(!w) toast("مرورگر باز شدن را مسدود کرد؛ دکمه‌ی «دانلود» را بزنید."); }catch(e){ toast("باز کردن فایل ممکن نشد؛ دکمه‌ی «دانلود» را بزنید."); } }
async function cdocAdd(k){
  openForm({title:"افزودن مدرک – "+CDOC_COMPANIES[k].title,fields:[{k:"name",label:"نام مدرک"},{k:"kind",label:"نوع (ثبتی، گواهی، رزومه، قرارداد …)"},{k:"file",label:"فایل (PDF یا تصویر)",type:"file",accept:"application/pdf,image/*"}],
   onSave:async v=>{ if(!v.name||!v.file){toast("نام و فایل لازم است.");return false}
     const id=await uploadImage(v.file); if(!id) return false;
     const cur=S.cdocs[k]||[]; return save("settings/company_docs",{...S.cdocs,[k]:[...cur,{id,name:v.name,kind:v.kind||"مدرک"}]},"مدرک اضافه شد"); }});
}

 ar:{sub:"مقترح شراكة في المناقصة: {project}",g:"السادة المحترمون،",p1:"أكتب إليكم باسم {co}، وهي شركة مقرها تركيا متخصصة في الذكاء الاصطناعي والتوائم الرقمية والصيانة التنبؤية لقطاعات الطاقة والصناعات العملياتية والصحة. طوّرنا محفظة من 22 منتجاً ذكياً (مستويات نضج تقني من 3 إلى 5) وننفذ مشاريع تجريبية على بيانات العملاء.",p2:"لقد اطلعنا على المناقصة «{project}» الصادرة عن {buyer} (الموعد النهائي: {deadline}؛ {url}) ونود المشاركة فيها مع شريك محلي.",p3:"نوفر التقنية وتطوير البرمجيات والتنفيذ الفني. ونبحث عن شريك في بلدكم لديه مراجع ذات صلة وتسجيل محلي والوثائق التأهيلية التي تطلبها المناقصة، ليكون الطرف المتعاقد أو قائد التحالف.",p4:"إذا كان الأمر يهمكم، يسعدنا ترتيب مكالمة قصيرة وإرسال ملف قدراتنا ومراجعنا. شكراً لوقتكم.",sig:"مع خالص التقدير،"},
 ur:{sub:"ٹینڈر کے لیے شراکت داری کی تجویز: {project}",g:"محترم جناب/محترمہ،",p1:"میں {co} کی جانب سے لکھ رہا ہوں، جو ترکی میں قائم ایک کمپنی ہے اور توانائی، پراسیس انڈسٹری اور صحت کے لیے مصنوعی ذہانت، ڈیجیٹل ٹوئنز اور پیش گو دیکھ بھال میں مہارت رکھتی ہے۔ ہم نے 22 ذہین مصنوعات (ٹیکنالوجی کی پختگی کی سطح 3 سے 5) تیار کی ہیں اور کلائنٹ کے ڈیٹا پر پائلٹ منصوبے چلاتے ہیں۔",p2:"ہم نے {buyer} کی جانب سے جاری کردہ ٹینڈر «{project}» (آخری تاریخ: {deadline}؛ {url}) دیکھا ہے اور مقامی شراکت دار کے ساتھ اس میں حصہ لینا چاہتے ہیں۔",p3:"ہم ٹیکنالوجی، سافٹ ویئر کی ترقی اور تکنیکی عمل درآمد فراہم کرتے ہیں۔ ہمیں پاکستان میں ایک ایسے شراکت دار کی تلاش ہے جس کے پاس متعلقہ حوالہ جات، مقامی رجسٹریشن اور ٹینڈر کے مطلوبہ اہلیتی دستاویزات ہوں، اور جو معاہدے کا فریق یا کنسورشیم کا قائد بن سکے۔",p4:"اگر آپ دلچسپی رکھتے ہیں تو ہم مختصر کال کا بندوبست کریں گے اور اپنی صلاحیتوں کا تعارف اور حوالہ جات بھیجیں گے۔ آپ کے وقت کا شکریہ۔",sig:"نیک تمناؤں کے ساتھ،"},
 uk:{sub:"Пропозиція партнерства щодо тендера: {project}",g:"Шановні панове,",p1:"Пишу від імені {co} — компанії, що базується в Туреччині та спеціалізується на штучному інтелекті, цифрових двійниках і предиктивному обслуговуванні для енергетики, процесної промисловості та охорони здоров'я. Ми розробили портфель із 22 інтелектуальних продуктів (рівні технологічної готовності 3–5) і проводимо пілотні проєкти на даних клієнтів.",p2:"Ми знайшли тендер «{project}» замовника {buyer} (крайній термін: {deadline}; {url}) і хотіли б взяти в ньому участь разом із місцевим партнером.",p3:"Ми надаємо технологію, розробку програмного забезпечення та технічне впровадження. Шукаємо в Україні партнера з відповідними референціями, місцевою реєстрацією та кваліфікаційними документами, яких вимагає тендер, який виступив би стороною договору або лідером консорціуму.",p4:"Якщо вас це цікавить, ми з радістю домовимося про коротку розмову та надішлемо опис компетенцій і референції. Дякуємо за ваш час.",sig:"З повагою,"},
 mk:{sub:"Предлог за соработка за тендерот: {project}",g:"Почитувани,",p1:"Ви пишувам во име на {co}, компанија со седиште во Турција, специјализирана за вештачка интелигенција, дигитални близнаци и предиктивно одржување за енергетиката, процесната индустрија и здравството. Развивме портфолио од 22 интелигентни производи (нивоа на технолошка зрелост од 3 до 5) и спроведуваме пилот-проекти врз податоци на клиентите.",p2:"Го идентификувавме тендерот „{project}“ на {buyer} (рок: {deadline}; {url}) и би сакале да учествуваме заедно со локален партнер.",p3:"Обезбедуваме технологија, развој на софтвер и техничка имплементација. Бараме партнер во Северна Македонија со соодветни референци, локална регистрација и квалификациски документи што ги бара тендерот, кој би настапил како договорна страна или водач на конзорциум.",p4:"Доколку сте заинтересирани, со задоволство ќе договориме краток разговор и ќе испратиме профил на нашите способности и референци. Ви благодариме за времето.",sig:"Со почит,"}
};
const IP_CO = "Parsa International Group";
// Sender name = the member who holds the "send partner emails" task of this tender (defined from the partners window); company name until a task exists.
const ipTask = tid => (S.tasks||[]).filter(x=>x.ip_tender===tid).sort((a,b)=>String(b.created||"").localeCompare(String(a.created||"")))[0];
const ipSender = tid => { const tk=ipTask(tid), n=tk?memberName(tk.assignee):"—"; return n!=="—"?n:IP_CO; };
const ipFromHdr = tid => { const n=ipSender(tid); return (/^[ -~]*$/.test(n)?'"'+n.replace(/[\x22\x5c]/g,"")+'"':"=?UTF-8?B?"+btoa(String.fromCharCode(...new TextEncoder().encode(n)))+"?=")+" <"+IP_FROM+">"; };
const IP_REQ = "Division of work: your company would present the buyer's requirements to us for this tender, including all documents requested in the tender documentation (company registration, references, certificates, guarantees and forms) and the project requirements. {co} would then carry out the software development, coding and technical implementation of the project.";
const IP_FROM = "info@parsaint.group", IP_CC = "oil.ms.sohrabi@gmail.com", IP_WEBMAIL = "https://parsaint.group/webmail/";
const ipIsIntl = t => (t.market||"international")==="international";
const ipKey = t => t.country in IP_C ? t.country : null;
const ipShort = v => { let x=String(v||"").replace(/^[^–]{2,40}–[^–]{2,60}–\s*/,"").trim(); return x.length>120?x.slice(0,117).trim()+"…":x; };
function ipCompose(t,lang,partner){
  const T=IP_T[lang]||IP_T.en, f=x=>String(x).replace(/\{co\}/g,IP_CO).replace(/\{project\}/g,ipShort(t.title)).replace(/\{buyer\}/g,t.buyer||"").replace(/\{deadline\}/g,t.deadline||"—").replace(/\{url\}/g,t.url||"");
  const sn=ipSender(t.id), sig=T.sig+"\n"+(sn===IP_CO?"":sn+"\n")+IP_CO+(lang==="en"?"\nTürkiye":"");   // no assignee: ipSender already returns the company name, so it must not be printed twice
  return {subject:f(T.sub), body:[(partner&&partner.name&&lang==="en")?"Dear "+partner.name+" team,":f(T.g),"",f(T.p1),"",f(T.p2),"",f(T.p3),"",f(T.p4),"",f(IP_REQ)+(lang==="en"?"":"\n(English)"),"",sig].join("\n")};
}
const ipB64 = str => { const u=new TextEncoder().encode(str); let b=""; u.forEach(c=>b+=String.fromCharCode(c)); return btoa(b); };
const ipHdr = str => /^[ -~]*$/.test(str) ? str : "=?UTF-8?B?"+ipB64(str)+"?=";
async function ipDrafts(t){
  const k=ipKey(t), partners=(((S.ip.countries||{})[k]||{}).partners)||[]; if(!partners.length){ toast("شریکی ثبت نشده است."); return; }
  const CRLF=String.fromCharCode(13,10), files=[]; let noMail=0;
  partners.forEach((x,i)=>{
    const m=ipCompose(t,"en",x), to=(x.email||"").trim(); if(!to) noMail++;
    const lines=["X-Unsent: 1","From: "+ipFromHdr(t.id),"To: "+to,"Cc: "+IP_CC,"Subject: "+ipHdr(m.subject),"MIME-Version: 1.0","Content-Type: text/plain; charset=utf-8","Content-Transfer-Encoding: base64","",(ipB64(m.body).match(/.{1,76}/g)||[]).join(CRLF)];
    files.push({name:String(i+1).padStart(2,"0")+"_"+String(x.name||"partner").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40)+".eml",data:lines.join(CRLF)});
  });
  const bytes=await zipStore(files), blob=new Blob([bytes],{type:"application/zip"}), fn=`partner-drafts-${k||"intl"}.zip`;
  try{ if(S.downloads) await S.downloads.save({filename:fn,data:blob}); else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn; a.click(); } toast(`${faNum(files.length)} درفت ساخته شد`+(noMail?` (${faNum(noMail)} شریک ایمیل ثبت‌شده ندارد؛ گیرنده را در وب‌میل پر کنید)`:"")+"."); }
  catch(err){ if(!err||err.code!=="declined") toast("دریافت فایل انجام نشد."); }
}
async function ipCopyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.top="-1000px"; document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok; }catch(e){ return false; }
}
function ipEml(t,lang,to){
  const m=ipCompose(t,lang), CRLF=String.fromCharCode(13,10);
  const lines=["X-Unsent: 1","From: "+ipFromHdr(t.id),"To: "+to,"Cc: "+IP_CC,"Subject: "+ipHdr(m.subject),"MIME-Version: 1.0","Content-Type: text/plain; charset=utf-8","Content-Transfer-Encoding: base64","",(ipB64(m.body).match(/.{1,76}/g)||[]).join(CRLF)];
  const blob=new Blob([lines.join(CRLF)],{type:"message/rfc822"}), fn="partner-"+(lang||"en")+".eml";
  if(S.downloads) return S.downloads.save({filename:fn,data:blob}).then(()=>true,(e)=>(e&&e.code==="declined")?false:false);
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=fn; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
  return Promise.resolve(true);
}
function ipWebmailUrl(t,lang,to,cc){
  const m=ipCompose(t,lang), q=encodeURIComponent;
  return `${IP_WEBMAIL}?_task=mail&_action=compose&_to=${q(to)}&_cc=${q(cc)}&_subject=${q(m.subject)}&_body=${q(m.body)}`;
}
const partnerBtn = t => (ipIsIntl(t)&&isAdmin()) ? ` <button class="btn sm sig" data-act="ip-open" data-id="${esc(t.id)}">شرکای تجاری</button>` : "";
const partnerEmail = x => String((x&&(x.email||x.public_contact))||"").trim();
// recipient for the draft: the address the agent read from the partner's own website (tender partners first, then the country list)
function ipRecipient(t){ const k=ipKey(t), rec=(S.ip.countries||{})[k]||{}; return String(t.suggested_to||"").trim()||[...(t.partners||[]),...(rec.partners||[])].map(partnerEmail).find(Boolean)||""; }
function ipLangs(t){ const k=ipKey(t); return ["en",...(k?IP_C[k][1]:[])]; }
function ipOpen(tid,tab){
  const t=S.m.tenders.find(x=>x.id===tid); if(!t) return;
  if(tab) S.ipTab=tab; else if(S.ipTid!==tid) S.ipTab="partners"; S.ipTid=tid;
  const k=ipKey(t), cinfo=k?IP_C[k]:null, rec=(S.ip.countries||{})[k]||{}, partners=rec.partners||[], langs=ipLangs(t);
  const tabs=[["partners","شرکای تجاری"],...langs.map(l=>["mail_"+l,"ایمیل "+IP_L[l]])];
  const drafted=(S.ip.drafts||{})[tid];
  let body="";
  if(S.ipTab==="partners"){
    const tk=ipTask(tid), who=ipSender(tid);
    body=`<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><span class="meta">فرستنده‌ی ایمیل‌ها (مسئول تسک):</span><b>${esc(who)}</b>${tk?`<span class="pill p-info">${esc(TASK_ST[tk.status]||tk.status)}</span>`:""}<button class="btn sm ${tk?"ghost":"sig"}" data-act="ip-owner-task" data-id="${esc(tid)}">${tk?"تسک جدید برای فرد دیگر":"تعریف تسک ارسال ایمیل و تعیین فرستنده"}</button></div>`+`<p class="note">شرکت‌هایی که در ${esc(cinfo?cinfo[0]:t.country)} امکان همکاری با آن‌ها وجود دارد: شریک محلی که سابقه، ثبت شرکت و مدارک مناقصه را دارد و ما فناوری، محصول و کدنویسی را ارائه می‌کنیم. فهرست از جست‌وجوی روزانه بهبود می‌یابد؛ پیش از تماس، علاقه و ظرفیت هر شرکت در سایت رسمی‌اش تأیید شود.</p>`+
     (rec.note?`<p class="banner">${esc(rec.note)}</p>`:"")+
     (partners.length?table(["شرکت","شهر","ایمیل","نوع","چرا مناسب است","منبع"],partners.map(x=>`<tr>${td("شرکت",`<b>${esc(x.name)}</b>${x.verified===false?' <span class="pill p-warn">تأیید شود</span>':""}`,"t")}${td("شهر",esc(x.city||"—"))}${td("ایمیل",partnerEmail(x)?`<a dir="ltr" href="mailto:${esc(partnerEmail(x))}">${esc(partnerEmail(x))}</a>`:"—")}${td("نوع",esc(x.type||"—"))}${td("چرا",esc(x.why||""))}${td("منبع",x.url?link(x.url,"لینک"):"—")}</tr>`),"شریکی ثبت نشده است."):`<p class="empty">برای این کشور هنوز شریکی ثبت نشده است. جست‌وجوی روزانه تکمیل می‌کند، یا تسک زیر را بزنید.</p>`)+
     `<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">${partners.length?`<button class="btn sm sig" data-act="ip-drafts" data-id="${esc(tid)}">درفت ایمیل برای همه‌ی شرکا (ZIP، فرستنده: ${esc(ipSender(tid))})</button>`:""}<button class="btn sm sig" data-act="ip-task" data-id="${esc(tid)}">📥 ثبت در صف: پیدا کردن شریک برای Claude</button></div>`;
  } else {
    const lang=S.ipTab.slice(5), m=ipCompose(t,lang), rtl=IP_RTL.has(lang);
    body=`<p class="note">پیش‌نویس ایمیل به زبان ${esc(IP_L[lang])}${lang!=="en"?" (زبان رسمی کشور) ":" "}برای ارسال از ایمیل شرکت (${IP_FROM}). ایمیل گیرنده را از وب‌سایت رسمی شریک وارد کنید؛ نسخه‌ی کپی (CC) برای ایمیل شخصی شما درج شده است. ${lang!=="en"?"ترجمه‌ی اولیه است؛ پیش از ارسال یک فرد بومی بازبینی کند.":""}</p>
     <p class="banner"><b>پیش از ارسال بررسی کنید:</b> آدرس ایمیل گیرنده و نام شرکت شریک را با وب‌سایت رسمی او تطبیق دهید و مطمئن شوید هیچ مورد اشتباهی نیست؛ نام پروژه، کارفرما و مهلت داخل متن هم درست باشد. ایمیل‌های با برچسب «تأیید شود» هنوز از سایت رسمی تأیید نشده‌اند.</p>
     <div class="card"><div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:8px">
       <label style="flex:1;min-width:220px"><div class="meta">از (فرستنده)</div><input id="ipFrom" type="email" value="${esc(IP_FROM)}" readonly dir="ltr" style="width:100%"></label>
       <label style="flex:1;min-width:220px"><div class="meta">به (ایمیل شریک)</div><input id="ipTo" type="email" value="${esc(ipRecipient(t))}" placeholder="partner@company.com" dir="ltr" style="width:100%"></label>
       <label style="flex:1;min-width:220px"><div class="meta">رونوشت (CC)</div><input id="ipCc" type="email" value="${esc(IP_CC)}" dir="ltr" style="width:100%"></label></div><div class="meta">موضوع</div><p dir="${rtl?"rtl":"ltr"}" style="margin:0 0 8px"><b>${esc(m.subject)}</b></p><textarea id="ipBody" readonly dir="${rtl?"rtl":"ltr"}" style="width:100%;min-height:340px;font-size:14px">${esc(m.body)}</textarea></div>
     <div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"><button class="btn sm sig" data-act="ip-copy">کپی متن</button><button class="btn sm sig" data-act="ip-wlink" data-t="${esc(lang)}">کپی لینک وب‌میل</button><button class="btn sm sig" data-act="ip-webmail" data-t="${esc(lang)}">باز کردن در وب‌میل شرکت (parsaint.group)</button><button class="btn sm ghost" data-act="ip-mailto" data-t="${esc(lang)}">برنامه‌ی ایمیل سیستم</button><button class="btn sm ghost" data-act="ip-eml" data-t="${esc(lang)}">دانلود درفت .eml</button></div>`;
    body+=`<p class="meta">اگر پیش‌نمایش اجازه‌ی باز شدن پنجره یا برنامه‌ی ایمیل را نداد: «کپی لینک وب‌میل» را بزنید و لینک را در یک تب جدید مرورگر بچسبانید، یا «دانلود درفت .eml» را بزنید و فایل را در برنامه‌ی ایمیل باز کنید. «کپی متن» هم متن کامل را می‌دهد تا در پیام وب‌میل بچسبانید.</p>`;
  }

// ---------- Daily planner: only tasks the owner marked as repeating are reopened on the next office day. Tasks are never created automatically.
// Runs when an admin has the dashboard open (once per day; ids are deterministic so two admins cannot create duplicates). The owner's expectation level
// (settings/planner.level) sets how many tasks an idle person receives: standard 1, high 2, intense 3.
async function runPlanner(force){
  if(!S.db||!isAdmin()) return;
  const cfg=S.planner||{}, day=today();
  if(!force&&(cfg.auto===false||cfg.last_run===day)) return;
  if(!["members","tasks"].every(k=>S.got.has(k))) return;
  const now=new Date().toISOString(), writes=[];
  let reopened=0;
  for(const t of S.tasks){   // standing tasks repeat on their owner's office days once the last round is finished
    if(!t.repeat||!isDone(t)||(t.due||"")>=day) continue;
    const m=S.members.find(x=>x.id===t.assignee); if(!isOfficeDay(m,day)) continue;
    const {id,...rest}=t; writes.push([`tasks/${id}`,{...rest,status:"todo",due:day,updated:now,runs:[...(t.runs||[]),{due:t.due,done:t.updated||""}].slice(-60)}]); reopened++; }
  for(const [path,data] of writes){ try{ await S.db.doc(path).set(data); }catch(e){ console.error("planner",path,e); } }
  try{ await S.db.doc("settings/planner").set({...cfg,last_run:day,last_reopened:reopened,updated:now}); }catch(e){}
  if(force) toast(`${faNum(reopened)} تسک تکرارشونده باز شد.`);
}

  const reqs=Object.entries(p.edit_requests||{}), eds=p.editors||[];
  if(canEditProduct(p)) return `<button class="btn sm ghost" data-act="product-edit" data-id="${esc(p.id)}">ویرایش</button>`;
  return (p.edit_requests||{})[S.me.id] ? `<span class="pill p-mute">درخواست شما در انتظار تأیید owner است</span>` : `<button class="btn sm sig" data-act="product-req" data-id="${esc(p.id)}">درخواست اجازه‌ی کار</button>`;
}
function productAdmin(p){
  if(!isAdmin()) return "";
  const reqs=Object.entries(p.edit_requests||{}), eds=p.editors||[];
  if(!reqs.length&&!eds.length) return "";
  return `<details${reqs.length?" open":""}><summary><b>دسترسی کار روی محصول</b> – ${faNum(reqs.length)} درخواست، ${faNum(eds.length)} مجاز</summary>
   ${reqs.map(([m,r])=>`<div class="row" style="gap:8px;align-items:center;padding:3px 0">${esc(memberName(m)||r.name||m)} <span class="meta">درخواست ${faDate((r.at||"").slice(0,10))}</span><button class="btn sm sig" data-act="product-approve" data-id="${esc(p.id)}" data-m="${esc(m)}">تأیید</button><button class="btn sm ghost" data-act="product-reject" data-id="${esc(p.id)}" data-m="${esc(m)}">رد</button></div>`).join("")}
   ${eds.map(m=>`<div class="row" style="gap:8px;align-items:center;padding:3px 0"><span class="pill p-ok">${esc(memberName(m))}</span><button class="btn sm ghost" data-act="product-revoke" data-id="${esc(p.id)}" data-m="${esc(m)}">لغو دسترسی</button></div>`).join("")}</details>`;
}

function contactLinks(m){
  const out=[]; const tg=String(m.telegram||"").trim(), ph=String(m.phone||"").replace(/[^\d+]/g,""), em=String(m.email||"").trim();
  if(ph) out.push(`<a class="btn sm ghost" href="tel:${esc(ph)}">📞 تماس</a>`);
  if(ph&&/^0?9\d{9}$/.test(ph.replace(/^\+98/,"0"))) out.push(`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/98${esc(ph.replace(/^\+?98/,"").replace(/^0/,""))}">واتس‌اپ</a>`);

const AUTO_OUT = "17:00";
async function autoCheckout(rows, owner){
  if(!S.db||!S.me.id) return;
  S.autoOut=S.autoOut||new Set();
  for(const a of rows){ const key=(a.member||owner)+"/"+a.id;
    if(!a.in||a.out||S.autoOut.has(key)) continue;
    if(!(a.id<today()||(a.id===today()&&nowHM()>=AUTO_OUT))) continue;
    S.autoOut.add(key);
    const {id,member,...rest}=a, out=toMin(a.in)>=toMin(AUTO_OUT)?a.in:AUTO_OUT;

  }
}

function burndownSvg(sp){

  const W=440,H=170,P=32, X=i=>P+i*(W-2*P)/n, Y=v=>T?H-P-(v/T)*(H-2*P):H-P;
  const actual=[]; for(let i=0;i<=last;i++) actual.push([X(i),Y(T-doneBy(addDays(sp.start,i)))]);
  const line=pts2=>pts2.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار Burndown" style="width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:8px">
   <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/><line x1="${P}" y1="${P-8}" x2="${P}" y2="${H-P}" stroke="var(--line)"/>
   <polyline points="${line([[X(0),Y(T)],[X(n),Y(0)]])}" fill="none" stroke="var(--muted)" stroke-dasharray="5 4"/>
   <polyline points="${line(actual)}" fill="none" stroke="var(--signal)" stroke-width="2.5"/>${actual.length?`<circle cx="${actual[actual.length-1][0]}" cy="${actual[actual.length-1][1]}" r="4" fill="var(--signal)"/>`:""}
   <text x="${P-4}" y="${P-1}" font-size="10" fill="var(--muted)" text-anchor="end">${T}</text><text x="${P-4}" y="${H-P+4}" font-size="10" fill="var(--muted)" text-anchor="end">0</text>
   <text x="${P}" y="${H-10}" font-size="10" fill="var(--muted)">${esc(faDate(sp.start))}</text><text x="${W-P}" y="${H-10}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(faDate(sp.end))}</text>

const REPORT_START = "2026-10-21"; // reports are expected from this date for members who registered before it
const addDays = (d,n) => new Date(new Date(d+"T12:00:00").getTime()+n*864e5).toISOString().slice(0,10);
const wdOf = d => WEEKDAYS[(new Date(d+"T12:00:00").getDay()+1)%7][0];
const isOfficeDay = (m,d) => !!m && (m.office_days||[]).includes(wdOf(d));
// office days (last 14) on which this member has not sent a report; today only counts after 16:00
function missingReportDays(me){
  const out=[]; if(!me||!S.repLoaded) return out;
  const cutoff=me.joined||REPORT_START, hr=new Date().getHours();
  for(let i=0;i<14;i++){
    const d=addDays(today(),-i);
    if(d<cutoff) break;
    if(!isOfficeDay(me,d)) continue;
    if(i===0&&hr<16) continue;
    if(S.myReports.some(r=>(r.date||r.id)===d)) continue;
    out.push(d);
  }
  return out;
}

const QTY_W = {"یک":1,"دو":2,"سه":3,"چهار":4,"پنج":5,"شش":6,"هفت":7,"هشت":8,"نه":9,"ده":10,"پانزده":15,"بیست":20};
const faToLat = s => String(s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function taskQuota(t){ const s=faToLat((t.title||"")+" "+(t.desc||"").split("\n")[0]), m=s.match(/(\d+|پانزده|بیست|یک|دو|سه|چهار|پنج|شش|هفت|هشت|نه|ده)\s*(?:عدد\s*)?(مقاله|آردیکل|آرتیکل|بورسیه|نامه|محصول|RFP)/);
  if(!m) return null; const n=/^\d+$/.test(m[1])?Number(m[1]):QTY_W[m[1]]; return n>0?{n,unit:m[2]==="مقاله"||m[2]==="آردیکل"||m[2]==="آرتیکل"?"article":m[2]}:null; }
function auditTasks(memberId, date, tasks){
  const day = x => (x||"").slice(0,10), artDone = Object.values(S.artSt||{}).filter(x=>x&&x.by===memberId&&day(x.at)===date&&(x.status==="doing"||x.status==="applied")).length;
  const rows=[];
  for(const t of tasks){
    const fin=isDone(t), finDay=day(t.done_at||t.updated), q=taskQuota(t), touched=day(t.updated)===date;
    const lastRun=((t.runs||[]).slice(-1)[0]||{}), doneToday=(fin&&finDay===date)||day(lastRun.done)===date;
    const expected = t.repeat==="daily" || q&&q.unit==="article" || (!fin && ((t.due||"9999")<=date || t.status==="doing")) || doneToday;
    if(!expected||(fin&&finDay<date&&t.repeat!=="daily")) continue;

function raDays(){

  <p><b>طرف اول (شرکت):</b> ${esc(co)}${st.reg_no?`، شماره‌ی ثبت ${esc(st.reg_no)}`:""}${st.national_id?`، شناسه‌ی ملی ${esc(st.national_id)}`:""}${st.address?`، نشانی: ${esc(st.address)}`:""}${ceo?`، به نمایندگی ${esc(ceo.full_name)} (مدیرعامل)`:""}.</p>
  <p><b>طرف دوم (عضو متعهد):</b></p>
  <table style="width:100%;border-collapse:collapse">${row("نام و نام خانوادگی",m.full_name)}${row("کد ملی",m.national_code)}${row("عنوان شغلی",m.role_title)}${row("تیم",TEAMS[m.team])}${row("سطح / نوع همکاری",STAFF[m.staff_type])}${row("تلفن همراه",m.phone)}${row("ایمیل",m.email)}</table>
  <h4>ماده ۲ – موضوع</h4>
  <p>موضوع این قرارداد، تعهد طرف دوم به حفظ محرمانگی کلیه‌ی اطلاعات، داده‌ها و محصولاتی است که در جریان همکاری با شرکت، از جمله از طریق سامانه‌ی iPetro و ابزارها و مخازن مرتبط، می‌بیند، دریافت می‌کند یا به آن‌ها دسترسی می‌یابد.</p>
  <h4>ماده ۳ – اطلاعات محرمانه</h4>
  <p>اطلاعات محرمانه شامل همه‌ی موارد زیر است، خواه کتبی، شفاهی، الکترونیکی یا تصویری و خواه «محرمانه» نامیده شده باشد یا نه: ۱) محصولات هوشمند و نرم‌افزاری شرکت، شامل کد منبع، مدل‌ها، الگوریتم‌ها، معماری، مستندات، نمونه‌های اولیه و پروپوزال‌ها؛ ۲) داده‌ها و مجموعه‌داده‌های شرکت، مشتریان و صنایع طرف قرارداد؛ ۳) فهرست مشتریان، شرکا، سرمایه‌گذاران، مناقصات، رویدادها، مکاتبات و نامه‌ها؛ ۴) اطلاعات مالی، قیمت‌ها، قراردادها و برنامه‌های تجاری؛ ۵) ایده‌ها، اختراع‌ها و پرونده‌های ثبت اختراع؛ ۶) اطلاعات کارکنان و گزارش‌های عملکرد؛ ۷) رمزها، کلیدها و دسترسی‌ها؛ ۸) هر اطلاعاتی که شرکت آن را محرمانه اعلام کند.</p>
  <h4>ماده ۴ – تعهدات طرف دوم</h4>
  <p>الف) اطلاعات محرمانه را به هیچ شخص یا شرکت خارج از شرکت افشا نکند؛ ب) از آن‌ها جز برای انجام وظایف محوله استفاده نکند و برای منفعت خود یا دیگران بهره‌برداری نکند؛ پ) آن‌ها را بدون مجوز کتبی شرکت کپی، دانلود، عکس‌برداری، در حساب یا دستگاه شخصی ذخیره، یا به ابزارها و سرویس‌های هوش مصنوعی و پیام‌رسان‌های بیرونی ارسال نکند؛ ت) از حساب کاربری و دسترسی خود محافظت کند و آن را در اختیار دیگری نگذارد؛ ث) هرگونه نشت یا سوءاستفاده‌ی احتمالی را بلافاصله به مدیرعامل گزارش دهد؛ ج) محصولات و ایده‌های شرکت را به نام خود یا دیگری ثبت، منتشر یا عرضه نکند.</p>
  <h4>ماده ۵ – استثناها</h4>
  <p>اطلاعاتی که بدون تقصیر طرف دوم عمومی شده باشد، یا پیش از همکاری، به‌صورت مستند و بدون تعهد محرمانگی نزد او بوده باشد، مشمول این قرارداد نیست. در صورت الزام قانونی یا قضایی به افشا، طرف دوم باید پیش از افشا شرکت را مطلع کند و فقط حداقل لازم را افشا کند.</p>
  <h4>ماده ۶ – مالکیت</h4>
  <p>کلیه‌ی محصولات، کدها، مدل‌ها، داده‌ها و آثار تولیدشده در جریان همکاری، متعلق به شرکت است و طرف دوم هیچ حقی نسبت به آن‌ها ندارد.</p>
  <h4>ماده ۷ – مدت</h4>
  <p>این تعهدات از تاریخ امضا شروع می‌شود و در تمام مدت همکاری و تا پنج سال پس از پایان آن ادامه دارد. نسبت به اسرار تجاری و کد منبع، تعهد تا زمانی که اطلاعات محرمانه باقی بماند ادامه دارد.</p>
  <h4>ماده ۸ – بازگرداندن اطلاعات</h4>
  <p>با پایان همکاری یا درخواست شرکت، طرف دوم باید همه‌ی اطلاعات، فایل‌ها و نسخه‌های در اختیار خود را بازگرداند و نسخه‌های خود را پاک کند.</p>
  <h4>ماده ۹ – خسارت</h4>
  <p>در صورتی که افشا یا استفاده‌ی غیرمجاز طرف دوم از اطلاعات محرمانه، موجب ورود خسارت به شرکت شود، طرف دوم ملزم است خسارت وارده را تا سقف <b>${cap}</b> (معادل ${capRial}) به شرکت بپردازد. میزان خسارت با نظر کارشناس رسمی دادگستری یا مرجع قضایی تعیین می‌شود. این سقف مانع از درخواست توقف نقض، پیگیری حقوقی و کیفری، و اعمال سایر حقوق شرکت بر اساس قوانین نیست.</p>
  <h4>ماده ۱۰ – امضای الکترونیکی</h4>
  <p>طرف دوم با ورود به حساب کاربری خود در سامانه و ثبت تأیید، این قرارداد را با تصویر امضای ثبت‌شده‌ی خود امضا می‌کند. تاریخ و ساعت امضا در سامانه ثبت می‌شود و طرفین آن را مطابق قانون تجارت الکترونیکی معتبر و معادل امضای دستی می‌دانند.</p>
  <h4>ماده ۱۱ – قانون حاکم و حل اختلاف</h4>
  <p>این قرارداد تابع قوانین جمهوری اسلامی ایران است و هرگونه اختلاف در مراجع صالح قضایی تهران رسیدگی می‌شود.</p>

  </div></div>`;

function ndaView(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;

    <div class="row" style="margin-top:10px"><button class="btn sig" data-act="nda-sign"${hasProof(m)?"":" disabled"}>امضا و ثبت قرارداد</button><button class="btn ghost" data-act="close">بعداً</button></div></div>`
    :`<div class="row" style="margin:10px 0"><button class="btn ghost" data-act="close">بستن</button>${signed?`<button class="btn ghost" data-act="print-sheet" data-sel="#ndaSheet">چاپ / ذخیره PDF</button>`:""}</div>`;
  $("#layer").innerHTML=`<div class="scrim" data-act="close-scrim"><div class="drawer" style="max-width:860px;width:96vw;overflow:auto">${sign}${ndaSheet(m)}</div></div>`;

async function ndaSign(){
  const m=myMember(); if(!m) return;
  if(!$("#nda_ok").checked){ toast("ابتدا تأیید کنید که متن قرارداد را خوانده‌اید."); return; }
  const nc=faDigits($("#nda_nc").value).replace(/\D/g,""), ph=faDigits($("#nda_ph").value).trim();
  if(!validNationalCode(nc)){ toast("کد ملی معتبر نیست؛ ۱۰ رقم را دوباره بررسی کنید."); return; }
  const sig=m.signature_asset||null;
  if(!hasProof(m)){ toast("برای احراز هویت، امضا و عکس اثر انگشت هر دو لازم است؛ از «ویرایش مشخصات من» ثبت کنید."); return; }
  const ok=await save(`members/${S.me.id}`,{...m,national_code:nc,phone:ph,signature_asset:sig,nda_version:NDA_VERSION,nda_at:new Date().toISOString(),nda_sig_asset:sig,nda_fp_asset:m.fingerprint_asset,nda_name:m.full_name,nda_cap_toman:NDA_CAP_TOMAN},"قرارداد محرمانگی امضا شد");
  if(ok) setTimeout(()=>ndaView(S.me.id),300);
}

const TRAIN_PAY = {"":"—",online:"پرداخت آنلاین (درگاه)",installment:"پرداخت قسطی (۳ ماهه)",card:"کارت به کارت",sheba:"واریز به شماره شبا"};
const TRAIN_COURSES = {

  admin:["ICDL","آموزش استفاده از هوش مصنوعی در مهارت‌افزایی"]
};
const needsTraining = m => !!m && !needsNda(m) && !!TRAIN_COURSES[m.team];
const trainingDone = m => !!(m && m.training && m.training.version===TRAIN_VERSION && m.training.at);
function validNationalCode(c){ c=faDigits(c).replace(/\D/g,""); if(!/^\d{10}$/.test(c)||/^(\d)\1{9}$/.test(c)) return false;
  const sum=[...c].slice(0,9).reduce((a,d,i)=>a+Number(d)*(10-i),0)%11, k=Number(c[9]); return sum<2?k===sum:k===11-sum; }
const splitName = n => { const parts=String(n||"").trim().split(/\s+/); return parts.length<2?[parts[0]||"",""]:[parts.slice(0,-1).join(" "),parts[parts.length-1]]; };
function trainingSheet(m){
  const t=m.training||{}, [fn,ln]=splitName(m.full_name), courses=TRAIN_COURSES[m.team]||[];
  const sigImg=id=>id?`<img src="${esc(blobUrl(id))}" alt="امضا" style="max-height:64px;display:block">`:'<span class="meta">—</span>';
  const box=on=>on?"☑":"☐";
  const sup=t.support?`${esc(memberName(t.support.by))} – ${faDate(t.support.at.slice(0,10))}${sigImg((S.members.find(x=>x.id===t.support.by)||{}).signature_asset)}`:'<span class="meta">در انتظار تأیید واحد پشتیبانی</span>';
  return `<div class="sheet" id="trnSheet">
  <h3 style="text-align:center;margin:0 0 6px">فرم آموزش – ${esc(TEAMS[m.team]||"")}</h3>
  <p>شماره فرم: <b>${esc(t.form_no||"—")}</b> &nbsp; تاریخ: <b>${faDate((t.at||new Date().toISOString()).slice(0,10))}</b></p>
  <h4>اطلاعات فردی</h4>
  <p>نام: <b>${esc(fn)}</b> &nbsp; نام‌خانوادگی: <b>${esc(ln)}</b><br>شماره ملی: <b>${esc(t.national_code||m.national_code||"—")}</b> &nbsp; شماره موبایل: <b>${esc(t.phone||m.phone||"—")}</b></p>
  <h4>دوره مورد نظر</h4>
  <p>${courses.map(c=>`${box((t.courses||courses).includes(c))} ${esc(c)}`).join("<br>")}</p>
  <h4>مدرس دوره</h4>
  <p>${TRAIN_TEACHERS.map(x=>`${box((t.teachers||[]).includes(x))} ${esc(x)}`).join(" &nbsp; ")}</p>
  <h4>روش پرداخت شهریه</h4>
  <p>${Object.entries(TRAIN_PAY).filter(([k])=>k).map(([k,l])=>`${box(t.pay_method===k)} ${esc(l)}`).join(" &nbsp; ")}<br>توضیحات: هزینه دوره پرداخت شده است به صورت کامل.</p>
  <div style="display:flex;gap:24px;justify-content:space-between;margin-top:22px;flex-wrap:wrap">
    <div style="flex:1;min-width:200px"><b>امضا و تأیید واحد پشتیبانی شرکت:</b><br>${sup}</div>
    <div style="flex:1;min-width:200px"><b>امضای متقاضی:</b><br>${trainingDone(m)?`${sigImg(t.sig_asset)}<span class="meta">احراز هویت و تأیید: ${faDate(t.at.slice(0,10))}</span>`:'<span class="meta">هنوز تأیید نشده است</span>'}${m.fingerprint_asset?`<br>اثر انگشت:${sigImg(m.fingerprint_asset)}`:'<br><span class="meta">عکس اثر انگشت ثبت نشده است.</span>'}</div>
  </div></div>`;
}
function trainingView(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const self=mid===S.me.id, done=trainingDone(m), t=m.training||{}, courses=TRAIN_COURSES[m.team]||[], [fn,ln]=splitName(m.full_name);
  const form=self&&!done?`<div class="card" style="margin:12px 0">

    ${hasProof(m)?`<p>احراز هویت با امضا و اثر انگشت؛ هر دو پای فرم درج می‌شود: <img src="${esc(blobUrl(m.signature_asset))}" alt="امضا" style="max-height:48px;vertical-align:middle;background:#fff"> <img src="${esc(blobUrl(m.fingerprint_asset))}" alt="اثر انگشت" style="max-height:48px;vertical-align:middle;background:#fff"></p>`:`<div class="banner bad">${PROOF_MSG} <button class="btn sm sig" data-act="register">ثبت امضا و اثر انگشت</button></div>`}
    <label><input type="checkbox" id="tr_ok"> مشخصات بالا متعلق به من است و صحت آن را تأیید می‌کنم.</label>
    <div class="row" style="margin-top:10px"><button class="btn sig" data-act="trn-sign"${hasProof(m)?"":" disabled"}>تأیید هویت و امضا</button><button class="btn ghost" data-act="close">بعداً</button></div></div>`
    :`<div class="row" style="margin:10px 0"><button class="btn ghost" data-act="close">بستن</button>${done?`<button class="btn ghost" data-act="print-sheet" data-sel="#trnSheet">چاپ / ذخیره PDF</button>`:""}${isAdmin()&&done&&!t.support?`<button class="btn sig" data-act="trn-support" data-m="${esc(m.id)}">تأیید واحد پشتیبانی</button>`:""}</div>`;
  $("#layer").innerHTML=`<div class="scrim" data-act="close-scrim"><div class="drawer" style="max-width:860px;width:96vw;overflow:auto">${form}${trainingSheet(m)}</div></div>`;

async function trainingSign(){
  const m=myMember(); if(!m) return;
  if(!$("#tr_ok").checked){ toast("ابتدا صحت مشخصات را تأیید کنید."); return; }
  const nc=faDigits($("#tr_nc").value).replace(/\D/g,""), ph=faDigits($("#tr_ph").value).replace(/\D/g,"");
  if(!validNationalCode(nc)){ toast("کد ملی معتبر نیست؛ ۱۰ رقم را دوباره بررسی کنید."); return; }
  if(!/^09\d{9}$/.test(ph)){ toast("شماره موبایل باید مانند ۰۹۱۲۳۴۵۶۷۸۹ باشد."); return; }
  if(!hasProof(m)){ toast("برای احراز هویت، امضا و عکس اثر انگشت هر دو لازم است؛ از «ویرایش مشخصات من» ثبت کنید."); return; }
  const courses=[...document.querySelectorAll(".tr_c:checked")].map(i=>i.value); if(!courses.length){ toast("حداقل یک دوره را انتخاب کنید."); return; }
  const teachers=[...document.querySelectorAll(".tr_t:checked")].map(i=>i.value);
  const no="TR-"+today().replace(/-/g,"")+"-"+String(S.members.filter(x=>x.training).length+1).padStart(3,"0");
  const training={version:TRAIN_VERSION,form_no:no,at:new Date().toISOString(),national_code:nc,phone:ph,courses,teachers,pay_method:$("#tr_pm").value,paid:true,sig_asset:m.signature_asset,fp_asset:m.fingerprint_asset,verified_by:S.me.id};
  const ok=await save(`members/${S.me.id}`,{...m,national_code:nc,phone:ph,training},"فرم آموزش تأیید و امضا شد");
  if(ok) setTimeout(()=>trainingView(S.me.id),300);
}

  const e=Number(faDigits(q.ielts)); if(p.ielts){ if(!e) sc-=10; else if(e>=p.ielts+0.5) sc+=14; else if(e>=p.ielts) sc+=8; else if(e>=p.ielts-0.5) sc-=2; else sc-=12; }
  sc+=Math.min(Number(faDigits(q.pubs))||0,3)*5+Math.min(Number(faDigits(q.work))||0,5)*2;
  sc=Math.max(3,Math.min(90,Math.round(sc)));
  return {pct:sc,label:sc>=55?"بالا":sc>=35?"متوسط":"کم"};
}

}

const SCH_PROP = {monash:{"title": "Toward Distribution-Robust Medical Imaging Models in the Wild: Reliable and Generalisable AI Across Clinical Settings", "blocks": [{"t": "title", "x": "Toward Distribution-Robust Medical Imaging Models in the Wild: Reliable and Generalisable AI Across Clinical Settings"}, {"t": "p", "x": "PhD research proposal · Faculty of Information Technology, Monash University · Applicant: Mohammad Parsa Sohrabi · Proposed supervisor: [to be confirmed – agreement of a supervisor is required before applying] · Draft of 2026-10"}, {"t": "h", "x": "1. Title"}, {"t": "p", "x": "Toward Distribution-Robust Medical Imaging Models in the Wild: Reliable and Generalisable AI Across Clinical Settings"}, {"t": "h", "x": "2. Abstract"}, {"t": "p", "x": "Deep-learning models for medical imaging often perform well on the data of the hospital that produced their training set and then lose accuracy at another hospital, because scanners, imaging protocols and patient populations differ. This change in the data distribution (distribution shift) is a main obstacle to safe clinical deployment, and a model that fails silently is more dangerous than one that is less accurate but knows when it is unreliable. This project will develop and evaluate a framework that makes medical imaging models robust and trustworthy under shift. It combines four components: (i) systematic measurement of how scanner, centre, protocol and population shifts degrade performance; (ii) domain-generalisation and robust representation learning, so that performance holds on centres unseen during training; (iii) uncertainty estimation, including conformal prediction with coverage guarantees that are checked, and where necessary adapted, under shift; and (iv) calibration and reliability assessment, so that the stated confidence matches the observed accuracy. The work will use public multi-centre imaging collections (candidates: TCIA, the Medical Segmentation Decathlon and ADNI, subject to licence and supervisor advice) with leave-one-centre-out evaluation, and will deliver a reproducible benchmark and open software for assessing the reliability of medical imaging models. No result of the proposed work is claimed in this document."}, {"t": "h", "x": "3. Introduction"}, {"t": "p", "x": "Artificial intelligence now matches specialists on many narrow imaging tasks, such as detecting pneumonia on chest radiographs, segmenting tumours on MRI or grading retinal disease. Most published evaluations, however, use test images drawn from the same source as the training images. Clinical practice is different: a model is trained at one or a few centres and then used at others, with different scanner vendors, field strengths, acquisition protocols, reconstruction settings and patient mixes. Evidence from radiology shows that this matters. A pneumonia detector trained on data from one hospital system performed worse on data from other systems and had learned to use site-specific cues (Zech et al., 2018). The reliability of medical imaging AI outside its development setting is therefore a problem of patient safety as well as of accuracy."}, {"t": "p", "x": "This project asks how medical imaging models can be made to work, and to say honestly when they cannot, in the conditions of real clinical settings. Its focus is MRI, with brain imaging as the main use case because of the availability of multi-centre data, and with CT and radiograph data as secondary checks of whether the findings carry over."}, {"t": "h", "x": "4. Research Problem"}, {"t": "p", "x": "A model f is trained on images from a source distribution P_S and deployed on a target distribution P_T that differs from it. Four kinds of difference are of practical importance: (a) acquisition shift – scanner vendor, field strength, sequence parameters and reconstruction; (b) protocol and annotation shift – different imaging protocols and different labelling practice between centres; (c) population shift – age, sex, disease prevalence, comorbidity and ethnicity; and (d) temporal shift – changes in equipment and practice over time. Under these shifts accuracy can fall, but the more serious consequence is that the model's confidence does not fall with it, so users receive wrong predictions with high stated certainty."}, {"t": "p", "x": "The problem has three parts. First, shift is rarely measured: published work often reports a single external test set without saying which factors differ. Second, methods that improve generalisation have mostly been compared on natural images, and reviews of domain generalisation find that, under fair comparison, no method consistently beats plain empirical risk minimisation (Gulrajani and Lopez-Paz, 2021). Whether this holds for medical imaging with realistic centre shifts is not settled. Third, uncertainty estimates and calibration are known to degrade under shift (Ovadia et al., 2019), and conformal prediction, whose coverage guarantee relies on exchangeability between calibration and test data, loses that guarantee when the data shift (Tibshirani et al., 2019; Barber et al., 2023)."}, {"t": "p", "x": "Preliminary evidence from the applicant's own earlier studies in other fields points the same way and motivates the proposal; these studies are not on medical images, they use public data and are the applicant's own runs, and they are cited only as motivation. (1) For a lipid-nanoparticle property model, conformal intervals with a nominal coverage of 0.90 achieved a coverage of only 0.72 when test molecules came from a chemical series not seen in training. (2) For a gas-turbine emission model on drifting data, an interval calibrated once fell to a coverage of 0.32, whereas an adaptive scheme kept the nominal 0.90 level at the cost of intervals about twice as wide. (3) On a chest X-ray data set (PneumoniaMNIST, 64×64 pixels), gradient-based saliency maps were less faithful to the model than a random map. (4) On a wearable-sensor data set, random splits overstated accuracy by 3–5 percentage points compared with subject-level splits. Each is a small study and none is a clinical result; together they show that evaluations that ignore the split between source and target can be misleading. These results were obtained by the applicant and will be re-checked and reported in full detail in the thesis only if they are relevant to the final design."}, {"t": "h", "x": "5. Literature Review"}, {"t": "p", "x": "Distribution shift in medical imaging. Reviews and large benchmarks document performance drops across sites (Zech et al., 2018). The WILDS benchmark collects real shifts, including histopathology slides from different hospitals, and shows large gaps between in-distribution and out-of-distribution accuracy (Koh et al., 2021). For MRI, intensity differences between scanners are often handled by harmonisation, for example ComBat, which was developed for genomic batch effects (Johnson et al., 2007) and adapted to imaging data (Fortin et al., 2018)."}, {"t": "p", "x": "Detecting shift. Failing Loudly (Rabanser et al., 2019) compares dimensionality reduction with statistical two-sample tests for detecting shift in deployment data. For medical images the open questions are which representation is most sensitive to clinically relevant shift, and how detection should be tied to the model's performance rather than to image statistics alone."}, {"t": "p", "x": "Domain generalisation and robust representations. Approaches include adversarial invariance (Ganin et al., 2016), feature-statistics alignment (Sun and Saenko, 2016), style mixing (Zhou et al., 2021) and data augmentation such as mixup (Zhang et al., 2018). A careful comparison on fixed protocols found that empirical risk minimisation is a strong baseline (Gulrajani and Lopez-Paz, 2021). A gap exists for medical imaging, where the protocols for choosing hyperparameters without target data and for leave-one-centre-out evaluation are not standard."}, {"t": "p", "x": "Uncertainty estimation and calibration. Deep ensembles (Lakshminarayanan et al., 2017) and Monte-Carlo dropout (Gal and Ghahramani, 2016) are common uncertainty estimators; modern networks tend to be over-confident and are commonly recalibrated by temperature scaling (Guo et al., 2017), with the expected calibration error as a standard summary (Naeini et al., 2015). Ovadia et al. (2019) show that the quality of uncertainty estimates deteriorates with increasing shift for many methods."}, {"t": "p", "x": "Conformal prediction. Split conformal prediction gives prediction sets with a guaranteed marginal coverage when calibration and test data are exchangeable (Vovk et al., 2005; Angelopoulos and Bates, 2021). Extensions address covariate shift through importance weighting (Tibshirani et al., 2019), online shift through adaptive levels (Gibbs and Candès, 2021) and general departures from exchangeability (Barber et al., 2023). Their behaviour for multi-centre medical imaging, where the shift is neither a known covariate shift nor a smooth drift, and where only a few images from a new centre may be available, has not been systematically studied."}, {"t": "p", "x": "Research gap. Existing work treats shift measurement, generalisation, uncertainty and calibration as separate topics and evaluates them on different benchmarks. What is missing is (i) a single reproducible protocol that evaluates all four together under leave-one-centre-out conditions, and (ii) an assessment of whether conformal and calibration methods can be made to give useful guarantees at a new centre from a small local calibration sample. The literature search for this proposal is preliminary and will be extended and documented as a systematic search in the first year."}, {"t": "h", "x": "6. Research Aim & Objectives"}, {"t": "p", "x": "Aim: to develop and evaluate a reproducible framework that makes medical imaging models more reliable under distribution shift, by detecting shift, generalising across centres, and reporting calibrated, valid uncertainty."}, {"t": "ul", "x": ["O1. Quantify the effect of scanner, centre, protocol and population shift on the performance of standard imaging models on public multi-centre data, using leave-one-centre-out evaluation.", "O2. Evaluate and compare domain-generalisation and representation-learning methods against strong baselines, under a fixed protocol without access to target-domain labels.", "O3. Develop methods to detect shift automatically at deployment time and link the alarm to expected loss of performance.", "O4. Study the validity of conformal prediction under centre shift, and develop an adaptation that works with a small local calibration sample.", "O5. Assess calibration and reliability with standard measures, and test whether combining generalisation, calibration and uncertainty improves reliability beyond each component alone.", "O6. Release an open, reproducible benchmark and software package for assessing the reliability of medical imaging models."]}, {"t": "h", "x": "7. Research Questions"}, {"t": "ul", "x": ["RQ1. Which factors (scanner, protocol, centre, population) cause the largest loss of performance when a medical imaging model is moved between clinical centres?", "RQ2. Which domain-generalisation methods improve performance on unseen centres, and do they beat well-tuned empirical risk minimisation under a fair protocol?", "RQ3. How can the uncertainty of predictions be estimated reliably under distribution shift, and can shift be detected automatically before it harms patients?", "RQ4. Does the combination of generalisation, calibration and uncertainty estimation, including conformal prediction, increase the trustworthiness of medical imaging models more than any one of them alone?"]}, {"t": "h", "x": "8. Methodology"}, {"t": "p", "x": "The programme has four research strands that share one evaluation protocol. Methods are described at the level of a proposal; the final design will be fixed with the supervisors after the first-year review."}, {"t": "p", "x": "8.1 Data. Candidate public sources are The Cancer Imaging Archive (TCIA) (Clark et al., 2013), the Medical Segmentation Decathlon (Antonelli et al., 2022) and the Alzheimer's Disease Neuroimaging Initiative (ADNI) (Petersen et al., 2010), the last being a multi-site MRI collection with scanner and protocol metadata. Possible additions are other multi-centre collections and the hospital-shift tasks of WILDS (Koh et al., 2021). Final selection depends on access, licence terms (ADNI requires an application and a data-use agreement), fit with the research questions and the advice of the supervisor. A small pilot on the lightweight MedMNIST collection will be used to debug the pipeline only, not for conclusions. Patient privacy, ethics approval and data-use agreements will be handled as required by Monash University."}, {"t": "p", "x": "8.2 Strand 1 – Measuring distribution shift (O1, O3). Images and their metadata (scanner vendor, field strength, protocol, site, age, sex) will be used to define shift factors. For each factor, performance is measured with that factor held out in training and present in testing. Shift in deployment will be detected with two-sample tests and domain classifiers on learned features and on image statistics (Rabanser et al., 2019), and the detector will be calibrated against the observed loss of performance, so that an alarm carries a stated meaning."}, {"t": "p", "x": "8.3 Strand 2 – Domain generalisation and robust representations (O2). Baselines: empirical risk minimisation with strong augmentation and pretrained backbones. Methods: adversarial invariance (Ganin et al., 2016), feature alignment (Sun and Saenko, 2016), style mixing (Zhou et al., 2021), mixup (Zhang et al., 2018) and intensity harmonisation (Fortin et al., 2018), plus self-supervised pretraining on unlabelled multi-centre data. All methods use the same architecture families, the same hyperparameter-selection rule that does not use target-domain data, and several random seeds with confidence intervals."}, {"t": "p", "x": "8.4 Strand 3 – Uncertainty estimation and conformal prediction (O4). Uncertainty estimators: deep ensembles (Lakshminarayanan et al., 2017), Monte-Carlo dropout (Gal and Ghahramani, 2016) and test-time augmentation. Conformal prediction: split conformal prediction as the baseline, then weighted and adaptive variants (Tibshirani et al., 2019; Gibbs and Candès, 2021; Barber et al., 2023). The central question is how much local calibration data a new centre needs to restore the stated coverage, and whether a centre-aware (Mondrian-type) calibration or a shift-aware weighting helps. Coverage will be reported per centre, not only on average, because average coverage can hide a failure in the worst centre."}, {"t": "p", "x": "8.5 Strand 4 – Calibration and reliability (O5). Calibration is assessed before and after temperature scaling and related post-hoc methods (Guo et al., 2017) using the expected calibration error (Naeini et al., 2015), the Brier score and reliability diagrams, under in-distribution and out-of-distribution conditions. A reliability report will combine discrimination, calibration, coverage, selective-prediction performance (accuracy when low-confidence cases are referred to a clinician) and shift alarms."}, {"t": "p", "x": "8.6 Evaluation protocol. Splits: leave-one-centre-out or leave-one-scanner-out; no patient appears in more than one split. Metrics: AUROC and AUPRC; sensitivity and specificity at a pre-specified operating point; Dice score for segmentation tasks; expected calibration error and Brier score; empirical coverage and set size for conformal methods; and performance on out-of-distribution data. Statistical practice: at least five seeds, bootstrap confidence intervals and tests for paired comparisons. Negative results will be reported as such; a method that does not beat the baseline will be stated to be so."}, {"t": "p", "x": "8.7 Software and reproducibility. Code, configurations and split definitions will be released under an open licence, with fixed random seeds and a documented environment, so that the benchmark can be re-run by others. Computing needs (GPU time for training ensembles and repeated runs across centres) will be estimated with the supervisor and the university's research computing services."}, {"t": "p", "x": "8.8 Risks. (i) Data access may be delayed (ADNI approval) – mitigated by starting with openly available collections. (ii) Some shifts may be too small to measure – then the result is reported and the scope moved to harder shifts. (iii) Domain-generalisation methods may not beat the baseline – this is a valid finding. (iv) Conformal guarantees may not be recoverable from small local samples – the limits will be characterised rather than hidden."}, {"t": "h", "x": "9. Expected Contributions"}, {"t": "ul", "x": ["A reproducible benchmark and protocol for evaluating the reliability of medical imaging models under centre, scanner and population shift.", "An empirical answer, for medical imaging, to whether domain-generalisation methods outperform well-tuned baselines under fair conditions.", "A method for automatic detection of distribution shift at deployment, with an alarm linked to expected loss of performance.", "An analysis of conformal prediction under centre shift, with an adaptation that works with a small local calibration sample, and per-centre coverage reporting as good practice.", "Open-source software and a reliability report format that clinicians and regulators can read.", "Peer-reviewed publications (the number and venues to be agreed with the supervisors) and a PhD thesis. Possible venues include MICCAI, Medical Image Analysis and IEEE Transactions on Medical Imaging; none is submitted yet."]}, {"t": "h", "x": "10. Timeline"}, {"t": "table", "head": ["Period", "Activities", "Output"], "rows": [["Months 1–6", "Systematic literature review; data access and ethics; reproduce baselines on a pilot; define shift factors and the evaluation protocol", "Review paper draft; protocol; pilot results"], ["Months 7–12", "Strand 1: shift measurement and detection on the main data sets; confirmation of candidature", "Paper 1 (shift measurement); confirmation report"], ["Months 13–20", "Strand 2: domain generalisation under a fixed protocol; baselines versus methods", "Paper 2 (generalisation benchmark)"], ["Months 21–30", "Strands 3 and 4: uncertainty, conformal prediction under shift, calibration; combined reliability study", "Paper 3 (conformal under centre shift); Paper 4 (combined framework)"], ["Months 31–38", "Release of benchmark and software; additional modality check (CT / radiographs); thesis writing", "Open benchmark; thesis draft"], ["Months 39–42", "Thesis completion, submission and dissemination", "Thesis; final papers"]]}, {"t": "h", "x": "11. References"}, {"t": "ul", "x": ["Angelopoulos, A.N. and Bates, S. (2021) A gentle introduction to conformal prediction and distribution-free uncertainty quantification. arXiv:2107.07511.", "Antonelli, M. et al. (2022) The Medical Segmentation Decathlon. Nature Communications, 13, 4128.", "Barber, R.F., Candès, E.J., Ramdas, A. and Tibshirani, R.J. (2023) Conformal prediction beyond exchangeability. The Annals of Statistics, 51(2), 816–845.", "Clark, K. et al. (2013) The Cancer Imaging Archive (TCIA): maintaining and operating a public information repository. Journal of Digital Imaging, 26, 1045–1057.", "Fortin, J.-P. et al. (2018) Harmonization of cortical thickness measurements across scanners and sites. NeuroImage, 167, 104–120.", "Gal, Y. and Ghahramani, Z. (2016) Dropout as a Bayesian approximation: representing model uncertainty in deep learning. Proceedings of ICML.", "Ganin, Y. et al. (2016) Domain-adversarial training of neural networks. Journal of Machine Learning Research, 17(59), 1–35.", "Gibbs, I. and Candès, E. (2021) Adaptive conformal inference under distribution shift. Advances in Neural Information Processing Systems (NeurIPS).", "Gulrajani, I. and Lopez-Paz, D. (2021) In search of lost domain generalization. Proceedings of ICLR.", "Guo, C., Pleiss, G., Sun, Y. and Weinberger, K.Q. (2017) On calibration of modern neural networks. Proceedings of ICML.", "Johnson, W.E., Li, C. and Rabinovic, A. (2007) Adjusting batch effects in microarray expression data using empirical Bayes methods. Biostatistics, 8(1), 118–127.", "Koh, P.W. et al. (2021) WILDS: a benchmark of in-the-wild distribution shifts. Proceedings of ICML.", "Lakshminarayanan, B., Pritzel, A. and Blundell, C. (2017) Simple and scalable predictive uncertainty estimation using deep ensembles. Advances in Neural Information Processing Systems (NeurIPS).", "Naeini, M.P., Cooper, G.F. and Hauskrecht, M. (2015) Obtaining well calibrated probabilities using Bayesian binning. Proceedings of AAAI.", "Ovadia, Y. et al. (2019) Can you trust your model's uncertainty? Evaluating predictive uncertainty under dataset shift. Advances in Neural Information Processing Systems (NeurIPS).", "Petersen, R.C. et al. (2010) Alzheimer's Disease Neuroimaging Initiative (ADNI): clinical characterization. Neurology, 74(3), 201–209.", "Rabanser, S., Günnemann, S. and Lipton, Z.C. (2019) Failing loudly: an empirical study of methods for detecting dataset shift. Advances in Neural Information Processing Systems (NeurIPS).", "Sun, B. and Saenko, K. (2016) Deep CORAL: correlation alignment for deep domain adaptation. ECCV Workshops.", "Tibshirani, R.J., Barber, R.F., Candès, E.J. and Ramdas, A. (2019) Conformal prediction under covariate shift. Advances in Neural Information Processing Systems (NeurIPS).", "Vovk, V., Gammerman, A. and Shafer, G. (2005) Algorithmic Learning in a Random World. Springer.", "Zech, J.R. et al. (2018) Variable generalization performance of a deep learning model to detect pneumonia in chest radiographs: a cross-sectional study. PLOS Medicine, 15(11), e1002683.", "Zhang, H., Cisse, M.,

function propHtml(pr){
  return `<div class="sheet ltr" id="propSheet" dir="ltr" style="text-align:left;line-height:1.6">`+pr.blocks.map(b=>b.t==="title"?`<h2 style="text-align:center">${esc(b.x)}</h2>`:b.t==="h"?`<h4 style="margin:14px 0 2px;border-bottom:1px solid #ccc">${esc(b.x)}</h4>`:b.t==="p"?`<p style="margin:4px 0;text-align:justify">${esc(b.x)}</p>`:b.t==="ul"?`<ul style="margin:2px 0">${b.x.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:b.t==="note"?`<p class="meta" style="color:var(--bad)"><i>${esc(b.x)}</i></p>`:b.t==="table"?`<table style="width:100%;border:1px solid #bbb;margin:6px 0"><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td style="text-align:left">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`:"").join("")+`</div>`;
}
async function buildPropDocx(pr){
  const run=(t,{b=false,i=false,sz=22}={})=>`<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${b?"<w:b/>":""}${i?"<w:i/>":""}<w:sz w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${WX(t)}</w:t></w:r>`;
  const par=(inner,{jc="left",after=100,ind=0,bb=false}={})=>`<w:p><w:pPr>${bb?'<w:keepNext/><w:pBdr><w:bottom w:val="single" w:sz="4" w:space="1" w:color="999999"/></w:pBdr>':""}<w:spacing w:before="${bb?240:0}" w:after="${after}" w:line="288" w:lineRule="auto"/>${ind?`<w:ind w:left="${ind}" w:hanging="260"/>`:""}<w:jc w:val="${jc}"/></w:pPr>${inner}</w:p>`;
  const cell=(w,inner,hd)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${hd?'<w:shd w:val="clear" w:color="auto" w:fill="E8E8E8"/>':""}</w:tcPr>${inner}</w:tc>`;
  const bd=t=>`<w:${t} w:val="single" w:sz="4" w:space="0" w:color="999999"/>`;
  const nc=n=>{ const t=9038, w=n===2?[Math.round(t*0.45),t-Math.round(t*0.45)]:Array(n).fill(Math.floor(t/n)); w[n-1]+=t-w.reduce((a,b)=>a+b,0); return w; };
  const out=pr.blocks.map(b=>b.t==="title"?par(run(b.x,{b:true,sz:32}),{jc:"center",after:200}):b.t==="h"?par(run(b.x,{b:true,sz:26}),{bb:true,after:100}):b.t==="p"?par(run(b.x),{jc:"both"}):b.t==="ul"?b.x.map(i=>par(run("• "+i),{ind:360,after:60})).join(""):b.t==="note"?par(run(b.x,{i:true,sz:18})):b.t==="table"?
    `<w:tbl><w:tblPr><w:tblW w:w="9038" w:type="dxa"/><w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(bd).join("")}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${nc(b.head.length).map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid><w:tr>${b.head.map((h,i)=>cell(nc(b.head.length)[i],par(run(h,{b:true,sz:20}),{after:30}),1)).join("")}</w:tr>${b.rows.map(r=>`<w:tr>${r.map((c,i)=>cell(nc(b.head.length)[i],par(run(c,{sz:20}),{after:30}))).join("")}</w:tr>`).join("")}</w:tbl>`+par("",{after:60}):"").join("");
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${out}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1418" w:bottom="1418" w:left="1418" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="22"/><w:lang w:val="en-US"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels=items=>`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${items.map(([id,t,tg])=>`<Relationship Id="${id}" Type="${RELNS}/${t}" Target="${tg}"/>`).join("")}</Relationships>`;
  return zipStore([{name:"[Content_Types].xml",data:ct},{name:"_rels/.rels",data:rels([["rId1","officeDocument","word/document.xml"]])},{name:"word/document.xml",data:doc},{name:"word/styles.xml",data:styles},{name:"word/_rels/document.xml.rels",data:rels([["rIdSty","styles","styles.xml"]])}]);
}
async function downloadProp(id){
  const pr=SCH_PROP[id]; if(!pr) return;
  if(!S.downloads){ toast("دریافت فایل فقط داخل claude.ai فعال است."); return; }
  try{ await S.downloads.save({filename:`${id}-phd-proposal-sohrabi.docx`,data:new Blob([await buildPropDocx(pr)],{type:ABS_DOCX})}); }
  catch(err){ if(!err||err.code!=="declined"){ toast("ساخت یا دریافت فایل Word پروپوزال انجام نشد."); console.error(err); } }
}

// ---- template helpers: fill a letterhead that already contains a sample letter ("جناب آقای / سرکار خانم...", "موضوع: ...", "...") and number/date/attachment fields in its header
const plainText = x => (x.match(/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,"")).join("");
function topSegments(inner){ // split WordprocessingML into top-level paragraphs and "other" chunks (tables, bookmarks...), keeping nested text-box paragraphs inside their parent
  const out=[], re=/<w:p(?=[ >\/])|<\/w:p>/g; let depth=0, start=0, last=0, m;
  while((m=re.exec(inner))){
    if(m[0]==="</w:p>"){ depth--; if(depth===0){ const end=m.index+6; out.push({p:true,xml:inner.slice(start,end)}); last=end; } }
    else { if(depth===0){ if(m.index>last) out.push({p:false,xml:inner.slice(last,m.index)}); start=m.index; } depth++; }
  }
  if(last<inner.length) out.push({p:false,xml:inner.slice(last)});
  return out;
}
const paraPPr = x => (x.match(/<w:pPr>[\s\S]*?<\/w:pPr>/)||[""])[0];
const firstTextRun = x => { const runs=x.match(/<w:r(?:\s[^>]*)?>(?:(?!<\/w:r>)[\s\S])*<\/w:r>/g)||[]; return runs.find(r=>/<w:t[\s>]/.test(r)&&plainText(r).trim())||runs.find(r=>/<w:t[\s>]/.test(r))||""; };
// a clean copy of an anchor paragraph (same paragraph + run formatting, no ids) carrying other text
const withText = (anchor, text) => { const run=firstTextRun(anchor), rpr=(run.match(/<w:rPr>[\s\S]*?<\/w:rPr>/)||[""])[0]; return `<w:p>${paraPPr(anchor)}<w:r>${rpr}<w:t xml:space="preserve">${WX(text)}</w:t></w:r></w:p>`; };
const emptyLike = anchor => `<w:p>${paraPPr(anchor)}</w:p>`;
// number / date / attachments written as plain text labels in a header or footer ("شماره: 14050714001")
function fillHeaderMeta(xml, vals){
  let n=0;
  const out=xml.replace(/<w:p(?=[ >])(?:(?!<w:p[ >])[\s\S])*?<\/w:p>/g, p=>{
    const t=plainText(p).trim(); const lab=/^(شماره|تاریخ|پیوست)\s*:(\s?)/.exec(t); if(!lab) return p;
    const key={"شماره":"number","تاریخ":"date","پیوست":"attachments"}[lab[1]];
    if(vals[key]==null) return p;                                  // field not to be touched
    const run=firstTextRun(p); if(!run) return p;                  // the label and the value may be split over several runs: rewrite the whole line in the first run's formatting
    const rpr=(run.match(/<w:rPr>[\s\S]*?<\/w:rPr>/)||[""])[0];
    n++;
    return p.match(/^<w:p[^>]*>/)[0]+paraPPr(p)+`<w:r>${rpr}<w:t xml:space="preserve">${lab[1]}:${lab[2]}${WX(vals[key])}</w:t></w:r></w:p>`;
  });

}
function smartBody(doc, sm, L, P){ // null when the template has no recognisable sample letter
  const open=doc.match(/<w:body[^>]*>/); if(!open) return null;
  const from=open.index+open[0].length, to=sm?sm.index:doc.lastIndexOf("</w:body>");
  const segs=topSegments(doc.slice(from,to)), txt=i=>plainText(segs[i].xml).replace(/‌/g,"").trim();
  const find=(pred,s0=0)=>{ for(let i=s0;i<segs.length;i++) if(segs[i].p&&pred(txt(i))) return i; return -1; };
  const iRec=find(t=>/^(?:جناب|سرکار|آقای|خانم)/.test(t)||/سرکار\s*خانم/.test(t));
  const iSub=iRec<0?-1:find(t=>/^موضوع\s*:/.test(t),iRec+1);
  const iBody=iSub<0?-1:find(t=>/^[.…]{1,6}$/.test(t),iSub+1);
  const iClose=iBody<0?-1:find(t=>t.replace(/[.…\s]/g,"").length>3,iBody+1);
  if(iClose<0) return null;
  const out=[];
  for(let i=0;i<iRec;i++) out.push(segs[i].xml);
  String(L.recipient||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>out.push(withText(segs[iRec].xml,line)));
  // subject: the run that holds "..." gets the subject text, the "موضوع:" label stays
  out.push("<w:p>"+paraPPr(segs[iSub].xml)+(segs[iSub].xml.match(/<w:r(?:\s[^>]*)?>(?:(?!<\/w:r>)[\s\S])*<\/w:r>/g)||[]).map(r=>/^[.…]+$/.test(plainText(r).trim())?r.replace(/<w:t(?:\s[^>]*)?>[^<]*<\/w:t>/,`<w:t xml:space="preserve">${WX(P.subject)}</w:t>`):r).join("")+"</w:p>");
  for(let i=iSub+1;i<iBody;i++) out.push(segs[i].xml);                 // the template's own greeting stays
  const lines=P.hello&&P.bodyLines[0]&&P.bodyLines[0].length<=80?P.bodyLines.slice(1):P.bodyLines;   // a greeting typed in the letter would repeat it
  lines.forEach(line=>out.push(withText(segs[iBody].xml,line)));
  out.push(emptyLike(segs[iBody].xml));
  for(let i=iClose;i<segs.length;i++) out.push(segs[i].xml);            // closing sentence, "با تجدید احترام", signer, signature and stamp stay as designed
  return out.join("");
}

// The company's own Word letterhead (.docx/.dotx entries from unzip): keep its header, footer, margins and styles, put the letter inside it.
// {{number}} {{date}} {{attachments}} {{subject}} typed in the template are filled in; {{body}} marks where the text goes.
async function fillLetterTemplate(entries, L, C, sig){
  WD.ltr=false; WD.font=false;
  try{
    const P=prepLetter(L), dec=new TextDecoder(), enc=new TextEncoder();
    const get=n=>entries.find(e=>e.name===n), txt=n=>{const e=get(n);return e?dec.decode(e.data):null};
    const set=(n,s)=>{const e=get(n); const d=enc.encode(s); if(e) e.data=d; else entries.push({name:n,data:d})};
    if(!get("word/document.xml")) throw new Error("template has no word/document.xml");
    const att=cleanAtt(L.attachments);   // the header box is narrow: a long attachment title goes on the attachment page, the box only says that there is one
    const vals={number:WLTR(L.number),date:L.dateNum||L.dateFa,attachments:att&&att.length<=18?att:(att||P.annexLines.length?"دارد":"ندارد"),subject:P.subject};
    const TOK=/\{\{(number|date|attachments|subject)\}\}/g;
    let tokensIn=false, doc=txt("word/document.xml");
    for(const e of entries){ if(/^word\/(header|footer)\d*\.xml$/.test(e.name)){ const x=dec.decode(e.data); if(TOK.test(x)){ tokensIn=true; TOK.lastIndex=0; set(e.name,x.replace(TOK,(m,k)=>WX(vals[k]))); } TOK.lastIndex=0; } }
    const docTokens=TOK.test(doc); TOK.lastIndex=0;
    if(docTokens){ tokensIn=true; doc=doc.replace(TOK,(m,k)=>WX(vals[k])); }
    for(const e of entries){ if(/^word\/(header|footer)\d*\.xml$/.test(e.name)){ const r=fillHeaderMeta(dec.decode(e.data),vals); if(r.n){ tokensIn=true; set(e.name,r.xml); } } }   // "شماره: …" / "تاریخ: …" / "پیوست: …" written as plain labels
    const sigRef="rIdPptSig";
    const sm=doc.match(/(<w:sectPr(?:(?!<w:sectPr)[\s\S])*<\/w:sectPr>)\s*<\/w:body>/);
    const sect=sm?sm[1]:'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2268" w:right="1134" w:bottom="1418" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr>';
    const bi=doc.indexOf("{{body}}"), open=doc.match(/<w:body[^>]*>/); if(!open) throw new Error("template has no body");

    if(inner!==null){   // the template carries its own sample letter: keep its design, signature and stamp, fill the blanks
      usedSmart=true;
      const tail=(L.cc?wPara(wRun("رونوشت: "+L.cc,{sz:20,color:"444444"}),{before:240,line:300}):"")+annexXml(L,P);
      doc=doc.slice(0,open.index+open[0].length)+inner+tail+(sm?doc.slice(sm.index):sect+"</w:body></w:document>");
    } else {
      const bodyXml=letterBodyXml(L,C,P,sigRef,sig,!tokensIn);
      if(bi>=0){
        const ps=Math.max(doc.lastIndexOf("<w:p>",bi),doc.lastIndexOf("<w:p ",bi)), pe=doc.indexOf("</w:p>",bi)+6;
        doc=doc.slice(0,ps)+bodyXml+doc.slice(pe);
      } else {
        const head=doc.slice(0,open.index+open[0].length);
        const keep = docTokens ? doc.slice(open.index+open[0].length, sm?sm.index:doc.lastIndexOf("</w:body>")) : "";
        doc=head+keep+bodyXml+sect+"</w:body></w:document>";
      }
    }
    set("word/document.xml",doc);
    if(sig&&!usedSmart){
      let rels=txt("word/_rels/document.xml.rels")||relsXml([]);
      rels=rels.replace("</Relationships>",`<Relationship Id="${sigRef}" Type="${RELNS}/image" Target="media/ppt_sig.png"/></Relationships>`);
      set("word/_rels/document.xml.rels",rels); set("word/media/ppt_sig.png",sig.bytes);
    }
    let ct=txt("[Content_Types].xml")||"";

    if(!/Extension="png"/i.test(ct)) ct=ct.replace("<Types",'<Types').replace(/(<Types[^>]*>)/,'$1<Default Extension="png" ContentType="image/png"/>');
    set("[Content_Types].xml",ct);
    return await zipStore(entries);
  } finally { WD.font=true; }
}
// A finished letter (its own .docx kept as the master): only the number and date in the header change, optionally the recipient's name line.
async function restampDocx(entries, number, dateStr, recipientLine, signerLine, orgLine){
  const dec=new TextDecoder(), enc=new TextEncoder(); let n=0;
  for(const e of entries){
    if(/^word\/(header|footer)\d*\.xml$/.test(e.name)){ const r=fillHeaderMeta(dec.decode(e.data),{number,date:dateStr,attachments:null}); if(r.n){ e.data=enc.encode(r.xml); n+=r.n; } }
  }
  if(recipientLine||signerLine||orgLine){
    const e=entries.find(x=>x.name==="word/document.xml"), doc=dec.decode(e.data), open=doc.match(/<w:body[^>]*>/);
    const sm=doc.match(/(<w:sectPr(?:(?!<w:sectPr)[\s\S])*<\/w:sectPr>)\s*<\/w:body>/);
    if(open&&sm){
      const from=open.index+open[0].length, segs=topSegments(doc.slice(from,sm.index));
      const i=recipientLine?segs.findIndex(g=>g.p&&/^(?:جناب|سرکار)/.test(plainText(g.xml).replace(/\u200c/g,"").trim())):-1;
      if(i>=0) segs[i].xml=withText(segs[i].xml,recipientLine);
      const oi=orgLine?segs.findIndex(g=>g.p&&/^مدیر\s*عامل\s+محترم/.test(plainText(g.xml).replace(/\u200c/g," ").trim())):-1;
      if(oi>=0) segs[oi].xml=withText(segs[oi].xml,orgLine);   // official company name line under the addressee
      const k=signerLine?segs.findIndex(g=>g.p&&!/<w:drawing/.test(g.xml)&&/\S[^\n]*[–-]\s*مدیر\s*عامل\s*$/.test(plainText(g.xml).trim())&&plainText(g.xml).trim().length<60):-1;
      if(k>=0) segs[k].xml=withText(segs[k].xml,signerLine);   // typed name under the sign-off; the signature and stamp pictures stay
      if(i>=0||k>=0||oi>=0) e.data=enc.encode(doc.slice(0,from)+segs.map(g=>g.xml).join("")+doc.slice(sm.index));
    }
  }
  return {bytes:await zipStore(entries), stamped:n};
}

const jalaliParts = d => { const f=new Intl.DateTimeFormat("en-u-ca-persian",{year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date((d||new Date().toISOString().slice(0,10))+"T12:00:00")); const g=t=>String((f.find(p=>p.type===t)||{}).value||"").replace(/\D/g,""); return {y:g("year"),m:g("month").padStart(2,"0"),d:g("day").padStart(2,"0")}; };

async function prepImage(assetId, maxPx){ // asset -> PNG bytes + size, so the Word file never depends on the original format
  try{
    const blob = await (await fetch(assetId==="default"?DEFAULT_LOGO:blobUrl(assetId))).blob();
    const url = URL.createObjectURL(blob);
    const im = await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const k = Math.min(1, maxPx/Math.max(im.naturalWidth||1, im.naturalHeight||1));
    const w=Math.max(1,Math.round(im.naturalWidth*k)), h=Math.max(1,Math.round(im.naturalHeight*k));
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(im,0,0,w,h);
    URL.revokeObjectURL(url);
    const png = await new Promise(ok=>cv.toBlob(ok,"image/png"));
    return {bytes:new Uint8Array(await png.arrayBuffer()), w, h};
  }catch(e){ console.error("image prep failed", e); return null; }
}
const b64ToBytes = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const bytesToB64 = u8 => { let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const letterPacks = {};   // finished letters (their own .docx, kept as base64 inside one JSON asset) are fetched once per page load
async function packDoc(assetId, key){
  if(!letterPacks[assetId]) letterPacks[assetId]=fetch(blobUrl(assetId)).then(r=>{ if(!r.ok) throw new Error("pack "+r.status); return r.json(); }).catch(e=>{ delete letterPacks[assetId]; throw e; });
  const m=await letterPacks[assetId]; if(!m[key]) throw new Error("letter file missing in pack: "+key);
  return b64ToBytes(m[key]);
}

const INTL_DEFAULT = {name:"Parsa International Group",address:"Istanbul, Türkiye",website:"parsaint.group",email:"info@parsaint.group",signatory:"Narges Farahani",title:"AI Sector, Parsa International Group"};
const intlId = () => { const st=S.settings; return {name:st.intl_name||INTL_DEFAULT.name,address:st.intl_address||INTL_DEFAULT.address,website:st.intl_website||INTL_DEFAULT.website,email:st.intl_email||INTL_DEFAULT.email,signatory:st.intl_signatory||INTL_DEFAULT.signatory,title:st.intl_title||INTL_DEFAULT.title}; };

function nextLetterNo(identity,date){
  if(identity==="intl"){ const y=new Date().getFullYear(); const n=S.letters.filter(l=>(l.number||"").startsWith(`PIG-${y}-`)).length+1; return `PIG-${y}-${String(n).padStart(4,"0")}`; }
  // at most LETTER_DAY_CAP letters carry the same day's date; the next one is dated the following day (and the draft's date moves with it)
  const start=date||today(), used=new Set(S.letters.map(l=>String(l.number||"")));
  let day=start;
  for(let g=0; g<120; g++){
    const j=jalaliParts(day), prefix=j.y+j.m+j.d, n=S.letters.filter(l=>String(l.number||"").startsWith(prefix)).length;
    if(n<LETTER_DAY_CAP){
      let s=n+1, num; do{ num=prefix+String(s).padStart(3,"0"); s++; }while(used.has(num));
      if(day!==start&&S.draft&&S.draft.numAuto){ S.draft.date=day; toast("سقف "+faNum(LETTER_DAY_CAP)+" نامه در روز تکمیل است؛ تاریخ نامه به روز بعد منتقل شد."); }
      return num;   // e.g. 14050714001: Jalali year, month, day and a 3-digit serial
    }
    day=addDays(day,1);
  }
}

async function saveLetterhead(file){
  try{
    const n=(file.name||"").toLowerCase();
    if(/\.(docx|dotx)$/.test(n)){
      if(file.size>5*1024*1024){ toast("فایل سربرگ بزرگ است (بیش از ۵ مگابایت)؛ تصاویر داخل آن را کم‌حجم کنید."); return; }
      const bytes=new Uint8Array(await file.arrayBuffer()); const entries=await unzip(bytes);
      if(!entries.some(e=>e.name==="word/document.xml")){ toast("این فایل Word معتبر نیست."); return; }
      const id=await uploadImage(new File([bytesToB64(bytes)],"letterhead.b64.txt",{type:"text/plain"})); if(!id) return;
      await save("settings/letterhead",{kind:"docx",name:file.name,size:file.size,asset:id,updated:new Date().toISOString()},"سربرگ Word ذخیره شد؛ نامه‌ها از این پس داخل آن ساخته می‌شوند.");
    } else if((file.type||"").startsWith("image/")){
      const id=await uploadImage(file); if(!id) return;
      await save("settings/letterhead",{kind:"image",name:file.name,asset:id,top_cm:0,bottom_cm:0,updated:new Date().toISOString()},"سربرگ تصویری ذخیره شد.");
    } else toast("فقط فایل Word (.docx) یا تصویر پذیرفته می‌شود.");
  }catch(err){ console.error(err); toast("بارگذاری سربرگ انجام نشد."); }
}

  const ex=existing?`همچنین محصول «${refProdName(existing)}» را پیش‌تر برای مجموعه‌های مشابه (از جمله ${name}) تعریف و تا سطح نمونه‌ی آزمایشگاهی توسعه داده‌ایم؛ محصول پیشنهادی این نامه مکمل آن است و حوزه‌های دیگر خط تولید، نگهداری و داشبورد مدیریتی را هم پوشش می‌دهد؛ مصرف سوخت و انرژی یکی از محورهای آن است.\n\n`:"";
  const util=slug==="mobin"||slug==="fajr";
  return {
   recipient:`مدیرعامل محترم ${name}\nهلدینگ خلیج فارس`,
   subject:`پیشنهاد محصول هوشمند PetroEnergy برای ${name}: هوشمندسازی خط تولید، داشبورد مدیریتی و کنترل مصرف سوخت و انرژی`,
   body:`با سلام و احترام،

شرکت پترو پالا توس برای مجموعه‌های پتروشیمی هلدینگ خلیج فارس محصولی با نام PetroEnergy تعریف کرده است: هوشمندسازی خط تولید، داشبورد هوشمند مدیریتی و، به‌عنوان یکی از محورهای آن، کنترل و بهینه‌سازی مصرف سوخت و انرژی. نسخه‌ی اختصاصی ${name} تا سطح TRL 4 (اعتبارسنجی آزمایشگاهی) توسعه یافته و مخزن نرم‌افزار آن ساخته شده است.

${ex}۱) آنچه محصول انجام می‌دهد
• هوشمندسازی خط تولید: دوقلوی دیجیتال و حسگر مجازی برای واحدهای کلیدی و توصیه‌ی نقطه‌ی کار به اپراتور
• نگهداری پیش‌بینانه: پایش ارتعاش و دمای تجهیزات دوار (کمپرسور، پمپ، توربین) و هشدار زودهنگام خرابی
• داشبورد هوشمند مدیریتی با شاخص‌های عملکرد، کیفیت، نگهداری و انرژی هر واحد
• کنترل و بهینه‌سازی مصرف سوخت و انرژی (یکی از محورهای محصول):
${util?"• پایش راندمان دیگ‌ها و تقسیم بار با کمترین سوخت، تراز بخار و برق واحد خدمات جانبی":"• پایش راندمان کوره‌ها از روی اکسیژن و دمای دودکش و پیشنهاد نقطه‌ی بهینه‌ی هوای اضافی (بدون عبور از حد ایمن CO)\n• تقسیم بار دیگ‌های بخار با کمترین سوخت و تراز بخار"}
• مصرف ویژه‌ی انرژی به‌ازای هر تن محصول، هشدار نشت هوا و روند رسوب‌گیری
• داشبورد مدیریتی با شاخص‌های انرژی هر واحد برای مدیریت و دفتر انرژی

۲) وضعیت فعلی (شفاف)
نمونه‌ی ما با داده‌ی ساختگی و پارامترهای نمونه ارزیابی شده و داده‌ی واقعی ${name} را ندیده است؛ بنابراین عدد صرفه‌جویی را نمی‌توانیم اعلام کنیم. ارتقا به TRL 5 فقط با داده‌ی واقعی واحد شما و اندازه‌گیری در برابر خط مبنا انجام می‌شود.

۳) تأمین هزینه و بهره‌مندی مالی از صرفه‌جویی
${CERT_PARA}

۴) پیشنهاد همکاری
پایلوت ۸ تا ۱۲ هفته‌ای روی یک یا دو واحد: اتصال فقط‌خواندنی به Historian/DCS، تعیین خط مبنای مصرف، استقرار داشبورد و گزارش اندازه‌گیری‌شده‌ی صرفه‌جویی؛ بدون دخالت در حلقه‌های کنترل (توصیه به اپراتور، نه فرمان خودکار).

در صورت تمایل، جلسه‌ی فنی کوتاهی برای معرفی و بررسی داده‌ی در دسترس هماهنگ شود.

با تشکر`};
}

  if(key.startsWith("ld_")){ const l=S.m.leads.find(x=>"ld_"+x.id===key); return l?`تماس: ${l.name||l.activity}`:key; }
  return key; };
const prob = tr => tr.prob!=null&&tr.prob!==""?Number(tr.prob):(STAGE_PROB[tr.stage||"identified"]||5);
const usd = n => "$"+faNum(Math.round(n||0));

  const total=list.reduce((a,t)=>a+val(t),0), weighted=list.reduce((a,t)=>a+wt(t),0);

       <div class="row" style="margin-top:4px">${i>0?`<button class="btn sm ghost" data-act="pipe-move" data-id="${esc(t.id)}" data-d="-1" title="مرحله‌ی قبل">›</button>`:""}${i<st.length-1?`<button class="btn sm ghost" data-act="pipe-move" data-id="${esc(t.id)}" data-d="1" title="مرحله‌ی بعد">‹</button>`:""}<button class="btn sm ghost" data-act="track" data-id="${esc(t.id)}">ویرایش</button></div></div>`}).join("")||'<p class="meta">—</p>'}</div>`}).join("");
  const cl=S.clients, cst=Object.keys(CLIENT_STAGES);
  return `<p class="note">همه‌ی فرصت‌های در دست پیگیری در یک قیف. ارزش و احتمال برد را از «ویرایش» وارد کنید؛ اگر احتمال خالی باشد، درصد پیش‌فرض هر مرحله به‌کار می‌رود. با ثبت نتیجه‌ی نهایی، مورد از قیف خارج و وارد «Team Memory» می‌شود.</p>`+
  kpis([["فرصت در قیف",faNum(list.length)],["پیشنهاد Go",faNum(go)],["ارزش کل (دلار)",usd(total)],["پیش‌بینی وزنی (دلار)",usd(weighted)],["بدون مسئول",faNum(list.filter(t=>!(S.tracking[t.id]||{}).owner).length),true]])+
  `<div class="kanban">${cols}</div><h3>قراردادهای مشتری (ERP)</h3>`+kpis(cst.map(k=>[CLIENT_STAGES[k],faNum(cl.filter(c=>c.stage===k).length)]))+
  `<p class="meta">ارزش قراردادهای مشتری به ریال در «ERP ← مشتریان و قراردادها» ثبت می‌شود: ${faNum(cl.reduce((a,c)=>a+(Number(c.value)||0),0))} ریال.</p>`;

// ---------- CALENDAR (deadlines, events, follow-ups, tasks, finance, letters)
const CAL_T = {tender:"مهلت مناقصه",event:"رویداد",followup:"اقدام بعدی پروژه",task:"تسک",finance:"سررسید مالی",letter:"پیگیری نامه",meeting:"جلسه"};
const isoOk = d => /^\d{4}-\d{2}-\d{2}/.test(d||"");
const dayDiff = iso => Math.round((Date.parse(iso.slice(0,10)+"T00:00:00Z")-Date.parse(today()+"T00:00:00Z"))/864e5);
function calEntries(){
  const me=S.me.id, out=[];
  S.m.tenders.filter(t=>ACTIVE.has(t.status)).forEach(t=>{ const tr=S.tracking[t.id]||{}; if(tr.outcome) return;
    const d=isoOk(t.deadline)?t.deadline.slice(0,10):(t.days_left!=null?addDays(today(),t.days_left):null);
    if(d) out.push({date:d,type:"tender",title:t.title,url:t.url,owner:tr.owner||"",stop:true});
    if(tr.next_date) out.push({date:tr.next_date,type:"followup",title:`${tr.next_action||"اقدام بعدی"} – ${t.title}`,owner:tr.owner||""}); });
  Object.entries(S.tracking).forEach(([k,tr])=>{ if(!tr.next_date||S.m.tenders.some(t=>t.id===k)||tr.outcome) return; out.push({date:tr.next_date,type:"followup",title:`${tr.next_action||"اقدام بعدی"} – ${trackTitle(k)}`,owner:tr.owner||""}); });
  S.m.events.forEach(e=>{ const tr=S.tracking["ev_"+e.id]||{}; if(isoOk(e.start)&&e.start>=addDays(today(),-1)) out.push({date:e.start.slice(0,10),type:"event",title:e.name_fa||e.name,url:e.url,owner:tr.owner||"",stop:true}); });
  S.tasks.filter(t=>t.due&&!["done","approved"].includes(t.status)).forEach(t=>out.push({date:t.due,type:"task",title:t.title,owner:t.assignee||""}));
  if(isAdmin()) S.finance.filter(f=>f.due&&f.status!=="paid").forEach(f=>out.push({date:f.due,type:"finance",title:`${f.title} – ${faNum(f.amount||0)} ریال`,owner:""}));
  (canSeeLetters()?S.lettersArchive:[]).filter(a=>a.next_date&&a.status!=="closed").forEach(a=>out.push({date:a.next_date,type:"letter",title:`${a.next_action||"پیگیری"} – ${a.subject}`,owner:a.owner||""}));
  (canSeeLetters()?S.letters:[]).filter(l=>l.meeting_mode&&l.meeting_mode!=="none"&&isoOk(l.meeting_date)).forEach(l=>out.push({date:l.meeting_date,type:"meeting",title:`جلسه‌ی پیرو نامه‌ی ${l.number}${l.meeting_time?` – ساعت ${l.meeting_time}`:""}`,owner:l.created_by||"",stop:true}));
  return out.filter(x=>isoOk(x.date)).sort((a,b)=>a.date.localeCompare(b.date));
}
const relDay = d => { const n=dayDiff(d); return n===0?"امروز":n===1?"فردا":n===-1?"دیروز":n<0?`${faNum(-n)} روز پیش`:`${faNum(n)} روز دیگر`; };
VIEWS["bpms.calendar"] = () => {
  const all=calEntries().filter(x=>!S.calMine||x.owner===S.me.id).filter(x=>!S.calTypes||S.calTypes.has(x.type)).filter(x=>match(x.title,CAL_T[x.type]));
  const late=all.filter(x=>!x.stop&&x.date<today()), upcoming=all.filter(x=>x.date>=today()&&x.date<=addDays(today(),60));
  const days=[...new Set(upcoming.map(x=>x.date))];
  const row=x=>`<div class="cal-item"><span class="pill p-info">${esc(CAL_T[x.type])}</span> ${x.url?link(x.url,x.title):esc(x.title)}${x.owner?` <span class="meta">· ${esc(memberName(x.owner))}</span>`:""}</div>`;
  return `<div class="toolbar"><label class="chip"><input type="checkbox" data-cal="mine"${S.calMine?" checked":""}> فقط موارد من</label>
    <select data-cal="type"><option value="">همه‌ی انواع</option>${Object.entries(CAL_T).map(([k,l])=>`<option value="${k}"${S.calTypes&&S.calTypes.has(k)?" selected":""}>${esc(l)}</option>`).join("")}</select>
    ${S.downloads?'<button class="btn ghost" data-act="cal-ics">دریافت فایل تقویم (ICS)</button>':""}<span class="meta">۶۰ روز آینده؛ یادآوری موارد من در زنگ اعلان می‌آید.</span></div>`+
  kpis([["عقب‌افتاده",faNum(late.length),late.length>0],["امروز",faNum(upcoming.filter(x=>x.date===today()).length)],["۷ روز آینده",faNum(upcoming.filter(x=>x.date<=addDays(today(),7)).length)],["۶۰ روز آینده",faNum(upcoming.length)]])+
  (late.length?`<div class="cal-day p-bad">عقب‌افتاده</div>${late.map(x=>`<div class="cal-item"><span class="meta">${faDate(x.date)}</span> ${row(x)}</div>`).join("")}`:"")+
  (days.length?days.map(d=>`<div class="cal-day">${faDate(d)} <span class="meta">· ${relDay(d)}</span></div>${upcoming.filter(x=>x.date===d).map(row).join("")}`).join(""):'<p class="empty">موردی در ۶۰ روز آینده ثبت نشده است.</p>');
};
async function calIcs(){
  if(!S.downloads){ toast("دریافت فایل فقط داخل claude.ai فعال است."); return; }
  const ics=x=>String(x).replace(/[\;,]/g,m=>"\\"+m).replace(/\r?\n/g," ");
  const ev=calEntries().filter(x=>!S.calMine||x.owner===S.me.id).filter(x=>x.date>=addDays(today(),-7));
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Petro Pala Toos//Hub//FA","CALSCALE:GREGORIAN",...ev.flatMap((x,i)=>["BEGIN:VEVENT",`UID:ppt-${i}-${x.date}@hub`,`DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g,"")}`,`DTSTART;VALUE=DATE:${x.date.replace(/-/g,"")}`,`DTEND;VALUE=DATE:${addDays(x.date,1).replace(/-/g,"")}`,`SUMMARY:${ics(CAL_T[x.type]+": "+x.title)}`,"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Reminder","END:VALARM","END:VEVENT"]),"END:VCALENDAR"].join("\r\n");
  try{ await S.downloads.save({filename:"ppt-calendar.ics",data:new Blob([body],{type:"text/calendar"})}); }catch(err){ if(!err||err.code!=="declined") toast("ساخت فایل تقویم انجام نشد."); }
}

/*ABS-START*/const ABS = {"profiles":{"keai":{"label":"Elsevier / KeAi journal","max":250,"min":150,"kw":"4–6","kw_label":"Keywords","rule":"Single unstructured paragraph, no references, no undefined abbreviations; state objective, method, main results and conclusion."},"ieee":{"label":"IEEE conference","max":250,"min":150,"kw":"4–8","kw_label":"Index Terms","rule":"Single paragraph of 150–250 words; no equations, citations or undefined abbreviations; Index Terms in alphabetical order."},"springer":{"label":"Springer / EasyChair conference","max":250,"min":150,"kw":"3–5","kw_label":"Keywords","rule":"Single paragraph of 150–250 words, written for the full-paper track; 3–5 keywords."},"easychair":{"label":"EasyChair conference","max":250,"min":150,"kw":"3–6","kw_label":"Keywords","rule":"Plain-text abstract pasted into the EasyChair form; avoid formatting, special symbols and references."},"mdpi":{"label":"MDPI journal","max":200,"min":150,"kw":"3–10","kw_label":"Keywords","rule":"Single paragraph, about 200 words maximum, no citations; a graphical abstract is optional."},"bentham":{"label":"Bentham Science journal","max":250,"min":150,"kw":"4–6","kw_label":"Keywords","rule":"Single paragraph of up to 250 words, no references; objective, methods, results, conclusion in running text."},"npj":{"label":"Nature Portfolio (npj Digital Medicine)","max":150,"min":100,"kw":"—","kw_label":"Keywords","rule":"Unstructured summary of up to about 150 words, no references, no abbreviations where avoidable; keywords are entered in the submission system."},"frontiers":{"label":"Frontiers Research Topic","max":350,"min":200,"kw":"5–8","kw_label":"Keywords","rule":"Up to 350 words; state the problem, approach, findings and implications; 5–8 keywords."},"poster":{"label":"Conference poster abstract","max":250,"min":120,"kw":"3–5","kw_label":"Keywords","rule":"Short plain-text abstract for the poster track; state the question, approach and what will be shown on the poster."}},"abstracts":{"s_iqim":{"profile":"easychair","product":"hqca","title":"Distribution-Free Uncertainty Intervals for Binding-Affinity Predictions: Global versus Mondrian Conformal Calibration on COX-2","abstract":"Reliable use of machine-learning predictions in drug discovery requires an estimate of how far a predicted binding affinity can be trusted. We add distribution-free uncertainty intervals to the affinity predictions of a hybrid quantum–classical drug-discovery platform, treating the platform's predictor as a black box. Split conformal prediction gives intervals with a guaranteed marginal coverage, and a Mondrian variant calibrates separately within strata of molecules to approach coverage that also holds inside each stratum. We evaluate both on 4,392 COX-2 molecules with measured activity from ChEMBL, using random calibration and test splits. For a nominal coverage of 0.90 the empirical coverage was between 0.88 and 0.90, and the Mondrian variant improved stratum-level coverage only marginally compared with global calibration. We report this as a negative result: stratified calibration did not change the practical reliability of the intervals on this target. A second target (for example EGFR), at least ten random seeds and confidence intervals for the coverage are [to be measured]. The study gives a reproducible baseline for uncertainty reporting in affinity prediction and a template for checking whether stratification is worth its added complexity.","keywords":["conformal prediction","binding affinity","uncertainty quantification","drug discovery","ChEMBL"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured."},"s_eg":{"profile":"keai","product":"stratguard","title":"Certified Facies Sets from Well Logs: Conformal Coverage, Per-Well Reliability and Stratigraphic Decoding on the SEG 2016 Hugoton Data","abstract":"Machine-learning facies interpretation from well logs rarely states how uncertain each depth is. We present StratGuard, a framework that returns, for every depth, a calibrated set of admissible facies using split conformal prediction, decodes the facies sequence with a stratigraphic transition grammar, and refers depths with large sets to a geologist. We evaluated it on nine Kansas wells of the SEG 2016 Hugoton data set with well-level splits. Average empirical coverage reached the 0.90 target, but coverage in the worst well was only 0.75, which shows that a marginal guarantee does not hold well by well. Constrained decoding improved accuracy by only about one percentage point compared with the base classifier. The effect of a referral policy that is stricter near reservoir boundaries, per-class coverage and additional wells (for example FORCE 2020, after a licence check) are [to be measured]. The results are modest and are reported as they are: certified sets make the uncertainty of facies interpretation explicit and auditable, but coverage varies strongly between wells, so per-well calibration or more wells are needed before the sets are used in subsurface decisions.","keywords":["facies interpretation","well logs","conformal prediction","uncertainty quantification","subsurface engineering"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured."},"s_qip":{"profile":"poster","product":"qshot","title":"Shot-Budget Allocation for Pauli-Sum Observables: A Simulation Study of Weighted Allocation and Classical Shadows","abstract":"Estimating the expectation value of a Hamiltonian on a quantum computer requires many repeated measurements, and the way a fixed budget of shots is divided among the Pauli terms determines the accuracy of the estimate. We compare uniform allocation, allocation weighted by coefficient magnitude and classical shadows for Pauli-sum observables of small molecular Hamiltonians, using simulation at equal total shot budget and reporting root-mean-square error and bias against the exact value. The Hamiltonians are computed in the STO-3G basis and not measured on a device, because no public hardware measurement data set was found. In simulation, weighted allocation and classical shadows gave about 11–12% lower RMSE than uniform allocation. Confidence intervals, further molecules (for example BeH2 with a sparse method) and the grouping of commuting terms are [to be measured]. The poster will show the protocol, the comparison and the limits of a simulation-only study, and we make no claim about performance on hardware.","keywords":["shot budget","Pauli observables","classical shadows","measurement allocation","quantum simulation"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured."},"s_icmhi":{"profile":"easychair","product":"ipind","title":"Applicability Domain of Lipid-Nanoparticle Property Models: Conformal Coverage under Chemical-Series Shift","abstract":"Machine-learning models for the design of lipid nanoparticles are trained on libraries of related lipids and then used on new chemical series, where their error estimates may no longer hold. We study the applicability domain of a property-prediction model for ionisable lipids and test whether conformal prediction intervals stay valid when the test lipids belong to a chemical series that was not seen in training. Using the public LANTERN/AGILE data of about 1,100 lipids, we compare random splits with series-level splits. Under series-level shift the empirical coverage of the intervals was 0.72 against a nominal 0.90, a clear warning that random-split evaluation overstates reliability. Series-aware cross-conformal calibration, a second regressor (a graph model or a pretrained chemistry model), a second lipid data set and repeated seeds are [to be measured]. We conclude that uncertainty claims for delivery-system design models should be tested under chemical-series shift, and we provide a reproducible protocol for doing so, relevant to medical and health informatics applications of AI-designed delivery systems.","keywords":["lipid nanoparticles","applicability domain","conformal prediction","distribution shift","health informatics"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. Topic fit with a medical-informatics venue should be checked."},"s_isie":{"profile":"ieee","product":"apexasset","title":"Uncertainty-Aware Remaining-Useful-Life Prediction as an Add-On to an Asset Life-Cycle Digital Twin","abstract":"Digital twins of industrial assets use remaining useful life (RUL) predictions to plan maintenance, but a single predicted value hides how reliable it is. This paper studies uncertainty-aware RUL prediction as an add-on to an asset life-cycle digital twin. The add-on is separate from the twin itself: it takes the RUL estimate of the twin and returns an interval with a calibrated coverage, so that maintenance can be planned on a conservative bound. We plan to evaluate it on a public run-to-failure data set other than C-MAPSS, for example the NASA IMS bearing data or the NASA battery data, chosen after a check of size and licence, and to compare it with simple baselines such as a constant-life prediction and a regression on time. The fractions of late and early warnings, the interval coverage and its confidence intervals, and the cost of the added conservatism are [to be measured]. No result is claimed in this abstract, and the final version will report any negative result as such. The method is designed for implementation on industrial edge hardware.","keywords":["digital twin","remaining useful life","predictive maintenance","uncertainty","condition monitoring"],"draft_note":"Development of this product for the venue is still open in the page task list, so no result exists yet; the abstract must be rewritten after the experiments."},"s_hydro":{"profile":"mdpi","product":"hydrogate","title":"Does Hydrograph-State Gating Improve Seven-Day Streamflow Forecasts? A Negative-Result Benchmark on Five USGS Rivers","abstract":"Streamflow behaves differently on rising, receding and stable limbs of the hydrograph, and separate models for each state are often proposed. This study tests whether such state gating improves seven-day-ahead forecasts. For five USGS rivers (2000–2024), a global gradient-boosting model with lagged and seasonal features is compared with persistence and with a hard-gated model that selects a state-specific model from the hydrograph state of the current day, using chronological splits, RMSE and Nash–Sutcliffe efficiency. The global model outperformed persistence. The gated model was worse than the global model at all five stations. We report this as a negative result: gating divides the training data into smaller samples and adds no information beyond the lagged and seasonal features. Precipitation and snow forcing (for example from NLDAS or CAMELS-US), a deep-learning learner, the separation of dam-regulated gauges and rolling-origin evaluation with confidence intervals are [to be measured]. The benchmark and code are provided so that others can test gating in other basins.","keywords":["streamflow forecasting","hydrograph state","gradient boosting","benchmark","negative result"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured."},"s_iai":{"profile":"springer","product":"fidps","title":"Log Zonation by Change-Point Segmentation for Drilling and Completion Data: A Neutral Result on Eight SEG 2016 Wells","abstract":"Industrial AI for drilling and completion depends on dividing continuous log data into zones before further analysis, and change-point segmentation is a natural candidate. This paper evaluates a log-zonation module that was added next to a formation-integrity damage prevention system and is independent of its claimed functions. We tested it on the well logs of eight Kansas wells of the SEG 2016 data set, comparing change-point segmentation with a simple gradient-based baseline using an F1 score for zone boundaries. The change-point method did not outperform the baseline: the F1 score was 0.55 against 0.62. No real formation-damage data were available, so no claim is made about damage prediction. We report this neutral result because it shows that, on public wells, a simple baseline is hard to beat for this task. Real drilling or damage data (for example the Volve data after a licence check), a redefinition of the contribution towards formation integrity and a comparison on more wells are [to be measured].","keywords":["log zonation","change-point detection","well logs","drilling data","industrial AI"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. The owner's task list also asks for the full claim documents (7533, 9411, 9412) to be read by a patent attorney before submission."},"s_iqicsa":{"profile":"easychair","product":"qgridpart","title":"QAOA for Splitting a Power Network into Two Islands: A Comparison with Greedy and Spectral Partitioning on the IEEE 14-Bus Case","abstract":"Splitting a power network into two islands can be written as a weighted MaxCut problem on the network graph, and it has been proposed as an application of the quantum approximate optimisation algorithm (QAOA). We compare QAOA, simulated exactly with state vectors, with greedy local search and spectral bisection on the IEEE 14-bus topology (MATPOWER), reporting the approximation ratio against the best known cut together with the quantum resources used. For circuit depths p = 1, 2 and 3 QAOA reached ratios of 0.817, 0.870 and 0.904, but it did not outperform greedy search (0.985) or spectral bisection (0.949). We report this as a neutral result at this network size: the quantum method does not improve on cheap classical baselines. Larger networks (30 and 57 buses) with matrix-product-state or classical-only simulation, a noise model, depths up to p = 5, a balanced min-cut objective with a generation–load constraint and hardware data are [to be measured]. The framework is provided as a transparent benchmark for power-system applications of quantum optimisation.","keywords":["QAOA","power system islanding","MaxCut","IEEE 14-bus","quantum optimisation"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured."},"s_mimar":{"profile":"springer","product":"gas_turbine","title":"Monitoring Drift in Predictive Emission Models of Gas Turbines with Adaptive Conformal Intervals","abstract":"Predictive emission monitoring systems (PEMS) estimate gas-turbine emissions from process variables, but their error grows when the operating conditions drift. This paper studies conformal prediction intervals for the prediction of nitrogen oxides (NOx) under drift, as a monitoring add-on to a digital twin of a gas turbine. We use the public UCI gas-turbine data set (36,733 records, 2011–2015) and compare a conformal interval calibrated once with an adaptive conformal inference (ACI) scheme that updates its level online. With the fixed calibration the empirical coverage of the NOx interval fell to 0.32 as the data drifted, while ACI stayed at the nominal 0.90 level at the cost of intervals about twice as wide. The use of a small share (1–5%) of reference labels, a sweep of the ACI step size, a physics-based baseline and a second PEMS data set are [to be measured]. The results show that fixed conformal calibration should not be used for emission monitoring under drift and that the width of the adaptive interval is the price of keeping its coverage.","keywords":["predictive emission monitoring","conformal prediction","concept drift","gas turbine","digital twin"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. Only claim 8421 was read for this product; other digital-twin filings must be checked by the patent attorney."},"s_aimh":{"profile":"easychair","product":"lnp","title":"Stereochemistry-Aware Representations for Predicting Lipid-Nanoparticle Transfection: A Preliminary Study on Cis/Trans Lipids","abstract":"The transfection efficiency of lipid nanoparticles depends on the molecular structure of the ionisable lipid, including its cis/trans stereochemistry, which many molecular representations ignore. This preliminary study tests whether a stereo-sensitive representation improves the prediction of transfection. We use the public LANTERN data: the AGILE set of about 1,100 lipids and the CisTrans set of 200 lipids. Compared with a representation that is blind to stereochemistry, the stereo-sensitive one reduced the RMSE from 2.24 to 1.83 and raised the Spearman correlation from 0.50 to 0.58. The result comes from a single random seed and the data contain no matched isomer pairs, so it cannot separate the effect of stereochemistry from other differences between lipids. At least ten seeds with confidence intervals, a graph-based model, matched isomer pairs from a new source and a comparison with the filed claims are [to be measured]. The study indicates that stereochemistry deserves explicit treatment in AI for gene-delivery design, in the context of AI in medicine and healthcare.","keywords":["lipid nanoparticles","stereochemistry","gene delivery","molecular representation","AI in medicine"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. Only part of the claims was compared (claim 3426)."},"s_quantics":{"profile":"easychair","product":"qrngaudit","title":"QRNG-Audit: Statistical Health Audit of Quantum Random Bits from Nine IBM Quantum Computers","abstract":"Quantum random number generators are used in communication and security systems, and their output must be checked because a faulty device can produce biased or correlated bits. Applying a battery of statistical tests to many bit strings and flagging any string with a small p-value causes many false alarms at device level. We present QRNG-Audit, which runs five basic statistical tests per bit string, tests the uniformity of the p-values per device and circuit, and applies Benjamini–Hochberg correction at a target false discovery rate. We applied it to raw output from nine IBM quantum computers (Zenodo record 10542216, CC BY 4.0). Ideal control sources raised no alarm, and pseudo-random generators with a bias of 1% to 9% were detected. Of 28 device and circuit combinations, 23 were flagged, mostly because of slightly more zeros than ones. This confirms earlier findings on IBM devices (arXiv 2401.12250), and we do not claim novelty over them. The full NIST SP 800-90B estimator set, a power curve against bias, fresh data from an IBM account and an explicit comparison with the earlier work are [to be measured].","keywords":["quantum random number generator","statistical testing","false discovery rate","IBM Quantum","randomness audit"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured."},"s_jimg":{"profile":"mdpi","product":"pgx","title":"Population Equity of Pharmacogenomic Panels: How Many Actionable CPIC Alleles Does a European-Designed Panel Miss?","abstract":"Pharmacogenomic panels are usually designed with allele frequencies measured in European populations, and their value for other populations is rarely quantified. Using the CPIC guideline data for nine genes and nine population groups, we compute the share of actionable (abnormal-function) alleles that a panel designed from European frequencies would not capture. Such a panel misses about 49% of the abnormal alleles in sub-Saharan African populations and about 47% in East Asian populations, against 19% in Europeans. The analysis uses published frequencies and no individual-level data. Verification against the 1000 Genomes data, the gene CYP2D6 with its structural variants, sampling-based confidence intervals and a group close to the Iranian population are [to be measured]. The result shows that panel design needs population-specific frequency data to avoid unequal clinical benefit. The topic is genomic rather than imaging, and its fit with this special issue must be confirmed with the editors before submission.","keywords":["pharmacogenomics","CPIC","population equity","allele frequency","clinical decision support"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. The owner's task list warns that the topic does not match Journal of Imaging; a better journal should be proposed. The adjacent claim 2 of filing 3428 must be reviewed by the attorney."},"s_icqe":{"profile":"easychair","product":"stretchwatch","title":"StretchWatch: Loss of the Hartree–Fock Reference along Bond-Stretching Curves, with Relevance to Quantum Energy Materials","abstract":"Quantum algorithms for energy materials, such as battery and fuel molecules, often start from the Hartree–Fock (HF) state, but HF becomes a poor approximation of the ground state when bonds are stretched. We quantify this for small molecules in the STO-3G basis, using computed (not measured) Hamiltonians, and combine the overlap of the HF state with the ground state and the entropy of the natural-orbital occupations into a starting-point quality index. For LiH the squared overlap falls from 0.98 near the equilibrium geometry to 0.008 at a bond length of 8 Å, and H2 is checked against the literature energy of −1.1373 Ha. The novelty of the study is low and no patentable claim is made. BeH2 and H2O with an active space, the 6-31G basis, validation against CCSD reference values from PySCF and a motivating link to energy materials with references are [to be measured]. The study offers a simple, reproducible check of when an HF start is unsuitable and a basis for a later comparison with alternative reference states in quantum-energy applications.","keywords":["Hartree–Fock","VQE","bond stretching","quantum energy","natural-orbital entropy"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. The 0.98→0.008 overlap values are the owner's recorded numbers; check them against the repository."},"s_cmi":{"profile":"bentham","product":"explainguard","title":"ExplainGuard: Faithfulness Testing of Saliency Maps on Chest X-Rays, and Why Gradient Explanations Can Be Worse than Random","abstract":"Saliency maps are widely shown next to medical image predictions, yet they are rarely tested for whether they reflect what a model uses. This study presents ExplainGuard, a framework that measures explanation faithfulness with perturbation tests and compares explanation methods with a random map. We applied it to PneumoniaMNIST chest X-ray images at 64×64 pixels (Zenodo). Gradient and gradient×input maps were less faithful than a random map, with a confidence interval that excludes zero, whereas occlusion was more faithful and more stable. The advantage of occlusion is partly structural because its perturbation is of the same kind as the faithfulness metric. No foundation model was evaluated, although this is the topic of the special issue. A pretrained medical encoder (weights and a GPU are needed), a real localisation reference such as RSNA bounding boxes, more seeds and a weight-randomisation check are [to be measured]. The results suggest that faithfulness testing should precede the clinical display of saliency maps.","keywords":["explainable AI","faithfulness","saliency maps","chest X-ray","model validation"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. No foundation model was evaluated, which is the topic of the special issue."},"s_front_nuc":{"profile":"frontiers","product":"nuclear","title":"Open-Set Identification of Nuclear Plant Accidents: How Reliably Are Unknown Accident Types Detected in Simulator Data?","abstract":"Machine-learning classifiers for accident identification in nuclear power plants are trained on a fixed list of accident types, but an operator must also be warned when an accident of an unknown type occurs. This study evaluates open-set identification on the NPPAD data set, which comes from PCTRAN simulation (246 runs, 18 accident types) and not from a real plant. We measure the false rejection of known accidents and the detection of accident types that were held out of training. The false rejection of known accidents was about 0.10. The detection of unknown types depended strongly on the type and was on average between 27% and 49%. Open-set methods of this kind have been published before, and we claim no novelty in method. The full set of 1,217 NPPAD runs, the alignment of the analysis window with the accident onset, OpenMax and prototype-based CNN variants, and a comparison with the filed claims are [to be measured]. All results come from simulation and not from plant records, so they should be read as an upper bound on field performance. The results show that a simulator-trained classifier cannot yet be relied upon to flag unknown accidents, and the paper discusses the verification and validation needed before any use in an operating plant, where such a system would only support licensed operators.","keywords":["nuclear power plant","accident identification","open-set recognition","machine learning","simulator data"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. Claims 1654 and 1782 are adjacent; the attorney must review."},"s_jpse":{"profile":"keai","product":"terminals","title":"Conformal Forecast Intervals for Crude-Oil Inventories: Weekly US Data as a Proxy for Terminal-Level Monitoring","abstract":"Operators of storage terminals need forecasts of inventory with a stated uncertainty, but terminal-level tank data are rarely public. As a proxy we use the weekly US crude-oil inventories of the EIA (1982–2026, 2,299 weeks) and test a ridge-regression forecast with conformal prediction intervals at horizons of one to four weeks. The ridge model reduced the error by 5% to 11% compared with persistence, and the conformal intervals achieved a coverage between 0.86 and 0.91 for a nominal 0.90. The data are national inventories and not tank levels, and the journal is about pipelines, so the fit of the study with the journal is weak. Real tank-level data from the owner, exogenous drivers such as refinery runs and imports, a comparison with consensus forecasts and the identification of the filed claims of the product are [to be measured]. The study shows that simple interval forecasts are feasible for inventory monitoring and sets a baseline for terminal-level data.","keywords":["inventory forecasting","conformal prediction","storage terminals","crude oil","uncertainty"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. Weak fit with the journal; the owner's task list asks for a better journal to be proposed. No claim document for the product was found."},"s_mie":{"profile":"easychair","product":"readmitcal","title":"ReadmitCal: Are 30-Day Readmission Models for Patients with Diabetes Already Calibrated? A Negative Result on 69,990 Patients","abstract":"Hospital readmission risk models are used to allocate follow-up resources, and calibration of their probabilities is often recommended. We test whether post-hoc recalibration, overall and within subgroups, improves 30-day readmission models for patients with diabetes. Using the UCI Diabetes 130-US hospitals data (69,990 patients) with patient-level splits, we trained standard classifiers and compared Platt scaling, isotonic regression, temperature scaling and the same methods fitted per subgroup. The models were already well calibrated before any correction, with an expected calibration error of about 0.007, and neither recalibration nor subgroup recalibration helped. Discrimination was modest, with an AUROC of only 0.645. We report this as a negative result: for this data set calibration is not the limiting problem and discrimination is. Temporal validation, confidence intervals over several splits and a comparison with published fairness audits are [to be measured]. The study indicates that calibration auditing should check first whether a model is already calibrated and gives a reproducible benchmark for health informatics.","keywords":["hospital readmission","calibration","diabetes","negative result","medical informatics"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured."},"s_npj":{"profile":"npj","product":"wearshift","title":"Random Splits Overstate Wearable Activity Recognition: Per-Subject Accuracy on UCI HAR","abstract":"Reported accuracy of wearable activity recognition depends on how the data are split. Using the UCI HAR data of 30 subjects, we compare random window splits with subject-level splits. Random splitting overstated accuracy by 3 to 5 percentage points, and some subjects reached only 72% to 79% accuracy. Conformal prediction intervals kept coverage above 0.9 in both settings, so no leakage effect on coverage was seen. The study is small and its fit with this journal is doubtful. Several seeds with confidence intervals, deep models and harder free-living or clinical data are [to be measured]. We recommend subject-level evaluation and per-subject reporting for digital-health claims based on wearable sensors.","keywords":["wearable sensors","activity recognition","evaluation protocol","data leakage","digital health"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. The owner's task list marks the fit with npj Digital Medicine as doubtful; step 0 is to assess the fit or choose a better journal."},"s_pet":{"profile":"keai","product":"ilift","title":"Conformal Alarm Thresholds for Oil-Well Fault Detection on Real Petrobras 3W Data: Detection Rate versus Warning Time","abstract":"Fault detection in oil wells must keep false alarms low while warning early enough to act. We study conformal alarm thresholds as an add-on to an artificial-lift management system, using the public Petrobras 3W data (82 normal and 32 real fault instances). The conformal threshold kept the false-alarm rate at 0.12 for a target of 0.10. Faults were detected in 75% to 100% of the instances, depending on the fault type, but a warning before the start of the event was given in only 25% to 47% of them. The study therefore shows that a controlled false-alarm rate is attainable on real well data, while early warning remains the limiting factor. More 3W instances, a comparison with Isolation Forest and CUSUM, ROC and delay curves, and the identification of the product's filed claims (claim 1566 on drilling anomaly detection is adjacent) are [to be measured]. Conformal alarms of this kind have been published before, so the novelty of the study is low.","keywords":["artificial lift","fault detection","conformal prediction","alarm threshold","Petrobras 3W"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. The claim document of the product was not found; the attorney must review claim 1566."},"s_ps":{"profile":"keai","product":"process_twin","title":"Soft Sensing of Melt Index in Multi-Grade Polyethylene Production: A Negative Result against the Last-Laboratory-Value Baseline","abstract":"Soft sensors that estimate the melt index of polyethylene online are proposed to replace delayed laboratory results, but they must beat the simplest possible baseline. We evaluate soft sensors on the public industrial SRMG multi-grade polyethylene data (331 samples; research use only, after Liu, Gao and Chen, 2013). Linear models failed the validity checks, tree-based models reached an R² of about 0.3, and none of the models beat the baseline that repeats the last laboratory value of the same grade, which had an RMSE of 0.262. We report this as a negative result: with this small data set a soft sensor is not better than the information already available from the laboratory. Rolling-origin evaluation, just-in-time learning, a comparison with published SRMG results and the clarification of the adjacent filing 3869 are [to be measured]. The study gives plant engineers a clear benchmark that any proposed soft sensor for grade transitions should be required to beat.","keywords":["soft sensor","melt index","polyethylene","grade transition","negative result"],"draft_note":"Numbers are the results recorded for this venue in the page database (owner's own runs). Check them against the paper-drafts before use; anything marked [to be measured] has not been measured. The claim document of the product was not found; filing 3869 is adjacent. The data licence allows academic research only."}},"products":{"hqca":{"name":"HQCA – Hybrid quantum-classical drug discovery","new":false,"repo":"HQCA-Hybrid-Quantum-Classical-Drug-Discovery"},"stratguard":{"name":"StratGuard – Certified facies interpretation","new":true,"repo":"articles-stratguard-facies"},"qshot":{"name":"Shot-Budget Lab (qshot-lab)","new":true,"repo":"articles-qshot-lab"},"ipind":{"name":"IPIND – Intelligent nanocarrier design","new":false,"repo":"N---Barekat---IPIND---Intelligent-Platform-for-Integrated-Nanocarrier-Design"},"apexasset":{"name":"ApexAsset AI – Asset life-cycle digital twin","new":false,"repo":"-ApexAsset-AI"},"hydrogate":{"name":"HydroGate – Streamflow forecasting","new":true,"repo":"articles-hydrogate-streamflow"},"fidps":{"name":"FIDPS / FCDD – Formation damage prevention","new":false,"repo":"FIDPS---Intelligent-Formation-Integrity-damage-prevention-system-"},"qgridpart":{"name":"QGrid-Part","new":true,"repo":"articles-qgrid-part"},"gas_turbine":{"name":"Gas turbine digital twin","new":false,"repo":"digital-twine-gas-turbine"},"lnp":{"name":"LNP – Gene-carrier design","new":false,"repo":"barekat-gen-therapy"},"qrngaudit":{"name":"QRNG-Audit","new":true,"repo":"articles-qrng-audit"},"pgx":{"name":"Genomics & pharmacogenomics platform","new":false,"repo":"barekat-Genomics"},"stretchwatch":{"name":"StretchWatch – VQE starting-point quality","new":true,"repo":"articles-stretchwatch-vqe"},"explainguard":{"name":"ExplainGuard – Explanation faithfulness","new":true,"repo":"articles-explainguard-faithfulness"},"nuclear":{"name":"Nuclear reactor digital twin","new":false,"repo":"Digital-twin---nuc---reac"},"terminals":{"name":"Smart terminals & tanks","new":false,"repo":"inno-terminals-tanks"},"readmitcal":{"name":"ReadmitCal – Readmission risk calibration (diabetes)","new":true,"repo":"articles-readmitcal-diabetes"},"wearshift":{"name":"WearShift – Distribution shift in wearable HAR","new":true,"repo":"articles-wearshift-har"},"ilift":{"name":"IntelliLift – Artificial lift management","new":false,"repo":"i-lift---AI-Powered-Artificial-Lift-Management-Dashboard"},"process_twin":{"name":"Petrochemical process digital twin","new":false,"repo":"inno-Khalij-AryaSasol-MultiGrade-PE-Transition-Optimization-System-"}},"branch":"article-submission-content"};/*ABS-END*/
// Abstract drafts per venue: one Word file each (abstract in the venue's format on page 1, internal submission sheet on page 2).
const ABS_GH = "https://github.com/parsasohrab1/";
const absOf = id => (S.absDb&&S.absDb[id]) || ABS.abstracts[id];
const absProd = a => (a.product&&typeof a.product==="object") ? {name:"",repo:"",new:false,...a.product} : (ABS.products[a.product]||{name:String(a.product||"—"),repo:"",new:false});
const absProf = a => ABS.profiles[a.profile]||ABS.profiles.easychair;
const absWords = t => (String(t).match(/\S+/g)||[]).length;
async function buildAbstractDocx(v,a){
  const pr=absProf(a), prod=absProd(a), n=absWords(a.abstract);
  const run=(t,{b=false,i=false,sz=22,color=""}={})=>`<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${b?"<w:b/>":""}${i?"<w:i/>":""}${color?`<w:color w:val="${color}"/>`:""}<w:sz w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${WX(t)}</w:t></w:r>`;
  const par=(inner,{jc="left",after=120,line=276}={})=>`<w:p><w:pPr><w:spacing w:after="${after}" w:line="${line}" w:lineRule="auto"/><w:jc w:val="${jc}"/></w:pPr>${inner}</w:p>`;
  const cell=(w,inner)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/></w:tcPr>${inner}</w:tc>`;
  const row=(k,val)=>`<w:tr>${cell(2400,par(run(k,{b:true,sz:20}),{after:40}))}${cell(6638,par(run(val,{sz:20}),{after:40}))}</w:tr>`;
  const type={journal:"Journal",special:"Journal special issue",conf:"Conference"}[v.type]||v.type;
  const repo=prod.repo?(ABS_GH+prod.repo+(prod.new?"":"/tree/"+ABS.branch)):"—";
  const todo="Check the limits against the venue's author guidelines (they are typical values for the venue family, not copied from the call). Add co-authors if any. Patent rule: methods covered by the product's filed claims are not disclosed here; a patent attorney must review before submission."+(a.draft_note?" "+a.draft_note:"");
  const rows=[["Venue",v.name],["Type",type],["Deadline",(v.deadline||"not stated")+(v.dl_note?" – "+v.dl_note:"")],["Official page",v.url||""],

async function followAssign(k, only){

  for(const a of list){ const p=pipeState(a);

}

const SUBMIT_DESC = (a,t) => `ثبت چکیده و ثبت‌نام در «${a.name}»${a.deadline?` (ددلاین ${a.deadline})`:""}.\n\nمعیار پذیرش:\n۱) پیش‌نویس چکیده در پوشه‌ی paper-drafts بازبینی و نهایی شود.\n۲) بازبینی وکیل ثبت اختراع انجام شده و تأیید کتبی دارد (پیش از هر ارسال الزامی است).\n۳) قالب، شکل‌ها، فرم‌ها، وابستگی نویسنده و اظهار منافع طبق راهنمای مقصد آماده شود${a.url?` (${a.url})`:""}.\n۴) چکیده با حساب شخصی در سامانه‌ی مقصد ثبت و ثبت‌نام انجام شود؛ رسید یا شماره‌ی پیگیری در همین تسک یادداشت شود.\n${t&&t.result?`\nنتیجه‌ی کار Claude:\n${t.result}`:""}`;
const submitVenues = () => { const seen=new Set(), out=[]; for(const t of S.ct){ if(!t.venue||seen.has(t.venue)) continue; seen.add(t.venue); const a=artAll().find(x=>x.id===t.venue); if(a) out.push({a,ct:t}); } return out.sort((x,y)=>(x.a.deadline||"9999").localeCompare(y.a.deadline||"9999")); };
const submitTaskOf = vid => S.tasks.find(t=>t.kind==="submit"&&t.venue===vid);
async function submitAssign(who, only){
  if(!isAdmin()){ toast("فقط مدیر می‌تواند تسک تعریف یا واگذار کند."); return false; }
  if(!who){ toast("ابتدا یک نفر را انتخاب کنید."); return false; }
  const list=submitVenues().filter(v=>!only||v.a.id===only); let n=0, now=nowIso();
  for(const {a,ct} of list){
    const ex=submitTaskOf(a.id);
    if(ex){ if(ex.assignee===who||ex.status==="done"||ex.status==="approved") continue; const {id:_i,...rec}=ex; if(!await save(`tasks/${ex.id}`,{...rec,assignee:who,updated:now},"")) return false; n++; }
    else { const m=S.members.find(x=>x.id===who)||{};
      if(!await save(`tasks/${newId()}`,{title:`ثبت چکیده و ثبت‌نام – ${a.name.split("–")[0].trim()}`,desc:SUBMIT_DESC(a,ct),type:"task",points:null,sprint:"",priority:"high",assignee:who,team:m.team||"ai",due:a.deadline||today(),blocked:false,blocker_note:"",status:"todo",kind:"submit",venue:a.id,created_by:S.me.id,created:now,updated:now},"")) return false; n++; }
  }
  toast(n?`${faNum(n)} تسک برای ${memberName(who)} تعریف/واگذار شد و اعلان آن به او نمایش داده می‌شود.`:"همه‌ی تسک‌ها از قبل به همین فرد سپرده شده یا انجام‌شده‌اند.");
  return true;
}

async function humAssign(k,who,only){
  if(!isAdmin()){ toast("فقط مدیر می‌تواند تسک تعریف یا واگذار کند."); return false; }
  if(!who){ toast("ابتدا یک نفر را انتخاب کنید."); return false; }
  let n=0; const now=nowIso(), m=S.members.find(x=>x.id===who)||{};
  for(const it of HUM[k].items().filter(x=>!only||x.id===only)){
    const ex=humTaskOf(k,it.id);
    if(ex){ if(ex.assignee===who||ex.status==="done"||ex.status==="approved") continue; const {id:_i,...rec}=ex; if(!await save(`tasks/${ex.id}`,{...rec,assignee:who,updated:now},"")) return false; n++; }

const DB_CHUNK = 150000, DB_MAX = 8*1024*1024;   // a database document may hold 256 KiB of JSON; 150000 bytes become 200000 base64 characters
function b64Of(u8){ let s=""; const k=0x8000; for(let i=0;i<u8.length;i+=k) s+=String.fromCharCode.apply(null,u8.subarray(i,i+k)); return btoa(s); }
async function dbUploadFile(taskId, f, sha){   // fallback for viewers who do not get the asset store: the file is split into base64 chunks kept in the shared database
  const buf=new Uint8Array(await f.arrayBuffer()), n=Math.max(1,Math.ceil(buf.length/DB_CHUNK)), key=newId();
  for(let i=0;i<n;i++){
    await S.db.doc(`taskfiles/${taskId}__${key}__${String(i).padStart(3,"0")}`).set({task:taskId,key,name:f.name,i,n,size:f.size,type:f.type||"",sha256:sha,b64:b64Of(buf.subarray(i*DB_CHUNK,(i+1)*DB_CHUNK)),by:S.me.id,at:new Date().toISOString()});
    if(n>1) toast(`«${f.name}»: بخش ${faNum(i+1)} از ${faNum(n)}`);
  }
  return {key,chunks:n};
}
async function upFiles(taskId, files, stub){
  const t=(S.tasks||[]).find(x=>x.id===taskId)||stub; if(!t||!files.length) return;
  if(!S.db){ toast("اتصال به پایگاه داده برقرار نیست."); return; }
  const ups=[...(t.uploads||[])]; let n=0;
  for(const f of files){
    const viaDb=!S.assets, lim=viaDb?DB_MAX:UP_MAX;
    if(f.size>lim){ toast(`«${f.name}» بزرگ‌تر از ${faNum(Math.round(lim/1048576))} مگابایت است؛ آن را تقسیم کنید.`); continue; }
    toast(`در حال بارگذاری «${f.name}»…`);
    try{ const sha=await sha256Hex(f); let rec;
      if(!viaDb){
        try{ const r=await S.assets.upload(f); rec={id:r.id,url:r.url}; }
        catch(e1){   // invited outside members may only add images, fonts and scripts to the asset store; other types go to the shared database like for viewers without a file store
          if(f.size>DB_MAX) throw e1;
          console.warn("asset store refused the file; storing it in the database",e1);
          const r=await dbUploadFile(taskId,f,sha); rec={store:"db",key:r.key,chunks:r.chunks};
        }
      }
      else { const r=await dbUploadFile(taskId,f,sha); rec={store:"db",key:r.key,chunks:r.chunks}; }
      ups.push({...rec,name:f.name,size:f.size,type:f.type||"",sha256:sha,by:S.me.id,at:new Date().toISOString()}); n++; }
    catch(e){ console.error("upload",e); toast(`«${f.name}» بارگذاری نشد: `+(e.message||e.code||"")); }
  }
  if(!n) return;
  const {id:_,...cur}=t;
  await save("tasks/"+taskId,{...cur,uploads:ups,status:t.status==="todo"?"doing":t.status,updated:new Date().toISOString()},`${faNum(n)} فایل بارگذاری شد`);
}

}

      if(sc.abs){ const b=sc.bands.find(x=>s<x[0]); out.scales.push({key,name:sc.name,score:faNum(s)+" از "+faNum(n*3),level:b[1],cls:b[2],flag,pct:Math.round(100*s/(n*3))}); return; }
      const pct=Math.round(100*s/(n*3)); out.scales.push({key,name:sc.name,score:faNum(pct)+"٪",level:pct<25?"پایین":pct<50?"متوسط":"بالا",cls:pct<25?"ok":pct<50?"warn":"bad",flag,pct,urgent:!!sc.urgent&&pct>=50}); });

function mindInterpret(r){
  const code=["EI","SN","TF","JP"].map(d=>r.type[d].letter).join(""), T=(MIND_TYPES[code]||"").split("|");
  const dims=["EI","SN","TF","JP"].map(d=>{ const x=r.type[d], mid=x.strength<20; return `<li><b>${esc(MIND_NAMES[x.letter])} (${x.letter}) – ${mid?"گرایش ملایم":x.strength>=60?"گرایش قوی":"گرایش متوسط"}:</b> ${esc(MIND_DIM_TXT[x.letter])}${mid?" شما به هر دو سوی این بعد نزدیک هستید و بسته به موقعیت جابه‌جا می‌شوید.":""}</li>`; }).join("");
  const dark=r.scales.filter(x=>x.dark).map(x=>`<li><b>${esc(x.name)} – ${esc(x.level)}:</b> ${esc(MIND_DARK_TXT[x.key][x.cls])}</li>`).join("");
  const clin=r.scales.filter(x=>!x.dark&&x.cls!=="ok").map(x=>`<li><b>${esc(x.name)} – ${esc(x.level)}:</b> ${esc(MIND_CLIN_TXT[x.key])}</li>`).join("");
  return `<div class="card" style="margin-bottom:10px"><h3 style="margin-top:0">تفسیر کامل شخصیت – ${esc(T[0]||code)}</h3>
   <p>${esc(T[1]||"")}</p>
   <h4>ابعاد چهارگانه</h4><ul>${dims}</ul>
   <p><b>نقاط قوت:</b> ${esc(T[2]||"")}</p><p><b>نقاط کور و ریسک‌ها:</b> ${esc(T[3]||"")}</p><p><b>در محیط کار:</b> ${esc(T[4]||"")}</p><p><b>پیشنهاد رشد:</b> ${esc(T[5]||"")}</p>
   <h4>صفات تاریک شخصیت</h4><ul>${dark}</ul>
   <h4>وضعیت روانی</h4>${clin?`<ul>${clin}</ul>`:'<p>در هیچ حوزه‌ی غربالگری نشانه‌ی قابل‌توجهی دیده نشد. حفظ خواب منظم، ورزش، ارتباط اجتماعی و استراحت، سرمایه‌ی روانی شماست.</p>'}</div>`;
}
function mindResult(ans, who){
  const r=mindScore(ans), ty=r.type, code=["EI","SN","TF","JP"].map(d=>ty[d].letter).join("");
  const bars=["EI","SN","TF","JP"].map(d=>{ const x=ty[d]; return `<div style="margin:6px 0"><div class="row" style="justify-content:space-between"><span>${x.a} · ${MIND_NAMES[x.a]}</span><span>${MIND_NAMES[x.b]} · ${x.b}</span></div><div style="background:var(--line);border-radius:4px;height:10px;position:relative"><i style="position:absolute;inset-block:0;inset-inline-start:0;width:${x.pct}%;background:var(--signal);border-radius:4px"></i></div><span class="meta">گرایش به ${MIND_NAMES[x.letter]} (${faNum(Math.round(x.strength))}٪ شدت)</span></div>`; }).join("");
  const clin=r.scales.filter(x=>!x.dark), dark=r.scales.filter(x=>x.dark), pill=x=>`<span class="pill p-${x.cls}">${esc(x.level)}</span>`;
  const subj=who?`${esc(who)}`:"شما";
  const crisis=r.crisis.length?`<div class="banner bad"><b>${who?`وضعیت روانی ${subj} بحرانی/نیازمند توجه جدی شناسایی شد`:"وضعیت روانی شما نیازمند توجه جدی است"}: ${esc(r.crisis.join("؛ "))}.</b><br>${who?"به این فرد":"به شما"} <b>حتماً مراجعه به روان‌درمانگر (تراپی)</b> یعنی روان‌پزشک یا روان‌شناس بالینی توصیه می‌شود؛ هرچه زودتر بهتر. ${r.urgent?"<br><b>اگر فکر خودکشی یا آسیب به خود یا صدا و ترس‌های کنترل‌نشدنی هست، همین حالا با یک فرد مورد اعتماد یا اورژانس تماس بگیرید (ایران: ۱۱۵، اورژانس اجتماعی ۱۲۳، مشاوره‌ی بهزیستی ۱۴۸۰؛ ترکیه: ۱۱۲).</b>":""}${who?"<br>این یک غربالگری است و نه تشخیص؛ با احترام و محرمانگی و بدون تصمیم تنبیهی با فرد در میان بگذارید.":""}</div>`:"";
  return `${crisis}<div class="banner">این نتیجه فقط یک غربالگری و خودآگاهی است و <b>تشخیص نیست</b>. تشخیص اختلالات فقط با مصاحبه‌ی بالینی ممکن است.</div>
  <div class="grid2"><div class="card"><h3 style="margin-top:0">تیپ شخصیتی: <span class="mono">${code}</span></h3>${bars}<p class="note">بر پایه‌ی تیپ‌شناسی یونگ؛ نسخه‌ی رسمی MBTI® نیست.</p></div>
  <div class="card"><h3 style="margin-top:0">صفات تاریک شخصیت</h3>${table(["صفت","امتیاز","سطح"],dark.map(x=>`<tr>${td("صفت",esc(x.name),"t")}${td("امتیاز",`<span class="mono">${esc(x.score)}</span>`)}${td("سطح",pill(x))}</tr>`))}</div></div>
  <h3>غربالگری نشانه‌های روانی</h3>${table(["حوزه","امتیاز","سطح نشانه"],clin.map(x=>`<tr>${td("حوزه",esc(x.name),"t")}${td("امتیاز",`<span class="mono">${esc(x.score)}</span>`)}${td("سطح",pill(x))}</tr>`))}${mindInterpret(r)}`;
}

}

function tourHighlight(){
  document.querySelectorAll(".tour-hl").forEach(el=>el.classList.remove("tour-hl"));
  if(!S.tour) return;
  const st=TOUR[S.tour.i], pick=q=>{ const el=document.querySelector(q); if(el) el.classList.add("tour-hl"); return el; };
  if(st.sel) pick(st.sel);
  else { if(st.mod) pick(`[data-act=mod][data-k=${st.mod}]`); if(st.sub) pick(`[data-act=sub][data-k=${st.sub}]`); }
}
function tourPaint(){
  const box=$("#tour"); if(!S.tour){ box.hidden=true; box.innerHTML=""; tourHighlight(); return; }
  const i=S.tour.i, st=TOUR[i];
  box.hidden=false;
  box.innerHTML=`<div class="card" role="dialog" aria-label="آموزش سامانه"><div class="bar2"><i style="width:${Math.round(100*(i+1)/TOUR.length)}%"></i></div>
   <div class="row"><h3 style="flex:1">${esc(st.title)}</h3><span class="meta mono">${faNum(i+1)} / ${faNum(TOUR.length)}</span></div><p>${esc(st.text)}</p>
   <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="tour-prev"${i===0?" disabled":""}>قبلی</button>
    <button class="btn sig sm" data-act="tour-next">${i===TOUR.length-1?"پایان آموزش":"بعدی"}</button><span class="grow"></span><button class="btn ghost sm" data-act="tour-skip">رد کردن آموزش</button></div></div>`;
  tourHighlight();
}
function tourGo(i){
  if(!S.tour) return;
  S.tour.i=Math.max(0,Math.min(TOUR.length-1,i)); const st=TOUR[S.tour.i];
  if(st.mod){ S.mod=st.mod; S.sub=st.sub||SUBS[st.mod][0][0]; S.q=""; S.forceFull=true; }
  closeForm(); render(); tourPaint();
  const el=document.querySelector(".tour-hl"); if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest",inline:"center"});
}
function tourStart(){ S.tour={i:0}; tourGo(0); }
async function tourEnd(finished){
  S.tour=null; tourPaint();
  try{ localStorage.setItem("ppt-tour","1"); }catch(e){}
  const me=myMember();
  if(me&&!me.tour_done&&S.db){ try{ await S.db.doc(`members/${me.id}`).set({...me,tour_done:new Date().toISOString()}); }catch(e){} }
  toast(finished?"آموزش تمام شد؛ هر زمان خواستید از «راهنما» دوباره ببینید.":"آموزش بسته شد؛ از دکمه‌ی «راهنما» می‌توانید به آن برگردید.");
}
